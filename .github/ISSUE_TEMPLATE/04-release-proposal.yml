name: Release proposal
description: Propose a reviewed aggregate platform release
title: "[Task]: Prepare platform release "
labels:
  - "status: triage"
  - "release: platform"
type: Task

body:
  - type: markdown
    attributes:
      value: A proposal starts review; it does not authorize tagging, publication, adoption, or deployment.
  - type: input
    id: version
    attributes:
      label: Proposed version
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: dropdown
    id: provenance
    attributes:
      label: Provenance mode
      description: Use bootstrap only for the repository's first exact v0.1.0 release.
      options:
        - Signed predecessor
        - One-time v0.1.0 bootstrap
    validations:
      required: true
  - type: input
    id: previous
    attributes:
      label: Previous release tag
      description: Required for signed-predecessor releases; leave empty only for the v0.1.0 bootstrap.
      placeholder: vX.Y.Z or empty for bootstrap
  - type: textarea
    id: changes
    attributes:
      label: Included changes and affected contracts
      description: Link every included issue and pull request, including breaking changes.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration contract
      description: State fresh-install support, supported source tags, downgrade policy, and recovery action.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Release evidence and acceptance criteria
      description: Link validation, migration, provenance, artifact, and known-exclusion evidence.
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Adoption plan and unresolved risks
      description: Describe client order, blockers, exceptions, and explicit non-goals without authorizing rollout.
    validations:
      required: true
