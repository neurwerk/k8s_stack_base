name: Release proposal
description: Propose a platform release
labels:
  - "status: triage"
  - "release: platform"
type: Task
body:
  - type: input
    id: version
    attributes:
      label: Target version
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this release?
      description: Briefly describe the changes to include.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Supporting links (optional)
      description: Link related issues or pull requests. Detailed release evidence belongs in release review.
