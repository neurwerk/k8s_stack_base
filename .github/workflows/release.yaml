name: Verify Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: release-tooling
          persist-credentials: false

      - name: Checkout release tag as data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          path: release-data
          persist-credentials: false

      - name: Verify signer and default-branch ancestry with trusted tooling
        working-directory: release-data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PLATFORM_RELEASE_ALLOWED_SIGNER: ${{ vars.PLATFORM_RELEASE_ALLOWED_SIGNER }}
          PLATFORM_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/release-tooling/release/trust/platform-release.sshpub
        run: |
          bash ../release-tooling/scripts/verify_release_tag.sh "$GITHUB_REF_NAME"
          git fetch origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor \
            "$GITHUB_REF_NAME^{commit}" "refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify Python lockfile
        working-directory: release-data
        run: uv lock --check

      - name: Validate signed release data
        working-directory: release-data
        run: |
          uv run --project ../release-tooling --frozen python \
            ../release-tooling/scripts/platform_release.py inspect-release \
            --release-root . --tag "$GITHUB_REF_NAME"
          make release-check TAG="$GITHUB_REF_NAME"

      - name: Record verified tag
        run: printf '%s\n' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-tag.txt"

      - name: Upload verified release identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-platform-release
          path: ${{ runner.temp }}/release-tag.txt
          retention-days: 1
          if-no-files-found: error
