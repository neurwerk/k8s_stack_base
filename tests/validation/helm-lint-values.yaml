# Synthetic, non-secret values used by the chart validation targets.
# HelmRelease ConfigMaps and Secrets provide these values in deployments.
contextforge:
  enabled: true
  tls:
    enabled: true
agentgateway:
  inspection:
    enabled: true
    rootIds: [r1, r2]
    monitoring:
      enabled: true
    trust:
      enabled: true
      # Use the verified runtime pin: release image inventory also renders this file.
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.12.0@sha256:b70f0f93ca2c3e5cef9290af2db6480bec72cedc0289ecd232747996eb01091a
      operation: promote
      roots:
        - id: r1
          fingerprintSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          state: active
        - id: r2
          fingerprintSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          state: transitional
      kubernetesApiEgress:
        - cidr: 192.0.2.1/32
          port: 6443
addon:
  role: example
  passwordSecret: example-postgres-values
  databases:
    - name: example_data
      vector: false
addonAccess:
  enabled: true
  name: example
  realmRoles: [example-user, example-admin]
  realmRoleComposites:
    example-admin: [example-user]
  accessGroups:
    /access/neurwerk-example-users: {realmRoles: [example-user]}
  platformAdminRole: example-admin
k8sTools:
  # Synthetic render of the new chart only; do not update existing consumers.
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.12.0@sha256:b70f0f93ca2c3e5cef9290af2db6480bec72cedc0289ecd232747996eb01091a
docling:
  enabled: true
  apiKeySecretRef: {name: docling-api, key: api-key}
  inference:
    url: https://inference.example.test/v1/chat/completions
    model: granite-docling
    tokenSecretRef: {name: docling-inference, key: token}
    cidrs: [10.20.30.40/32]
wireguard:
  enabled: true
  serverKeySecret: wireguard-server-key
  virtualIP: 192.0.2.10
  target:
    serviceIP: 198.51.100.10
    servicePort: 443
    namespace: example-app
    podSelector: {app.kubernetes.io/name: example-app}
    podPort: 3000
  outerSourceCIDRs: [203.0.113.1/32]
authKeycloak:
  hostname: lint.example
  adminUser: lint-admin
  realm: lint
  realmDisplayName: lint
  initialAdminUsername: lint-admin
  initialAdminEmail: admin@lint.example
  initialAdminFirstName: Lint
  initialAdminLastName: Administrator
  agentgatewayClientRoles:
    - llm:invoke
    - model:remote/example/model:invoke
    - provider:openai:company-use
  smtp:
    enabled: true
    host: smtp.example.test
    port: 465
    from: no-reply@lint.example
    ssl: true
    starttls: false
  keycloak:
    resources:
      requests: {cpu: 1m, memory: 1Mi}
      limits: {cpu: 1m, memory: 1Mi}
authKeycloakSecrets:
  adminPassword: lint
  dbPassword: lint
certManager:
  email: admin@lint.example
  dnsZones:
    - lint.example
  aws:
    accessKeyId: lint
    secretAccessKey: lint
mcp-servers:
  enabled: false
infraAgentgatewayWrapper:
  hostname: agentgateway.lint.example
aiGateway:
  enabled: true
self-hosted-api-providers: []
external-subscription-providers: []
external-api-providers:
    - id: example
      enabled: true
      providerId: openai
      provider: OpenAI
      upstreamURL: https://provider.lint.example
      credentialSources: [company]
      authSecret: example-provider-key
      routes:
        api: {enabled: true}
        inspected: {enabled: false}
      profiles: [openai-chat-completions-v1]
      models:
        - name: remote/example/model
          upstreamModel: example-model
          piiEnabled: true
          contentTracingEnabled: true
infraAgentgatewayWrapperSecrets:
  databasePassword: lint-agentgateway-database-password
  providerCredentials:
    example-provider-key: lint-provider-credential
guardrails:
  llmPolicyEngine:
    enabled: true
    models:
      - name: remote/example/model
        provider: OpenAI
        model: example-model
        baseURL: https://provider.lint.example
        piiEnabled: true
        contentTracingEnabled: true
monitorLangfuseWrapper:
  hostname: langfuse.lint.example
frontendStudio:
  studio:
    hostname: studio.lint.example
externalGateway:
  enabled: true
publicCertificates:
  useProduction: false
postgresAuth:
  persistence:
    storageClassName: infra-rook-ceph-rbd
postgresAuthSecrets:
  adminPassword: lint-postgres-auth-admin
  keycloakPassword: lint-postgres-auth-keycloak
postgresOperations:
  persistence:
    storageClassName: infra-rook-ceph-rbd
postgresOperationsSecrets:
  adminPassword: lint-postgres-operations-admin
  agentgatewayPassword: lint-postgres-operations-agentgateway
  langfusePassword: lint-postgres-operations-langfuse
infraRookCeph:
  objectStore:
    publicHostname: objects.lint.example
    externalGateway:
      enabled: true
  storage:
    nodeName: lint-node
    devicePath: /dev/disk/by-id/lint-device
infraOpenbaoWrapper:
  tls:
    clusterDomain: cluster.local
  monitoring:
    prometheusRule:
      snapshotAge:
        enabled: false
monitorKubePrometheusStack:
  alerting:
    email:
      enabled: true
      host: smtp.example.test
      port: 465
      from: no-reply@lint.example
      to: admin@lint.example
      authUsername: lint-smtp-user
      authPassword: lint-smtp-password
