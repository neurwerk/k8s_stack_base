# Synthetic offline plan, not runtime values or a device enrollment record.
access:
  boundary: internet
  default: internal
certificates:
  profile: public-production
canonicalEndpointRouting:
  mode: internal-traefik
addonDependencies:
  example-app:
    required: [keycloak]
    optional: {files: example-files}
  example-files:
    required: []
  example-admin:
    required: [example-app, keycloak]
endpoints:
  keycloak:
    level: restricted
    devices: [device-a, device-b]
  example-app:
    level: restricted
    devices: [device-a]
    features:
      files: true
  example-files:
    level: restricted
    devices: [device-a]
  example-admin:
    level: restricted
    devices: [device-a]
