apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitor-fluent-bit
resources:
  - app.yaml
  - shared.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: base-shared-resources-config-map
    files:
      - values.yaml=../shared/resources.yaml
