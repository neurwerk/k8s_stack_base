apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Client Flux stage requires namespace/values, ESO, trust, and OpenBao secret-sync
# readiness, NOT the entire infrastructure stage: PostgreSQL provisioning needs
# forgejo-postgres-values before infrastructure can become Ready when enabled.
# This path is the sole inventory owner of all three optional deliveries.
resources:
  - runtime.yaml
  - postgres.yaml
  - oidc.yaml
