apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: infra-rook-ceph
spec:
  releaseName: infra-rook-ceph
  targetNamespace: infra-rook-ceph
  interval: 5m
  timeout: 50m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: cert-manager-approval-policy
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/rook-ceph
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: base-shared-resources-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: rook-ceph-product-values
      valuesKey: values.yaml
