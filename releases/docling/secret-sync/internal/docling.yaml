apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: docling-external-secrets
  namespace: docling
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["docling-external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: docling-external-secrets
  namespace: docling
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: docling-external-secrets}
subjects:
  - kind: ServiceAccount
    name: infra-external-secrets
    namespace: infra-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docling-external-secrets
  namespace: docling
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: docling-openbao-secret-store
  namespace: docling
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: docling
          serviceAccountRef:
            name: docling-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docling-api
  namespace: docling
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: docling-openbao-secret-store
    kind: SecretStore
  target:
    name: docling-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: docling/internal
        property: apiKey
