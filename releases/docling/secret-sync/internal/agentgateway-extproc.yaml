apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-agentgateway-extproc-external-secrets
  namespace: monitor-agentgateway-extproc
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monitor-agentgateway-extproc-openbao-secret-store
  namespace: monitor-agentgateway-extproc
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitor-agentgateway-extproc
          serviceAccountRef:
            name: monitor-agentgateway-extproc-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitor-agentgateway-extproc-docling-secret
  namespace: monitor-agentgateway-extproc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: monitor-agentgateway-extproc-openbao-secret-store
    kind: SecretStore
  target:
    name: monitor-agentgateway-extproc-docling-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: monitor-agentgateway-extproc/internal
        property: doclingApiKey
