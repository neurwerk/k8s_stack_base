apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-external-secrets
  namespace: tailscale
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tailscale-openbao-secret-store
  namespace: tailscale
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      # Before selecting credential delivery, the namespace-owning client Flux
      # Kustomization must opt into OpenBao trust in its own spec.patches;
      # this store cannot become ready until that CA bundle is delivered.
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tailscale
          serviceAccountRef:
            name: tailscale-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tailscale-openbao-secret-store
    kind: SecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/external
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale/external
        property: client_secret
