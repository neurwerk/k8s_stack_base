apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  releaseName: tailscale-operator
  suspend: true
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: ./charts/tailscale/operator
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-product-values
      valuesKey: values.yaml
