apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch-dashboards
  namespace: monitor-opensearch
spec:
  releaseName: monitor-opensearch-dashboards
  targetNamespace: monitor-opensearch
  interval: 5m
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: opensearch
      namespace: monitor-opensearch
  chart:
    spec:
      chart: ./charts/opensearch/dashboards
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
