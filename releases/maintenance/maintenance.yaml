apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintenance
  namespace: maintenance
spec:
  releaseName: maintenance
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: traefik
      namespace: kube-system
  chart:
    spec:
      chart: ./charts/maintenance
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: maintenance-product-values
      valuesKey: values.yaml
      optional: true
