apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Select this INSTEAD of secret-sync for the temporary database OAuth backend.
# It retains the existing Secret/SecretStore owners without fetching a Vault token.
resources:
  - ../runtime.yaml
  - ../postgres.yaml
  - ../openbao-network-policy.yaml
patches:
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: contextforge-runtime
    patch: |-
      - op: remove
        path: /spec/target/template/data/VAULT_TOKEN
      - op: test
        path: /spec/data/6/secretKey
        value: vaultToken
      - op: remove
        path: /spec/data/6
