apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: contextforge
  namespace: contextforge
spec:
  releaseName: contextforge
  interval: 5m
  # Covers the five-minute migration Job and application startup.
  timeout: 12m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  dependsOn:
    - name: contextforge-postgres
      namespace: infra-postgres-operations
  chart:
    spec:
      chart: ./charts/contextforge
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: contextforge-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: contextforge-product-values
      valuesKey: values.yaml
