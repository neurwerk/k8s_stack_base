apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contextforge-postgres
  namespace: infra-postgres-operations
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres-operations}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: contextforge}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: contextforge
              app.kubernetes.io/instance: contextforge
              app.kubernetes.io/component: application
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: contextforge}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: contextforge
              app.kubernetes.io/instance: contextforge
              app.kubernetes.io/component: migration
      ports:
        - {protocol: TCP, port: 9712}
