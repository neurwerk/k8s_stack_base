apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contextforge-oauth-apps
  namespace: contextforge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: contextforge-openbao-secret-store
    kind: SecretStore
  target:
    name: contextforge-oauth-apps
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: contextforge/provider-apps
