apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: contextforge-certificates
  namespace: contextforge
spec:
  releaseName: contextforge-certificates
  interval: 5m
  timeout: 10m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  waitStrategy:
    name: poller
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      inProgress: '!status.conditions.exists(c, c.type == "Ready" && c.status == "True" && c.observedGeneration == metadata.generation)'
      current: status.conditions.exists(c, c.type == "Ready" && c.status == "True" && c.observedGeneration == metadata.generation)
  dependsOn:
    - name: cert-manager-approval-policy
      namespace: infra-cert-manager
    - name: cert-manager-internal-issuer
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/contextforge/certificates
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: contextforge-product-values
      valuesKey: values.yaml
