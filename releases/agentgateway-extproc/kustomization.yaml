apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitor-agentgateway-extproc
resources:
  - app.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: base-shared-resources-config-map
    files:
      - values.yaml=../shared/resources.yaml
  - name: monitor-agentgateway-extproc-app-defaults
    files:
      - values.yaml=app-defaults.yaml
