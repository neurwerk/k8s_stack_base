apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-approver-policy
  namespace: infra-cert-manager
spec:
  releaseName: infra-cert-manager-approver-policy
  interval: 5m
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  waitStrategy:
    name: poller
  dependsOn:
    - name: cert-manager-controller
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/cert-manager/approver-policy
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
