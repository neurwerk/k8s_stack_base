apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-internal-issuer
  namespace: infra-cert-manager
spec:
  releaseName: infra-cert-manager-internal-issuer
  targetNamespace: infra-cert-manager
  interval: 5m
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  waitStrategy:
    name: poller
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      inProgress: status.conditions.filter(e, e.type == 'Ready').exists(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').exists(e, e.status == 'True')
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      inProgress: status.conditions.filter(e, e.type == 'Ready').exists(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').exists(e, e.status == 'True')
  dependsOn:
    - name: cert-manager-approval-policy
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/cert-manager/internal-issuer
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
