apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-controller
  namespace: infra-cert-manager
spec:
  releaseName: infra-cert-manager-controller
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  timeout: 15m
  waitStrategy:
    name: poller
  dependsOn:
    - name: traefik
      namespace: kube-system
  chart:
    spec:
      chart: ./charts/cert-manager/controller
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
