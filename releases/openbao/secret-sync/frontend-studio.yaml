apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-studio-external-secrets
  namespace: frontend-studio
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["frontend-studio-external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-studio-external-secrets
  namespace: frontend-studio
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: frontend-studio-external-secrets}
subjects:
  - kind: ServiceAccount
    name: infra-external-secrets
    namespace: infra-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-studio-external-secrets
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-studio-secret-sync
    app.kubernetes.io/part-of: frontend-studio
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frontend-studio-openbao-secret-store
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-studio-secret-sync
    app.kubernetes.io/part-of: frontend-studio
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: frontend-studio
          serviceAccountRef:
            name: frontend-studio-external-secrets
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-studio-openbao-secret
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-studio-secret-sync
    app.kubernetes.io/part-of: frontend-studio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-studio-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-studio-openbao-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: frontend-studio/internal
        property: opensearchPassword
