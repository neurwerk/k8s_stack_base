apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-studio-external-secrets
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-studio-secret-sync
    app.kubernetes.io/part-of: frontend-studio
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frontend-studio-openbao-secret-store
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-studio-secret-sync
    app.kubernetes.io/part-of: frontend-studio
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: frontend-studio
          serviceAccountRef:
            name: frontend-studio-external-secrets
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-studio-openbao-secret
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: frontend-studio-secret-sync
    app.kubernetes.io/part-of: frontend-studio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-studio-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-studio-openbao-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: frontend-studio/internal
        property: opensearchPassword
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: frontend-studio/internal
        property: langfusePublicKey
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: frontend-studio/internal
        property: langfuseSecretKey
