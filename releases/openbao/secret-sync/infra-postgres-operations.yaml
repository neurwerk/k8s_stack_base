apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-postgres-operations-external-secrets
  namespace: infra-postgres-operations
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: infra-postgres-operations-secret-sync
    app.kubernetes.io/part-of: postgres
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infra-postgres-operations-openbao-secret-store
  namespace: infra-postgres-operations
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: infra-postgres-operations-secret-sync
    app.kubernetes.io/part-of: postgres
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: infra-postgres-operations
          serviceAccountRef:
            name: infra-postgres-operations-external-secrets
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-operations-values
  namespace: infra-postgres-operations
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: infra-postgres-operations-secret-sync
    app.kubernetes.io/part-of: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infra-postgres-operations-openbao-secret-store
    kind: SecretStore
  target:
    name: postgres-operations-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        values.yaml: |
          postgresOperationsSecrets:
            adminPassword: {{ .adminPassword | quote }}
            documentdbPassword: {{ .documentdbPassword | quote }}
            difyPassword: {{ .difyPassword | quote }}
            langfusePassword: {{ .langfusePassword | quote }}
            librechatRagPassword: {{ .librechatRagPassword | quote }}
  data:
    - secretKey: adminPassword
      remoteRef:
        key: infra-postgres-operations/internal
        property: adminPassword
    - secretKey: documentdbPassword
      remoteRef:
        key: infra-postgres-operations/internal
        property: documentdbPassword
    - secretKey: difyPassword
      remoteRef:
        key: infra-postgres-operations/internal
        property: difyPassword
    - secretKey: langfusePassword
      remoteRef:
        key: infra-postgres-operations/internal
        property: langfusePassword
    - secretKey: librechatRagPassword
      remoteRef:
        key: infra-postgres-operations/internal
        property: librechatRagPassword
