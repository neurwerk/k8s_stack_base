apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-langfuse-external-secrets
  namespace: monitor-langfuse
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: monitor-langfuse-secret-sync
    app.kubernetes.io/part-of: monitor-langfuse
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monitor-langfuse-openbao-secret-store
  namespace: monitor-langfuse
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: monitor-langfuse-secret-sync
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitor-langfuse
          serviceAccountRef:
            name: monitor-langfuse-external-secrets
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitor-langfuse-secrets
  namespace: monitor-langfuse
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: monitor-langfuse-secret-sync
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: monitor-langfuse-openbao-secret-store
    kind: SecretStore
  target:
    name: monitor-langfuse-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        values.yaml: |
          monitorLangfuseWrapperSecrets:
            salt: {{ .salt | quote }}
            encryptionKey: {{ .encryptionKey | quote }}
            nextauthSecret: {{ .nextauthSecret | quote }}
            postgresqlPassword: {{ .postgresqlPassword | quote }}
            clickhousePassword: {{ .clickhousePassword | quote }}
            redisPassword: {{ .redisPassword | quote }}
            initUserPassword: {{ .initUserPassword | quote }}
            initProjectPublicKey: {{ .initProjectPublicKey | quote }}
            initProjectSecretKey: {{ .initProjectSecretKey | quote }}
  data:
    - secretKey: salt
      remoteRef:
        key: monitor-langfuse/internal
        property: salt
    - secretKey: encryptionKey
      remoteRef:
        key: monitor-langfuse/internal
        property: encryptionKey
    - secretKey: nextauthSecret
      remoteRef:
        key: monitor-langfuse/internal
        property: nextauthSecret
    - secretKey: postgresqlPassword
      remoteRef:
        key: monitor-langfuse/internal
        property: postgresqlPassword
    - secretKey: clickhousePassword
      remoteRef:
        key: monitor-langfuse/internal
        property: clickhousePassword
    - secretKey: redisPassword
      remoteRef:
        key: monitor-langfuse/internal
        property: redisPassword
    - secretKey: initUserPassword
      remoteRef:
        key: monitor-langfuse/internal
        property: initUserPassword
    - secretKey: initProjectPublicKey
      remoteRef:
        key: monitor-langfuse/internal
        property: initProjectPublicKey
    - secretKey: initProjectSecretKey
      remoteRef:
        key: monitor-langfuse/internal
        property: initProjectSecretKey
