apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: infra-external-secrets
spec:
  releaseName: infra-external-secrets
  targetNamespace: infra-external-secrets
  interval: 5m
  timeout: 15m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  chart:
    spec:
      chart: ./charts/external-secrets
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
