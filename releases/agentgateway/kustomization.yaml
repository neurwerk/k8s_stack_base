apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-agentgateway
resources:
  - app.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: base-shared-hostnames-config-map
    files:
      - values.yaml=../shared/hostnames.yaml
  - name: base-shared-resources-config-map
    files:
      - values.yaml=../shared/resources.yaml
  - name: base-shared-oidc-clients-config-map
    files:
      - values.yaml=../shared/oidc-clients.yaml
  - name: base-shared-pii-config-map
    files:
      - values.yaml=../shared/default-pii-settings.yaml
  - name: base-shared-mcp-config-map
    files:
      - values.yaml=../shared/default-mcp-settings.yaml
  - name: base-shared-openrouter-catalog-config-map
    files:
      - values.yaml=../shared/openrouter-catalog.yaml
