apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-inspection-pki
  namespace: infra-agentgateway
spec:
  releaseName: agentgateway-inspection-pki
  interval: 5m
  timeout: 15m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  waitStrategy: {name: poller}
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Issuer
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      current: status.conditions.exists(c, c.type == 'Synced' && c.status == 'True' && c.observedGeneration == metadata.generation)
  dependsOn:
    - name: cert-manager-approval-policy
      namespace: infra-cert-manager
      readyExpr: dep.metadata.generation == dep.status.observedGeneration && dep.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    - name: trust-manager
      namespace: infra-trust-manager
  chart:
    spec:
      chart: ./charts/agentgateway/inspection-pki
      sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: agentgateway-product-values
      valuesKey: values.yaml
