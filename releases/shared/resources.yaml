langfuse:
  langfuse:
    replicas: 1
    resources:
      requests:
        cpu: 150m
        memory: 1024Mi
      limits:
        cpu: 2000m
        memory: 4Gi
  # PostgreSQL and object storage are external; the chart owns ClickHouse
  # and Valkey. Keeper is required even for a single ClickHouse replica.
  clickhouse:
    cluster:
      resources:
        requests:
          cpu: 300m
          memory: 1024Mi
        limits:
          cpu: 2000m
          memory: 4Gi
    keeper:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

