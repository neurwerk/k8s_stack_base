apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-librechat-admin-panel
  namespace: frontend-librechat
spec:
  releaseName: frontend-librechat-admin-panel
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: librechat
      namespace: frontend-librechat
    - name: traefik
      namespace: kube-system
    - name: cert-manager-issuers
      namespace: infra-cert-manager
  chart:
    spec:
      chart: ./charts/librechat/admin-panel
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: base-shared-hostnames-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-resources-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: frontend-librechat-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: librechat-product-values
      valuesKey: values.yaml
