apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend-librechat-shared
  namespace: frontend-librechat
spec:
  releaseName: frontend-librechat-shared
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  chart:
    spec:
      chart: ./charts/librechat/shared
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: base-shared-hostnames-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-resources-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-mcp-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: frontend-librechat-app-defaults
      valuesKey: values.yaml
    - kind: Secret
      name: frontend-librechat-runtime-secret
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: librechat-product-values
      valuesKey: values.yaml
