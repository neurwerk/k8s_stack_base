apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
  namespace: frontend-librechat
spec:
  releaseName: frontend-librechat
  interval: 5m
  timeout: 20m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: frontend-librechat-shared
      namespace: frontend-librechat
    - name: postgres-operations
      namespace: infra-postgres-operations
    - name: frontend-librechat-valkey
      namespace: frontend-librechat
    - name: frontend-librechat-meilisearch
      namespace: frontend-librechat
    - name: keycloak
      namespace: auth-keycloak
    - name: keycloak-librechat-oidc
      namespace: auth-keycloak
    - name: keycloak-realm-roles
      namespace: auth-keycloak
    - name: agentgateway
      namespace: infra-agentgateway
    - name: traefik
      namespace: kube-system
    - name: cert-manager-issuers
      namespace: infra-cert-manager
    - name: rook-ceph
      namespace: infra-rook-ceph
  chart:
    spec:
      chart: ./charts/librechat/app
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: base-shared-hostnames-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-resources-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: frontend-librechat-app-defaults
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: librechat-product-values
      valuesKey: values.yaml
