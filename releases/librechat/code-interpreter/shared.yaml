apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat-code-interpreter-shared
  namespace: librechat-code-interpreter
spec:
  releaseName: librechat-code-interpreter-shared
  interval: 5m
  timeout: 15m
  install:
    # The retained RBD package claim uses WaitForFirstConsumer and is first
    # consumed by the dependent package-init hook.
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: rook-ceph
      namespace: infra-rook-ceph
  chart:
    spec:
      chart: ./charts/librechat/code-interpreter/shared
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: base-shared-hostnames-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-resources-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: librechat-code-interpreter-app-defaults
      valuesKey: values.yaml
    - kind: Secret
      name: frontend-librechat-code-interpreter-runtime-secret
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: librechat-product-values
      valuesKey: values.yaml
  values:
    frontendLibrechatCodeInterpreter:
      validation:
        production: true
