apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat-code-interpreter
resources:
  - shared.yaml
  - valkey.yaml
  - package-init.yaml
  - file-server.yaml
  - tool-call-server.yaml
  - egress-gateway.yaml
  - worker.yaml
  - api.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: base-shared-hostnames-config-map
    files:
      - values.yaml=../../shared/hostnames.yaml
  - name: base-shared-resources-config-map
    files:
      - values.yaml=../../shared/resources.yaml
  - name: librechat-code-interpreter-app-defaults
    files:
      - values.yaml=app-defaults.yaml
