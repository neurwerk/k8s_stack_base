apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitor-pii-engine
resources:
  - app.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: base-shared-resources-config-map
    files:
      - values.yaml=../shared/resources.yaml
  - name: base-shared-pii-config-map
    files:
      - values.yaml=../shared/default-pii-settings.yaml
  - name: monitor-pii-engine-app-defaults
    files:
      - values.yaml=app-defaults.yaml
