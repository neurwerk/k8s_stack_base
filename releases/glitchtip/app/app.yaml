apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glitchtip
  namespace: glitchtip
spec:
  releaseName: glitchtip
  interval: 5m
  timeout: 25m
  install:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  upgrade:
    strategy: {name: RetryOnFailure, retryInterval: 1m}
  dependsOn:
    - name: glitchtip-postgres
      namespace: infra-postgres-operations
  chart:
    spec:
      chart: ./charts/glitchtip
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
      optional: true
    - kind: ConfigMap
      name: glitchtip-product-values
      valuesKey: values.yaml
      optional: true
