apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-adapter
  namespace: glitchtip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: glitchtip-openbao-secret-store
    kind: SecretStore
  target:
    name: glitchtip-adapter
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        ADAPTER_OPENSEARCH_USERNAME: '{{ if ne .username "glitchtip-adapter" }}{{ fail "Unexpected GlitchTip reader principal" }}{{ end }}{{ .username }}'
        ADAPTER_OPENSEARCH_PASSWORD: '{{ if not .password }}{{ fail "GlitchTip reader password is required" }}{{ end }}{{ .password }}'
        ADAPTER_GLITCHTIP_DSN: '{{ if not .dsn }}{{ fail "GlitchTip DSN is required" }}{{ end }}{{ .dsn }}'
  data:
    - secretKey: username
      remoteRef: {key: glitchtip/adapter, property: opensearchUsername}
    - secretKey: password
      remoteRef: {key: glitchtip/adapter, property: opensearchPassword}
    - secretKey: dsn
      remoteRef: {key: glitchtip/adapter, property: dsn}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-opensearch-reader
  namespace: monitor-opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: monitor-opensearch-openbao-secret-store
    kind: SecretStore
  target:
    name: glitchtip-opensearch-reader
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        password: '{{ if not .password }}{{ fail "GlitchTip reader password is required" }}{{ end }}{{ .password }}'
  data:
    - secretKey: password
      remoteRef: {key: glitchtip/adapter, property: opensearchPassword}
