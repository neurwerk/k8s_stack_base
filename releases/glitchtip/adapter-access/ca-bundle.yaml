apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: glitchtip-opensearch-ca
spec:
  sources:
    - secret:
        name: infra-cert-manager-internal-ca-secret
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: glitchtip
