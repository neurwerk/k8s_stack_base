apiVersion: v1
kind: ServiceAccount
metadata:
  name: glitchtip-external-secrets
  namespace: glitchtip
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: glitchtip-openbao-secret-store
  namespace: glitchtip
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: glitchtip
          serviceAccountRef:
            name: glitchtip-external-secrets
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-runtime
  namespace: glitchtip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: glitchtip-openbao-secret-store
    kind: SecretStore
  target:
    name: glitchtip-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        DATABASE_URL: '{{ if not .postgresqlPassword }}{{ fail "GlitchTip database password is required" }}{{ end }}postgresql://glitchtip:{{ .postgresqlPassword | urlquery | replace "+" "%20" }}@postgres-operations.infra-postgres-operations.svc.cluster.local:5432/glitchtip'
        SECRET_KEY: '{{ if not .secretKey }}{{ fail "GlitchTip secret key is required" }}{{ end }}{{ .secretKey }}'
        EMAIL_HOST_USER: '{{ if not .smtpUsername }}{{ fail "GlitchTip SMTP username is required" }}{{ end }}{{ .smtpUsername }}'
        EMAIL_HOST_PASSWORD: '{{ if not .smtpPassword }}{{ fail "GlitchTip SMTP password is required" }}{{ end }}{{ .smtpPassword }}'
  data:
    - secretKey: postgresqlPassword
      remoteRef: {key: glitchtip/internal, property: databasePassword}
    - secretKey: secretKey
      remoteRef: {key: glitchtip/internal, property: secretKey}
    - secretKey: smtpUsername
      remoteRef: {key: glitchtip/external, property: smtpUsername}
    - secretKey: smtpPassword
      remoteRef: {key: glitchtip/external, property: smtpPassword}
