apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-owner
  namespace: glitchtip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: glitchtip-openbao-secret-store
    kind: SecretStore
  target:
    name: glitchtip-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        GLITCHTIP_OWNER_EMAIL: '{{ if not .email }}{{ fail "GlitchTip initial owner email is required" }}{{ end }}{{ .email }}'
        GLITCHTIP_OWNER_PASSWORD: '{{ if not .password }}{{ fail "GlitchTip initial owner password is required" }}{{ end }}{{ .password }}'
  data:
    - secretKey: email
      remoteRef: {key: glitchtip/owner, property: email}
    - secretKey: password
      remoteRef: {key: glitchtip/owner, property: password}
