apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: studio
  namespace: frontend-studio
spec:
  releaseName: frontend-studio
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  dependsOn:
    - name: traefik
      namespace: kube-system
    - name: cert-manager-issuers
      namespace: infra-cert-manager
    - name: studio-api
      namespace: frontend-studio
    - name: keycloak-studio-oidc
      namespace: auth-keycloak
  chart:
    spec:
      chart: ./charts/studio/web
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: base-shared-hostnames-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-resources-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: base-shared-oidc-clients-config-map
      valuesKey: values.yaml
    - kind: ConfigMap
      name: client-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: studio-product-values
      valuesKey: values.yaml
