apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: studio-shared
  namespace: frontend-studio
spec:
  releaseName: frontend-studio-shared
  interval: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/data/ca.crt"]
        target:
          kind: ConfigMap
          name: frontend-studio-shared-opensearch-ca
  chart:
    spec:
      chart: ./charts/studio/shared
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 1m
