apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wireguard
  namespace: wireguard
spec:
  releaseName: wireguard
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: ./charts/wireguard
      sourceRef:
        kind: GitRepository
        name: k8s-stack
        namespace: flux-system
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: wireguard-product-values
      valuesKey: values.yaml
