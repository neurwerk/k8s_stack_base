apiVersion: v1
kind: Namespace
metadata:
  name: librechat-code-interpreter
  labels:
    secrets.neurwerk.com/openbao-trust: "true"
    # Direct NsJail needs capabilities prohibited by baseline and restricted
    # Pod Security. The worker chart still forbids privileged containers and
    # validates its exact capability set and dedicated-node scheduling.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: librechat-code-interpreter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
