version: 0.3.29
releaseDate: '2026-10-21'
summary: Grouped gateway providers, Studio developer endpoints and browser CORS
trust:
  signerIdentity: platform-release
  algorithm: ssh-ed25519
  fingerprint: SHA256:+rDcofrsfRE3ElJJxnUVoB3gmoEzZJUrisDqLZMHimw
compatibility:
  stableUpgrade: supported
  upgradesFromAlphaRevisions: []
  downgrade: unsupported
  recovery: forward-fix
packages:
  default:
  - releases/namespaces
  - releases/keycloak-api-key-bridge/secret-sync
  - releases/studio/secret-sync
  - releases/contextforge/secret-sync/database
  - releases/infrastructure
  - releases/applications
  optional:
  - path: releases/namespaces/glitchtip
    status: included
    reason: Optional isolated GlitchTip namespace; selected only by clients using this product.
    chartPrefixes: []
  - path: releases/glitchtip/secret-sync
    status: included
    reason: Optional app-owned credential delivery; reconcile the selected catalog and approved SMTP credentials before startup.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.6.0
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/2825f854c8c15a1ce259988eeca8901bf6f3d496
  - path: releases/glitchtip/postgres
    status: included
    reason: Optional dedicated GlitchTip database using the existing operations PostgreSQL; requires prepared credentials.
    chartPrefixes: []
  - path: releases/glitchtip/secret-sync/admission
    status: included
    reason: Optional isolated proxy-cookie and Keycloak-client credential delivery; prepare through the reviewed standalone CLI before adopting the gated UI.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.6.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/93e9a36ebefaa3aec4b2cdffbf5d80e37a4dac6a
  - path: releases/glitchtip/app
    status: included
    reason: Optional stock GlitchTip 6.2.6 with verified adapter Tooling 0.13.7 and provisioning Tooling 0.13.5; disabled by default. The private UI requires prepared Keycloak full-path group admission and separate credentials. Stock OAuth2 Proxy filters internal MCP, status and ingestion paths with verified upstream TLS. Public routing exposes one selected status page; no native identities or data are replaced.
    chartPrefixes:
    - charts/glitchtip
    prerequisites:
    - name: k8s-stack-tooling
      version: 0.13.7
      source: https://github.com/neurwerk/k8s_stack_tooling/releases/tag/v0.13.7
    - name: openbao-stack-setup
      version: 0.6.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/93e9a36ebefaa3aec4b2cdffbf5d80e37a4dac6a
    - name: k8s-stack-tooling-workstation
      version: 0.13.7
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/73a48e6fe1c794bc80b8c847c37280ebfc0f73fd
  - path: releases/glitchtip/secret-sync/initial-owner
    status: included
    reason: Optional initial local organization-owner credentials for native provisioning; never delivered to the application or adapter.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.6.0
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/2825f854c8c15a1ce259988eeca8901bf6f3d496
  - path: releases/glitchtip/adapter-access
    status: included
    reason: Optional reader credentials, internal CA distribution and scoped access; import the verified private DSN before adapter activation.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.6.0
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/2825f854c8c15a1ce259988eeca8901bf6f3d496
  - path: releases/glitchtip/tailscale-access
    status: included
    reason: Optional egress allowance for only the managed GlitchTip UI proxy. Requires the existing operator DNS/control-plane/DERP egress policy, reviewed UI-specific tailnet tag/ACL and private DNS mapping; no public UI listener or Tailscale HTTPS API dependency.
    chartPrefixes: []
    prerequisites:
    - name: tailscale-operator
      version: 0.1.0
      source: releases/tailscale/operator
  - path: releases/agentgateway/inspection-pki
    status: included
    reason: Optional dedicated inspection PKI; disabled by default. Reconcile current-generation approval
      profiles before issuance, and complete public trust publication and Studio readiness before enabling
      the inspected forward listener.
    chartPrefixes:
    - charts/agentgateway/inspection-pki
    prerequisites:
    - name: cert-manager
      version: 1.20.2
      source: oci://quay.io/jetstack/charts/cert-manager
    - name: cert-manager-approver-policy
      version: 0.25.1
      source: oci://quay.io/jetstack/charts/cert-manager-approver-policy
    - name: cert-manager-approval-policy
      version: 1.2.9
      source: releases/cert-manager/approval-policy.yaml
    - name: trust-manager
      version: 0.24.0
      source: oci://quay.io/jetstack/charts/trust-manager
    - name: kube-prometheus-stack
      version: 72.4.0
      source: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  - path: releases/agentgateway/inspection-trust
    status: included
    reason: Optional public-root snapshot publication after inspection PKI using verified Tooling 0.12.0;
      disabled by default. Initial publication precedes Studio trust readiness; subsequent promotion requires
      every serving Studio replica to load the staged version.
    chartPrefixes:
    - charts/agentgateway/inspection-trust
    prerequisites:
    - name: agentgateway-inspection-pki
      version: 0.1.1
      source: releases/agentgateway/inspection-pki
    - name: k8s-stack-tooling
      version: 0.12.0
      source: https://github.com/neurwerk/k8s_stack_tooling/releases/tag/v0.12.0
  - path: releases/keycloak/active-directory
    status: included
    reason: Optional Active Directory federation; existing installations require a reviewed single-owner
      handoff from the applications stage before selection.
    chartPrefixes:
    - charts/keycloak/realm-config/active-directory
  - path: releases/docling/image-inspection-secret-sync
    status: included
    reason: Optional private image-reader credential delivery; provision the runtime and API key before
      activation.
    chartPrefixes: []
    prerequisites:
    - name: inference-runtime-manager
      version: 0.2.0
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/50b0c29c60482033bc0ceac58ca5a68733e5b075
    - name: openbao-stack-setup
      version: 0.4.3
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/fee1854a8d55d1b9ded5dda221e4fb854ef66c56
  - path: releases/docling/secret-sync/internal
    status: included
    reason: Optional CPU API-key delivery; provision operator credentials before startup, without an external
      inference token.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.4.3
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/fee1854a8d55d1b9ded5dda221e4fb854ef66c56
  - path: releases/docling/secret-sync
    status: included
    reason: Optional remote-mode credential delivery; provision the API key and inference token before
      startup.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.4.3
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/fee1854a8d55d1b9ded5dda221e4fb854ef66c56
  - path: releases/docling/reloader
    status: included
    reason: Optional Docling namespace watch and rotation RBAC; compose only after its namespace exists.
    chartPrefixes: []
  - path: releases/namespaces/docling
    status: included
    reason: Optional Docling namespace; compose only when selected by the client.
    chartPrefixes: []
  - path: releases/docling/app
    status: included
    reason: Optional CPU or private remote extraction; disabled by default and requires client selection
      and operator credentials.
    chartPrefixes:
    - charts/docling
    prerequisites:
    - name: openbao-stack-setup
      version: 0.4.3
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/fee1854a8d55d1b9ded5dda221e4fb854ef66c56
  - path: releases/namespaces/maintenance
    status: included
    reason: Operator-tested optional maintenance; enable only when selected by the client.
    chartPrefixes: []
  - path: releases/maintenance
    status: included
    reason: Operator-tested maintenance pages; disabled by default and activated on demand.
    chartPrefixes:
    - charts/maintenance
  - path: releases/namespaces/tailscale
    status: included
    reason: Optional Tailscale namespace; unselected by default.
    chartPrefixes: []
  - path: releases/tailscale/operator
    status: included
    reason: Optional official operator; disabled and suspended by default. Stage credentials before activation.
      Kubernetes API proxy and dashboard access are not enabled; custom control-plane compatibility requires operator validation.
    chartPrefixes:
    - charts/tailscale/operator
    prerequisites:
    - name: tailscale-operator
      version: 1.104.2
      source: https://pkgs.tailscale.com/helmcharts
  - path: releases/tailscale/secret-sync
    status: included
    reason: Optional two-field operator credential delivery; provision the selected Tailscale OpenBao catalog before activation.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.5.0
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/d0fba64e974969d0381acf80206cf7148c24da84
  - path: releases/tailscale/access
    status: included
    reason: Optional separately owned API TCP transport; disabled and suspended by default pending explicit security approval.
      Upstream main and init proxy containers are privileged and proxy RBAC can access all namespace Secrets, including operator OAuth.
      Experimental upstream ExternalName forwarding is address-based, not port-filtered; require API-only tailnet ACLs for TCP 443.
      Preserve Kubernetes client certificates, CA verification and an existing API certificate SAN as tls-server-name.
      No dashboards are selected. This package does not adopt the existing Kubernetes Service.
    chartPrefixes:
    - charts/tailscale/access
    prerequisites:
    - name: tailscale-operator
      version: 0.1.0
      source: releases/tailscale/operator
  - path: releases/contextforge/secret-sync
    status: excluded
    reason: Vault OAuth backend awaits upstream support; use the default database credential package instead.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.4.3
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/fee1854a8d55d1b9ded5dda221e4fb854ef66c56
  - path: releases/contextforge/oauth-apps
    status: included
    reason: Provider application credential delivery is selected only with approved registrations; all
      MCP presets are disabled by default.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.4.3
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/fee1854a8d55d1b9ded5dda221e4fb854ef66c56
