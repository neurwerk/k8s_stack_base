version: 0.3.32
releaseDate: '2026-11-02'
summary: Endpoint-selected gateway authentication and route-specific model discovery
helmOutputs:
  releases/keycloak/server.yaml:
  - kind: Secret
    namespace: auth-keycloak
    name: auth-keycloak-secret
    helmRelease: keycloak
trust:
  signerIdentity: platform-release
  algorithm: ssh-ed25519
  fingerprint: SHA256:+rDcofrsfRE3ElJJxnUVoB3gmoEzZJUrisDqLZMHimw
compatibility:
  stableUpgrade: supported
  upgradesFromAlphaRevisions:
  - 25ee6c19e0921f78c4cd2e0ffb2c2abf48f9a54c
  - 0d2a31614776a1c85e693d9e6620849faa5b2e19
  downgrade: unsupported
  recovery: forward-fix
packages:
  default:
  - releases/namespaces
  - releases/keycloak-api-key-bridge/secret-sync
  - releases/studio/secret-sync
  - releases/contextforge/secret-sync/database
  - releases/infrastructure
  - releases/applications
  optional:
  - path: releases/namespaces/glitchtip
    status: included
    reason: Optional isolated GlitchTip namespace; selected only by clients using this product.
    chartPrefixes: []
  - path: releases/glitchtip/secret-sync
    status: included
    reason: Optional app-owned credential delivery; reconcile the selected catalog and approved SMTP credentials
      before startup.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/glitchtip/postgres
    status: included
    reason: Optional dedicated GlitchTip database using the existing operations PostgreSQL; requires prepared
      credentials.
    chartPrefixes: []
  - path: releases/glitchtip/app
    status: included
    reason: Optional GlitchTip 6.2.6 with verified adapter Tooling 0.17.0 and provisioning Tooling 0.15.6; disabled by
      default. Provision native identities before DSN handoff and adapter activation. Management UI uses
      Tailscale TCP/TLS only; public routing exposes one selected status page.
    chartPrefixes:
    - charts/glitchtip
    prerequisites:
    - name: k8s-stack-tooling
      version: 0.17.0
      source: https://github.com/neurwerk/k8s_stack_tooling/releases/tag/v0.17.0
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/glitchtip/secret-sync/initial-owner
    status: included
    reason: Optional initial local organization-owner credentials for native provisioning; never delivered
      to the application or adapter.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/glitchtip/adapter-access
    status: included
    reason: Optional reader credentials, internal CA distribution and scoped access; import the verified
      private DSN before adapter activation.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/glitchtip/tailscale-access
    status: included
    reason: Optional egress allowance for only the managed GlitchTip UI proxy. Requires the existing operator
      DNS/control-plane/DERP egress policy, reviewed UI-specific tailnet tag/ACL and private DNS mapping;
      no public UI listener or Tailscale HTTPS API dependency.
    chartPrefixes: []
    prerequisites:
    - name: tailscale-operator
      version: 0.1.0
      source: releases/tailscale/operator
  - path: releases/agentgateway/inspection-pki
    status: included
    reason: Optional dedicated inspection PKI; disabled by default. Reconcile current-generation approval
      profiles before issuance, and complete public trust publication and Studio readiness before enabling
      the inspected forward listener.
    chartPrefixes:
    - charts/agentgateway/inspection-pki
    prerequisites:
    - name: cert-manager
      version: 1.20.2
      source: oci://quay.io/jetstack/charts/cert-manager
    - name: cert-manager-approver-policy
      version: 0.25.1
      source: oci://quay.io/jetstack/charts/cert-manager-approver-policy
    - name: cert-manager-approval-policy
      version: 1.2.9
      source: releases/cert-manager/approval-policy.yaml
    - name: trust-manager
      version: 0.24.0
      source: oci://quay.io/jetstack/charts/trust-manager
    - name: kube-prometheus-stack
      version: 72.4.0
      source: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  - path: releases/agentgateway/inspection-trust
    status: included
    reason: Optional public-root snapshot publication after inspection PKI using verified Tooling 0.15.6;
      disabled by default. Initial publication precedes Studio trust readiness; subsequent promotion requires
      every serving Studio replica to load the staged version.
    chartPrefixes:
    - charts/agentgateway/inspection-trust
    prerequisites:
    - name: agentgateway-inspection-pki
      version: 0.1.1
      source: releases/agentgateway/inspection-pki
    - name: k8s-stack-tooling
      version: 0.15.6
      source: https://github.com/neurwerk/k8s_stack_tooling/releases/tag/v0.15.6
  - path: releases/keycloak/active-directory
    status: included
    reason: Optional Active Directory federation; existing installations require a reviewed single-owner
      handoff from the applications stage before selection.
    chartPrefixes:
    - charts/keycloak/realm-config/active-directory
  - path: releases/docling/image-inspection-secret-sync
    status: included
    reason: Optional private image-reader credential delivery; provision the runtime and API key before
      activation.
    chartPrefixes: []
    prerequisites:
    - name: inference-runtime-manager
      version: 0.2.0
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/50b0c29c60482033bc0ceac58ca5a68733e5b075
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/docling/secret-sync/internal
    status: included
    reason: Optional CPU API-key delivery; provision operator credentials before startup, without an external
      inference token.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/docling/secret-sync
    status: included
    reason: Optional remote-mode credential delivery; provision the API key and inference token before
      startup.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/docling/reloader
    status: included
    reason: Optional Docling namespace watch and rotation RBAC; compose only after its namespace exists.
    chartPrefixes: []
  - path: releases/namespaces/docling
    status: included
    reason: Optional Docling namespace; compose only when selected by the client.
    chartPrefixes: []
  - path: releases/docling/app
    status: included
    reason: Optional CPU or private remote extraction; disabled by default and requires client selection
      and operator credentials.
    chartPrefixes:
    - charts/docling
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/namespaces/maintenance
    status: included
    reason: Operator-tested optional maintenance; enable only when selected by the client.
    chartPrefixes: []
  - path: releases/maintenance
    status: included
    reason: Operator-tested maintenance pages; disabled by default and activated on demand.
    chartPrefixes:
    - charts/maintenance
  - path: releases/namespaces/tailscale
    status: included
    reason: Optional Tailscale namespace; unselected by default.
    chartPrefixes: []
  - path: releases/tailscale/operator
    status: included
    reason: Optional official operator; disabled and suspended by default. Stage credentials before activation.
      Kubernetes API proxy and dashboard access are not enabled; custom control-plane compatibility requires
      operator validation.
    chartPrefixes:
    - charts/tailscale/operator
    prerequisites:
    - name: tailscale-operator
      version: 1.104.2
      source: https://pkgs.tailscale.com/helmcharts
  - path: releases/tailscale/secret-sync
    status: included
    reason: Optional two-field operator credential delivery; provision the selected Tailscale OpenBao
      catalog before activation.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/tailscale/access
    status: included
    reason: Optional separately owned API TCP transport; disabled and suspended by default pending explicit
      security approval. Upstream main and init proxy containers are privileged and proxy RBAC can access
      all namespace Secrets, including operator OAuth. Experimental upstream ExternalName forwarding is
      address-based, not port-filtered; require API-only tailnet ACLs for TCP 443. Preserve Kubernetes
      client certificates, CA verification and an existing API certificate SAN as tls-server-name. No
      dashboards are selected. This package does not adopt the existing Kubernetes Service.
    chartPrefixes:
    - charts/tailscale/access
    prerequisites:
    - name: tailscale-operator
      version: 0.1.0
      source: releases/tailscale/operator
  - path: releases/contextforge/secret-sync
    status: excluded
    reason: Vault OAuth backend awaits upstream support; use the default database credential package instead.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
  - path: releases/contextforge/oauth-apps
    status: included
    reason: Provider application credential delivery is selected only with approved registrations; all
      MCP presets are disabled by default.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.8.5
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
prerequisites:
- name: flux
  version: 2.9.4
  source: client bootstrap manifests
- name: clickhouse-operator
  version: 0.0.5
  source: oci://ghcr.io/clickhouse/clickhouse-operator-helm
- name: openbao-stack-setup
  version: 0.8.5
  source: https://github.com/neurwerk/k8s_stack_tooling/commit/7f111808203cc7503cc7750981db22021f13355b
- name: gateway-api-experimental
  version: 1.6.0
  source: https://github.com/kubernetes-sigs/gateway-api/releases/tag/v1.6.0
- name: cert-manager-crds
  version: 1.20.2
  source: https://github.com/cert-manager/cert-manager/releases/tag/v1.20.2
- name: prometheus-operator-crds
  version: 72.4.0
  source: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
- name: agentgateway-crds
  version: 1.6.0
  source: oci://cr.agentgateway.dev/charts/agentgateway-crds
- name: external-secrets-crds
  version: 2.9.0
  source: https://github.com/external-secrets/external-secrets/releases/tag/v2.9.0
- name: documentdb-cpu-baseline
  version: x86-64-v3
  source: https://github.com/documentdb/documentdb/blob/v0.116-0/pg_documentdb_gw/.cargo/config.toml
exceptions:
- artifact: charts/postgres/operations:documentdb-database-rbac
  owner: platform
  expires: 2026-11-27
  reason: DocumentDB 0.116.0 requires readWriteAnyDatabase plus clusterAdmin for a secondary write user
    and does not support database-scoped readWrite. Only one document-store product may use this instance;
    another Mongo-compatible product requires a separate instance. Native user creation also requires
    narrowly scoped, temporary PostgreSQL CREATEROLE and documentdb_admin_role delegation capabilities.
- artifact: charts/postgres/operations:privilege-escalation-container
  owner: platform
  expires: 2026-11-27
  reason: The reviewed upstream DocumentDB local image requires passwordless sudo to prepare runtime directories
    before dropping back to UID 1000.
