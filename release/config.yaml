version: 0.3.12
releaseDate: '2026-09-21'
summary: Allow opt-in HTTP for private Docling inference; keep HTTPS as the default.
trust:
  signerIdentity: platform-release
  algorithm: ssh-ed25519
  fingerprint: SHA256:+rDcofrsfRE3ElJJxnUVoB3gmoEzZJUrisDqLZMHimw
compatibility:
  stableUpgrade: supported
  upgradesFromAlphaRevisions: []
  downgrade: unsupported
  recovery: configuration-revert
packages:
  default:
  - releases/namespaces
  - releases/infrastructure
  - releases/applications
  optional:
  - path: releases/docling/secret-sync/internal
    status: included
    reason: Optional CPU API-key delivery; provision operator credentials before startup, without an external
      inference token.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.17
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/8f62f6e1b0ccf6b4d60f7cc66bc9a19f6fdc234b
  - path: releases/docling/secret-sync
    status: included
    reason: Optional remote-mode credential delivery; provision the API key and inference token before
      startup.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.17
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/8f62f6e1b0ccf6b4d60f7cc66bc9a19f6fdc234b
  - path: releases/docling/reloader
    status: included
    reason: Optional Docling namespace watch and rotation RBAC; compose only after its namespace exists.
    chartPrefixes: []
  - path: releases/namespaces/docling
    status: included
    reason: Optional Docling namespace; compose only when selected by the client.
    chartPrefixes: []
  - path: releases/docling/app
    status: included
    reason: Optional CPU or private remote extraction; disabled by default and requires client selection
      and operator credentials.
    chartPrefixes:
    - charts/docling
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.17
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/8f62f6e1b0ccf6b4d60f7cc66bc9a19f6fdc234b
  - path: releases/namespaces/maintenance
    status: included
    reason: Operator-tested optional maintenance; enable only when selected by the client.
    chartPrefixes: []
  - path: releases/maintenance
    status: included
    reason: Operator-tested maintenance pages; disabled by default and activated on demand.
    chartPrefixes:
    - charts/maintenance
  - path: releases/namespaces/wireguard
    status: included
    reason: Operator-tested optional gateway; client network and node prerequisites still apply.
    chartPrefixes: []
  - path: releases/wireguard
    status: included
    reason: Operator-tested one-device Forgejo HTTPS gateway; disabled by default.
    chartPrefixes:
    - charts/wireguard
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.13
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/0c0d5b35fc9e68b70e0cb48f3741e1888f7a287b
  - path: releases/wireguard/secret-sync
    status: included
    reason: Optional server-key delivery; provision the selected OpenBao catalog before startup.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.13
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/0c0d5b35fc9e68b70e0cb48f3741e1888f7a287b
  - path: releases/namespaces/forgejo
    status: included
    reason: Operator-tested optional Forgejo hosting; enable only when selected by the client.
    chartPrefixes: []
  - path: releases/forgejo/secret-sync
    status: included
    reason: Optional Forgejo credentials; provision the selected OpenBao catalog before startup.
    chartPrefixes: []
  - path: releases/forgejo/app
    status: included
    reason: Operator-tested Forgejo hosting with Keycloak login; disabled by default.
    chartPrefixes:
    - charts/forgejo
    - charts/keycloak/oidc/forgejo
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.12
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7a00c0d7a725a500ca251d699ce3f00dff57e660
  - path: releases/librechat/rag
    status: excluded
    reason: Deployment readiness and effective client rendering are not complete.
    chartPrefixes:
    - charts/librechat/rag-api
  - path: releases/librechat/code-interpreter
    status: excluded
    reason: First-party versioned runtime images have not been published.
    chartPrefixes:
    - charts/librechat/code-interpreter
prerequisites:
- name: flux
  version: 2.9.4
  source: client bootstrap manifests
- name: openbao-stack-setup
  version: 0.2.17
  source: https://github.com/neurwerk/k8s_stack_tooling/commit/8f62f6e1b0ccf6b4d60f7cc66bc9a19f6fdc234b
- name: gateway-api-experimental
  version: 1.6.0
  source: https://github.com/kubernetes-sigs/gateway-api/releases/tag/v1.6.0
- name: cert-manager-crds
  version: 1.20.2
  source: https://github.com/cert-manager/cert-manager/releases/tag/v1.20.2
- name: prometheus-operator-crds
  version: 72.4.0
  source: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
- name: agentgateway-crds
  version: 1.5.0
  source: oci://cr.agentgateway.dev/charts/agentgateway-crds
- name: external-secrets-crds
  version: 2.9.0
  source: https://github.com/external-secrets/external-secrets/releases/tag/v2.9.0
- name: documentdb-cpu-baseline
  version: x86-64-v3
  source: https://github.com/documentdb/documentdb/blob/v0.116-0/pg_documentdb_gw/.cargo/config.toml
exceptions:
- artifact: ghcr.io/danny-avila/librechat-dev@sha256:d05623decc48482bd83560248eb6efbdb5e60ea844298ab2fbaa70b462feb611
  owner: platform
  expires: 2026-09-30
  reason: Reviewed upstream source eaed216994b2604e050966cd6eaf3c2bdd359233 provides required streaming,
    reasoning and role provisioning APIs. Docker Dev Images Build run 34323899158 published this exact
    multi-architecture digest. Moving development tags remain prohibited.
- artifact: charts/postgres/operations:documentdb-database-rbac
  owner: platform
  expires: 2026-11-27
  reason: DocumentDB 0.116.0 requires readWriteAnyDatabase plus clusterAdmin for a secondary write user
    and does not support database-scoped readWrite. LibreChat is the gateway's only application consumer;
    another Mongo-compatible consumer requires a separate instance. Native user creation also requires
    narrowly scoped, temporary PostgreSQL CREATEROLE and documentdb_admin_role delegation capabilities.
- artifact: charts/postgres/operations:privilege-escalation-container
  owner: platform
  expires: 2026-11-27
  reason: The reviewed upstream DocumentDB local image requires passwordless sudo to prepare runtime directories
    before dropping back to UID 1000.
