    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.13
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/0c0d5b35fc9e68b70e0cb48f3741e1888f7a287b
  - path: releases/namespaces/forgejo
