  signerIdentity: platform-release
  algorithm: ssh-ed25519
  fingerprint: SHA256:+rDcofrsfRE3ElJJxnUVoB3gmoEzZJUrisDqLZMHimw
compatibility:
  stableUpgrade: supported
  upgradesFromAlphaRevisions: []
  downgrade: unsupported
  recovery: forward-fix
packages:
  default:
  - releases/namespaces
  - releases/infrastructure
  - releases/applications
  optional:
  - path: releases/namespaces/maintenance
    status: excluded
    reason: Optional on-demand maintenance; explicit client adoption and runtime acceptance are required.
    chartPrefixes: []
  - path: releases/maintenance
    status: excluded
    reason: Optional and disabled by default; explicit client adoption and runtime acceptance are required.
    chartPrefixes:
    - charts/maintenance
  - path: releases/namespaces/wireguard
    status: excluded
    reason: Optional static gateway; node prerequisites and activation acceptance are pending.
    chartPrefixes: []
  - path: releases/wireguard
    status: excluded
    reason: Reviewed network facts, credential provisioning and live acceptance are pending.
    chartPrefixes:
    - charts/wireguard
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.13
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/0c0d5b35fc9e68b70e0cb48f3741e1888f7a287b
  - path: releases/wireguard/secret-sync
    status: excluded
    reason: Requires the selection-gated WireGuard OpenBao catalog before separately authorized activation.
    chartPrefixes: []
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.13
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/0c0d5b35fc9e68b70e0cb48f3741e1888f7a287b
  - path: releases/namespaces/forgejo
    status: excluded
    reason: Staged Forgejo package; live acceptance and client activation are not complete.
    chartPrefixes: []
  - path: releases/forgejo/secret-sync
    status: excluded
    reason: Requires the selection-gated Forgejo OpenBao catalog and credential copies before activation.
    chartPrefixes: []
  - path: releases/forgejo/app
    status: excluded
    reason: Staged optional package; live acceptance and separately authorized client activation are pending.
    chartPrefixes:
    - charts/forgejo
    - charts/keycloak/oidc/forgejo
    prerequisites:
    - name: openbao-stack-setup
      version: 0.2.12
      source: https://github.com/neurwerk/k8s_stack_tooling/commit/7a00c0d7a725a500ca251d699ce3f00dff57e660
  - path: releases/librechat/rag
    status: excluded
    reason: Deployment readiness and effective client rendering are not complete.
    chartPrefixes:
    - charts/librechat/rag-api
  - path: releases/librechat/code-interpreter
    status: excluded
    reason: First-party versioned runtime images have not been published.
    chartPrefixes:
    - charts/librechat/code-interpreter
