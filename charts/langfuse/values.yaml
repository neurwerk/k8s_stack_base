# IMAGE SOURCE: upstream
# Langfuse is controlled by its vendor subchart; the wrapper owns the upstream OTEL and retention images.
# k8sTools is a documented neurwerk tooling exception.
# Pinned here (chart defaults).
# =============================================================================
# charts/langfuse/values.yaml — default values
#
# These defaults are overridden by:
#   - ConfigMap: base-shared-hostnames-config-map (releases/shared/hostnames.yaml)
#   - ConfigMap: base-shared-resources-config-map (releases/shared/resources.yaml)
#   - Secret: monitor-langfuse-secrets
#
# ── Where each type of value lives ──────────────────────────────────────────
#
#   THIS FILE  (chart defaults / static config)
#     monitorLangfuseWrapper.*         — wrapper's own values (gateway, httproute,
#                                       secret, OTel collector templates)
#     langfuse.*                       — passed into the Langfuse subchart.
#       IMPORTANT: Because Helm passes parent values at the subchart's ROOT level,
#       and the subchart's templates reference .Values.langfuse.*, we need
#       double-nesting: langfuse.langfuse.* → .Values.langfuse.* in subchart.
#       Same for all root-level subchart values (postgresql, clickhouse, redis, s3).
#
#   templates/secret.yaml             — Langfuse credentials from the ESO input Secret
#   templates/otel-collector-*        — OTel collector deployment bridging
#                                       AgentGateway OTLP gRPC → Langfuse OTLP HTTP
#
# ── To change hostnames ──────────────────────────────────────────────────────
#   Edit the client repository's config/client.yaml.
# =============================================================================

# ── Wrapper chart own values ─────────────────────────────────────────────────
# Used ONLY by our custom templates (gateway, http-route, secret, OTel collector).
# Nothing here is passed to the langfuse subchart.
monitorLangfuseWrapper:
  otelCollectorImage: docker.io/otel/opentelemetry-collector-contrib:0.132.1
  retentionPostgresImage: docker.io/bitnamilegacy/postgresql:17.3.0-debian-12-r1
  hostname: ""                        # set in client_*/config/client.yaml
  ports:
    container:
      http: 3000                      # Langfuse web HTTP port
    service:
      http: 3000                       # ClusterIP port (subchart creates Service on 3000)
    gateway:
      tls: 443                        # TLS terminates at Traefik Gateway

  # OpenTelemetry Collector configuration
  otelCollector:
    ports:
      grpc: 4317                      # OTLP gRPC receiver (AgentGateway sends here)
      http: 4318                      # OTLP HTTP receiver
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  # Langfuse web service name (constructed by subchart from fullnameOverride)
  langfuseServiceName: "monitor-langfuse-web"
  langfuseServicePort: 3000

  # Non-secret headless initialization metadata.
  initOrgId: "langfuse-org"
  initOrgName: "Organization Name"
  initProjectId: "default-project"
  initProjectName: "Default Project"
  initUserEmail: "admin@org.com"
  initUserName: "Admin"
  # Retention — sets LANGFUSE_INIT_PROJECT_RETENTION on new projects (via
  # additionalEnv) and runs a DB init-job to set retention on existing projects.
  retention:
    enabled: true
    days: 90

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false


# ── Subchart dependency: langfuse ────────────────────────────────────────────
# Helm passes the parent chart's "langfuse:" block as ROOT-level values inside
# the subchart. That means:
#   parent:  langfuse.langfuse.*  →  subchart: .Values.langfuse.*
#   parent:  langfuse.postgresql.*  →  subchart: .Values.postgresql.*
#   parent:  langfuse.fullnameOverride  →  subchart: .Values.fullnameOverride
#
# All subchart templates reference .Values.langfuse.*, .Values.postgresql.*, etc.
# So we must double-nest everything under the dependency alias "langfuse:".
langfuse:
  # ── Root-level chart overrides ────────────────────────────────────────────
  fullnameOverride: "monitor-langfuse"

  # -- Core Langfuse application settings (becomes .Values.langfuse.*) --
  langfuse:
    features:
      signUpDisabled: true

    # Headless initialization — creates org, project, user, API keys on startup.
    # Non-secret identity metadata comes from the chart-owned init ConfigMap;
    # credentials remain in monitor-langfuse-secret.
    additionalEnv:
      - name: LANGFUSE_INIT_ORG_ID
        valueFrom:
          configMapKeyRef:
            name: monitor-langfuse-init-config-map
            key: org-id
      - name: LANGFUSE_INIT_ORG_NAME
        valueFrom:
          configMapKeyRef:
            name: monitor-langfuse-init-config-map
            key: org-name
      - name: LANGFUSE_INIT_PROJECT_ID
        valueFrom:
          configMapKeyRef:
            name: monitor-langfuse-init-config-map
            key: project-id
      - name: LANGFUSE_INIT_PROJECT_NAME
        valueFrom:
          configMapKeyRef:
            name: monitor-langfuse-init-config-map
            key: project-name
      - name: LANGFUSE_INIT_USER_EMAIL
        valueFrom:
          configMapKeyRef:
            name: monitor-langfuse-init-config-map
            key: user-email
      - name: LANGFUSE_INIT_USER_NAME
        valueFrom:
          configMapKeyRef:
            name: monitor-langfuse-init-config-map
            key: user-name
      - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
        valueFrom:
          secretKeyRef:
            name: monitor-langfuse-secret
            key: init-project-public-key
      - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: monitor-langfuse-secret
            key: init-project-secret-key
      - name: LANGFUSE_INIT_USER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: monitor-langfuse-secret
            key: init-user-password
      - name: LANGFUSE_INIT_PROJECT_RETENTION
        value: "90"

    # Use secretKeyRef so credentials come from our wrapper secret
    salt:
      secretKeyRef:
        name: monitor-langfuse-secret
        key: salt

    encryptionKey:
      secretKeyRef:
        name: monitor-langfuse-secret
        key: encryption-key

    nextauth:
      url: ""                             # set in client_*/config/client.yaml
      secret:
        secretKeyRef:
          name: monitor-langfuse-secret
          key: nextauth-secret

    logging:
      format: json

    web:
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
      service:
        port: 3000

  # -- PostgreSQL (becomes .Values.postgresql.*) --
  postgresql:
    deploy: false
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    port: 5432
    # The operations PostgreSQL canary accepts SCRAM authentication over
    # plaintext transport until its PostgreSQL listener gains TLS support.
    args: sslmode=disable

    auth:
      username: langfuse
      database: postgres_langfuse
      existingSecret: monitor-langfuse-secret
      secretKeys:
        userPasswordKey: postgresql-password

  # -- ClickHouse (becomes .Values.clickhouse.*) --
  clickhouse:
    deploy: true

    # Explicit fullnameOverride so the ClickHouse service name matches what
    # Langfuse's clickhouse.hostname helper auto-generates:
    #   langfuse.clickhouse.hostname → monitor-langfuse-clickhouse
    # Without this, the Bitnami chart uses release name + chart name:
    #   monitor-langfuse-chart-clickhouse  (mismatch!).
    fullnameOverride: "monitor-langfuse-clickhouse"

    # Single replica, no zookeeper/keeper needed
    replicaCount: 1
    clusterEnabled: false
    zookeeper:
      enabled: false

    auth:
      username: default
      existingSecret: monitor-langfuse-secret
      existingSecretKey: clickhouse-password
    resourcesPreset: small
    persistence:
      storageClass: infra-rook-ceph-rbd

    # ── Internal self-telemetry containment ─────────────────────────────────
    # ClickHouse enables historical self-diagnostics by default. Their merges can
    # exhaust this single-node server's memory even at low Langfuse volume. These
    # system.* tables contain ClickHouse process diagnostics, not Langfuse traces
    # or observations in the default database. Container logs remain available.
    extraOverrides: |
      <clickhouse>
        <trace_log remove="remove"/>
        <text_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <latency_log remove="remove"/>
      </clickhouse>

    # usersExtraOverrides → users.d: turn the profilers off at the source in the
    # default profile so nothing keeps feeding trace_log.
    usersExtraOverrides: |
      <clickhouse>
        <profiles>
          <default>
            <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
            <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
            <memory_profiler_step>0</memory_profiler_step>
            <memory_profiler_sample_probability>0</memory_profiler_sample_probability>
          </default>
        </profiles>
      </clickhouse>

  # -- Redis/Valkey (becomes .Values.redis.*) --
  redis:
    deploy: true

    # Explicit fullnameOverride so the Valkey service name matches what
    # Langfuse's redis.hostname helper auto-generates:
    #   langfuse.redis.hostname → monitor-langfuse-redis-primary
    # Without this, the Valkey chart uses release name + chart name:
    #   monitor-langfuse-chart-valkey-primary  (mismatch!).
    fullnameOverride: "monitor-langfuse-redis"

    # Required by validation: langfuse requires valkey --maxmemory-policy noeviction
    primary:
      extraFlags:
        - "--maxmemory-policy noeviction"
      persistence:
        storageClass: infra-rook-ceph-rbd

    auth:
      existingSecret: monitor-langfuse-secret
      existingSecretPasswordKey: redis-password

  # -- S3 / Ceph RGW (becomes .Values.s3.*) --
  s3:
    deploy: false

    endpoint: "http://rook-ceph-rgw-infra-rook-ceph-object-store.infra-rook-ceph.svc.cluster.local:80"
    bucket: langfuse
    region: auto
    forcePathStyle: true

    # Credentials are generated by the namespace-local ObjectBucketClaim.
    accessKeyId:
      secretKeyRef:
        name: monitor-langfuse-langfuse-object-bucket-claim
        key: AWS_ACCESS_KEY_ID
    secretAccessKey:
      secretKeyRef:
        name: monitor-langfuse-langfuse-object-bucket-claim
        key: AWS_SECRET_ACCESS_KEY

# Populated from the OpenBao-backed Helm input Secret.
monitorLangfuseWrapperSecrets: {}
