{{- if .Values.rejectedRequestDebug.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitor-langfuse-rejection-debug
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: langfuse-rejection-debug
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: monitor-langfuse-openbao-secret-store
    kind: SecretStore
  target:
    name: monitor-langfuse-rejection-debug
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: public-key
      remoteRef:
        key: monitor-langfuse/internal
        property: debugProjectPublicKey
    - secretKey: secret-key
      remoteRef:
        key: monitor-langfuse/internal
        property: debugProjectSecretKey
{{- end }}
