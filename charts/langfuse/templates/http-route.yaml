{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.monitorLangfuseWrapper.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
# =============================================================================
# Langfuse HTTPRoute
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitor-langfuse-httproute
  namespace: monitor-langfuse
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  parentRefs:
    - name: monitor-langfuse-gateway
      namespace: monitor-langfuse
      sectionName: websecure
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.monitorLangfuseWrapper.langfuseServiceName }}
          port: {{ .Values.monitorLangfuseWrapper.ports.service.http }}
{{- end }}
