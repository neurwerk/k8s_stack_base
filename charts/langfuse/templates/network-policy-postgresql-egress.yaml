# Langfuse PostgreSQL clients use the operations Service port 5432, which
# forwards to container port 9712 selected here as required by NetworkPolicy.
# This policy also retains the application paths that become isolated when any
# egress policy selects the upstream web and worker Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-langfuse-postgresql-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app
        operator: In
        values:
          - web
          - worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-postgres-operations
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-operations
              app.kubernetes.io/instance: postgres-operations
      ports:
        - port: 9712
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: clickhouse
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: primary
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-rook-ceph
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
              rook_object_store: infra-rook-ceph-object-store
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-langfuse-retention-postgresql-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: langfuse-retention-provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse-retention-provisioning
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: monitor-langfuse
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-postgres-operations
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-operations
              app.kubernetes.io/instance: postgres-operations
      ports:
        - port: 9712
          protocol: TCP
