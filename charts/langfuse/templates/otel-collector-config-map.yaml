# =============================================================================
# Langfuse OpenTelemetry Collector ConfigMap
#
# Receives OTLP traces from AgentGateway via gRPC and forwards them to
# Langfuse's OTLP HTTP endpoint.
#
# Flow:
#   AgentGateway ──OTLP gRPC (4317)──► OTel Collector ──OTLP HTTP (3000)──► Langfuse
#                                                                  /api/public/otel
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-langfuse-otel-collector-config-map
  namespace: monitor-langfuse
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.monitorLangfuseWrapper.otelCollector.ports.grpc }}
          http:
            endpoint: 0.0.0.0:{{ .Values.monitorLangfuseWrapper.otelCollector.ports.http }}
    exporters:
      otlphttp/langfuse:
        endpoint: http://{{ .Values.monitorLangfuseWrapper.langfuseServiceName }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.monitorLangfuseWrapper.langfuseServicePort }}/api/public/otel
        headers:
          Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"
          x-langfuse-ingestion-version: "4"
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    processors:
      # Only gateway-produced normalized fields become Studio's top-level metadata.
      # Native 1.6 OTLP additions stringify booleans; never coerce arbitrary values.
      transform/langfuse_neurwerk:
        error_mode: propagate
        trace_statements:
          - context: span
            conditions:
              - 'resource.attributes["service.name"] == "agentgateway" and attributes["neurwerk.request_id"] != nil'
            statements:
              {{- range $field := list "request_id" "entry_mode" "destination_kind" "destination_id" "provider_id" "binding_id" "protocol_profile" "operation_id" "provider_credential_source" "policy_revision" "requested_model" "resolved_model" "billing_classification" "token_usage_known" "cost_known" }}
              {{- $source := printf "neurwerk.%s" $field }}
              {{- $target := printf "langfuse.observation.metadata.%s" $source }}
              - 'delete_key(attributes, "{{ $target }}")'
              {{- if has $field (list "token_usage_known" "cost_known") }}
              {{- range $value := list "true" "false" }}
              - 'set(attributes["{{ $target }}"], {{ $value }}) where attributes["{{ $source }}"] == {{ $value }} or attributes["{{ $source }}"] == "{{ $value }}"'
              {{- end }}
              {{- else }}
              - 'set(attributes["{{ $target }}"], attributes["{{ $source }}"]) where attributes["{{ $source }}"] != nil'
              {{- end }}
              {{- end }}
      batch:
        send_batch_size: 1000
        timeout: 5s
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [transform/langfuse_neurwerk, batch]
          exporters: [otlphttp/langfuse]
