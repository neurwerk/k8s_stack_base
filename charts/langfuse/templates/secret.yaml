# =============================================================================
# Langfuse credentials Secret
#
# Stores all Langfuse credentials in a single secret referenced by the
# langfuse subchart via existingSecret / secretKeyRef.
#
# Keys referenced by the subchart:
#   salt                  — hash API keys (openssl rand -base64 32)
#   encryption-key        — encrypt sensitive data (openssl rand -hex 32)
#   nextauth-secret       — NextAuth.js signing secret
#   postgresql-password   — PostgreSQL user password
#   clickhouse-password   — ClickHouse user password
#   redis-password        — Redis/Valkey password
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: monitor-langfuse-secret
  namespace: monitor-langfuse
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
  annotations: {}
type: Opaque
stringData:
  # ── Langfuse core credentials ──────────────────────────────────────────────
  salt: {{ .Values.monitorLangfuseWrapperSecrets.salt | default "" | quote }}
  encryption-key: {{ .Values.monitorLangfuseWrapperSecrets.encryptionKey | default "" | quote }}
  nextauth-secret: {{ .Values.monitorLangfuseWrapperSecrets.nextauthSecret | default "" | quote }}

  # ── Database passwords ─────────────────────────────────────────────────────
  postgresql-password: {{ .Values.monitorLangfuseWrapperSecrets.postgresqlPassword | default "" | quote }}
  clickhouse-password: {{ .Values.monitorLangfuseWrapperSecrets.clickhousePassword | default "" | quote }}
  redis-password: {{ .Values.monitorLangfuseWrapperSecrets.redisPassword | default "" | quote }}

  # ── Langfuse headless initialization ───────────────────────────────────────
  init-project-public-key: {{ .Values.monitorLangfuseWrapperSecrets.initProjectPublicKey | default "" | quote }}
  init-project-secret-key: {{ .Values.monitorLangfuseWrapperSecrets.initProjectSecretKey | default "" | quote }}
  init-user-password: {{ .Values.monitorLangfuseWrapperSecrets.initUserPassword | default "" | quote }}
  otel-basic-auth: {{ printf "%s:%s" .Values.monitorLangfuseWrapperSecrets.initProjectPublicKey .Values.monitorLangfuseWrapperSecrets.initProjectSecretKey | b64enc | quote }}
