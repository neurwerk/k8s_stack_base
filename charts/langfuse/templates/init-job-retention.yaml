{{- if .Values.monitorLangfuseWrapper.retention.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: monitor-langfuse-init-retention-job
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: langfuse-retention-provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 300
  template:
    metadata:
      name: monitor-langfuse-init-retention-job
      labels:
        app.kubernetes.io/name: langfuse-retention-provisioning
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: monitor-langfuse
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: init
          image: {{ .Values.monitorLangfuseWrapper.retentionPostgresImage | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Setting retention_days = {{ .Values.monitorLangfuseWrapper.retention.days }} for project {{ .Values.monitorLangfuseWrapper.initProjectId }}..."

              psql --set=ON_ERROR_STOP=1 <<'SQL'
              UPDATE projects
              SET retention_days = {{ .Values.monitorLangfuseWrapper.retention.days }}
              WHERE id = '{{ .Values.monitorLangfuseWrapper.initProjectId }}'
                AND (retention_days IS NULL OR retention_days <> {{ .Values.monitorLangfuseWrapper.retention.days }});
              SQL

              echo "Retention update complete."
          env:
            - name: PGHOST
              value: postgres-operations.infra-postgres-operations.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: langfuse
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-langfuse-secret
                  key: postgresql-password
            - name: PGDATABASE
              value: postgres_langfuse
            - name: PGSSLMODE
              value: disable
{{- end }}
