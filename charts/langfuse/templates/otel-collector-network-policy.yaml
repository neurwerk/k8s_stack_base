# =============================================================================
# Langfuse OTel Collector NetworkPolicy
#
# Secures the OTel collector's OTLP gRPC port (4317) by only allowing ingress
# from the AgentGateway gateway proxy. The OTLP HTTP port (4318) follows the
# same restriction.
#
# Without this NetworkPolicy, any compromised pod in any namespace could send
# traces to Langfuse. This policy ensures only the AgentGateway data plane
# proxy (infra-agentgateway-gateway pod) can push OTLP traces.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-langfuse-otel-collector-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-langfuse
spec:
  podSelector:
    matchLabels:
      app: monitor-langfuse-otel-collector
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-agentgateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: infra-agentgateway-gateway
      ports:
        - port: {{ .Values.monitorLangfuseWrapper.otelCollector.ports.grpc }}
          protocol: TCP
        - port: {{ .Values.monitorLangfuseWrapper.otelCollector.ports.http }}
          protocol: TCP
