{{- if .Values.addon.enabled -}}
{{- if ne .Release.Namespace "infra-postgres-operations" -}}{{ fail "DocumentDB provisioning must run in infra-postgres-operations" }}{{- end -}}
{{- $addon := .Values.addon -}}
{{- if or (ne (toString $addon.postgresPort) "5432") (ne (toString $addon.documentdbPort) "10260") -}}{{ fail "DocumentDB addon requires the shared Service ports 5432 and 10260" }}{{- end -}}
{{- if or (not (regexMatch `^[a-z][a-z0-9_]{0,62}$` $addon.user)) (hasPrefix "pg_" $addon.user) (has $addon.user (list "postgres" "documentdb" "operations_admin" "template0" "template1")) -}}{{ fail "addon.user must be a non-system database identifier" }}{{- end -}}
{{- if or (not (regexMatch `^[a-zA-Z][a-zA-Z0-9_]{0,62}$` $addon.database)) (has $addon.database (list "admin" "config" "local")) -}}{{ fail "addon.database must be a non-system document database identifier" }}{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-provision
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: documentdb-addon-provisioning
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: stage-provisioner
          image: {{ required "addon.toolingImage requires a published verified provisioner image" $addon.toolingImage | quote }}
          command: [stage-documentdb-provisioner]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $addon.resources | nindent 12 }}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
      containers:
        - name: provision
          image: {{ $addon.image | quote }}
          command: [/bin/sh, /runtime/provision.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $addon.resources | nindent 12 }}
          env:
            - name: PGHOST
              value: {{ $addon.host | quote }}
            - name: PGPORT
              value: {{ $addon.postgresPort | quote }}
            - {name: PGUSER, value: documentdb}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: disable}
            - {name: PGCONNECT_TIMEOUT, value: "5"}
            - {name: PGOPTIONS, value: "-c statement_timeout=30000"}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-operations-secret, key: admin-password}
            - {name: DOCUMENTDB_ADMIN_USER, value: operations_admin}
            - name: DOCUMENTDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-operations-secret, key: admin-password}
            - name: DOCUMENTDB_USER
              value: {{ $addon.user | quote }}
            - name: DOCUMENTDB_DATABASE
              value: {{ $addon.database | quote }}
            - name: DOCUMENTDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "addon.passwordSecret is required" $addon.passwordSecret }}
                  key: password
            - name: DOCUMENTDB_HOST
              value: {{ $addon.host | quote }}
            - name: DOCUMENTDB_PORT
              value: {{ $addon.documentdbPort | quote }}
            - {name: DOCUMENTDB_CA_FILE, value: /etc/documentdb/ca.crt}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: ca, mountPath: /etc/documentdb, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: ca
          configMap:
            name: infra-openbao-ca-bundle
            items: [{key: ca.crt, path: ca.crt}]
{{- end }}
