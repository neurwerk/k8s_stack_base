apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-auth-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgres-auth.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-keycloak
          podSelector:
            matchLabels:
              app: auth-keycloak-keycloak-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-auth-provisioning
      ports:
        - port: {{ .Values.postgresAuth.service.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-auth-provisioning-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-auth-provisioning
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "postgres-auth.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgresAuth.service.port }}
          protocol: TCP
