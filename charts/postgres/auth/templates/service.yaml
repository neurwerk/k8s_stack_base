apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-auth.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "postgres-auth.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.postgresAuth.service.port }}
      targetPort: postgresql
      protocol: TCP
