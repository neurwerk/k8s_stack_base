apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-auth-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-auth.labels" . | nindent 4 }}
spec:
  secretName: postgres-auth-tls
  duration: {{ .Values.postgresAuth.tls.duration }}
  commonName: postgres-auth
  dnsNames:
    - postgres-auth
    - postgres-auth.{{ .Release.Namespace }}
    - postgres-auth.{{ .Release.Namespace }}.svc
    - postgres-auth.{{ .Release.Namespace }}.svc.{{ .Values.postgresAuth.clusterDomain }}
  usages:
    - server auth
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.postgresAuth.tls.issuerName }}
