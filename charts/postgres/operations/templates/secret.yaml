{{- $adminPassword := required "postgresOperationsSecrets.adminPassword is required" .Values.postgresOperationsSecrets.adminPassword -}}
{{- $agentgatewayPassword := required "postgresOperationsSecrets.agentgatewayPassword is required" .Values.postgresOperationsSecrets.agentgatewayPassword -}}
{{- $documentdbPassword := required "postgresOperationsSecrets.documentdbPassword is required" .Values.postgresOperationsSecrets.documentdbPassword -}}
{{- $difyPassword := required "postgresOperationsSecrets.difyPassword is required" .Values.postgresOperationsSecrets.difyPassword -}}
{{- $langfusePassword := required "postgresOperationsSecrets.langfusePassword is required" .Values.postgresOperationsSecrets.langfusePassword -}}
{{- $librechatRagPassword := required "postgresOperationsSecrets.librechatRagPassword is required" .Values.postgresOperationsSecrets.librechatRagPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-operations-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operations.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ $adminPassword | quote }}
  agentgateway-password: {{ $agentgatewayPassword | quote }}
  documentdb-password: {{ $documentdbPassword | quote }}
  dify-password: {{ $difyPassword | quote }}
  langfuse-password: {{ $langfusePassword | quote }}
  librechat-rag-password: {{ $librechatRagPassword | quote }}
