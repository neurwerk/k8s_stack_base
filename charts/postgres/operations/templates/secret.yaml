{{- $adminPassword := required "postgresOperationsSecrets.adminPassword is required" .Values.postgresOperationsSecrets.adminPassword -}}
{{- $agentgatewayPassword := required "postgresOperationsSecrets.agentgatewayPassword is required" .Values.postgresOperationsSecrets.agentgatewayPassword -}}
{{- $langfusePassword := required "postgresOperationsSecrets.langfusePassword is required" .Values.postgresOperationsSecrets.langfusePassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-operations-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operations.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ $adminPassword | quote }}
  agentgateway-password: {{ $agentgatewayPassword | quote }}
  langfuse-password: {{ $langfusePassword | quote }}
