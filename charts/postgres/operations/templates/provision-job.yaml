{{- if or (ne .Values.studio.enabled true) (ne .Values.apiKeyBridge.enabled true) -}}
{{- fail "studio.enabled and apiKeyBridge.enabled are required for this Base release" -}}
{{- end -}}
{{- $addonName := .Values.postgresOperationsAddon.name | default "" -}}
{{- if and $addonName (not (regexMatch `^[a-z][a-z0-9_]{0,62}$` $addonName)) -}}
{{- fail "postgresOperationsAddon.name must be a simple PostgreSQL identifier" -}}
{{- end -}}
{{- if has $addonName (list "postgres" "template0" "template1" "operations_admin" "documentdb" "agentgateway" "langfuse" "postgres_langfuse" "postgres_langfuse_v4" "librechat" "librechat_rag" "studio" "api_key_bridge") -}}
{{- fail "postgresOperationsAddon.name conflicts with a Base-owned role or database" -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.postgresOperationsAddon.adoptExisting) -}}
{{- fail "postgresOperationsAddon.adoptExisting must be a boolean" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-operations-provision
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres-operations-provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: postgres
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: {{ .Values.postgresOperations.provisioning.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-operations-provisioning
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: postgres
    spec:
      serviceAccountName: postgres-operations-provisioning
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ .Values.postgresOperations.image | quote }}
          imagePullPolicy: {{ .Values.postgresOperations.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              deadline=$(($(date +%s) + 180))
              until psql --tuples-only --command='SELECT 1' >/dev/null 2>&1; do
                current_time=$(date +%s)
                if [ "$current_time" -ge "$deadline" ]; then
                  echo "PostgreSQL did not become ready before the provisioning deadline" >&2
                  exit 1
                fi
                sleep 2
              done

              psql --set=ON_ERROR_STOP=1 <<'SQL'
              \getenv documentdb_password DOCUMENTDB_PASSWORD
              \getenv agentgateway_password AGENTGATEWAY_PASSWORD
              \getenv langfuse_password LANGFUSE_PASSWORD
              \getenv librechat_rag_password LIBRECHAT_RAG_PASSWORD
              SET log_statement = 'none';
              SET log_min_duration_statement = -1;
              SET log_min_error_statement = 'panic';
              {{- if .Values.apiKeyBridge.enabled }}
              \getenv api_key_bridge_password API_KEY_BRIDGE_PASSWORD
              DO $$$$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'api_key_bridge') !=
                   EXISTS (SELECT 1 FROM pg_database WHERE datname = 'api_key_bridge') THEN
                  RAISE EXCEPTION 'Existing API key bridge role/database pair is incomplete; refusing takeover';
                END IF;
                IF EXISTS (
                  SELECT 1 FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba
                  WHERE d.datname = 'api_key_bridge' AND r.rolname != 'api_key_bridge'
                ) OR EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = 'api_key_bridge'
                    AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)
                ) OR EXISTS (
                  SELECT 1 FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.member
                  WHERE r.rolname = 'api_key_bridge'
                ) OR EXISTS (
                  SELECT 1 FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.roleid
                  WHERE r.rolname = 'api_key_bridge'
                ) THEN
                  RAISE EXCEPTION 'Existing API key bridge database or role is not owned by this provisioner';
                END IF;
                IF EXISTS (SELECT 1 FROM pg_database WHERE datname = 'api_key_bridge') AND NOT EXISTS (
                  SELECT 1 FROM pg_database d JOIN pg_shdescription s
                    ON s.objoid = d.oid AND s.classoid = 'pg_database'::regclass
                  WHERE d.datname = 'api_key_bridge' AND s.description = 'neurwerk-api-key-bridge-v1'
                ) THEN
                  RAISE EXCEPTION 'Existing API key bridge database lacks the provisioner marker; refusing takeover';
                END IF;
              END $$$$;
              SELECT format('CREATE ROLE api_key_bridge LOGIN PASSWORD %L', :'api_key_bridge_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'api_key_bridge') \gexec
              SELECT format('ALTER ROLE api_key_bridge WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'api_key_bridge_password') \gexec
              SELECT 'CREATE DATABASE api_key_bridge OWNER api_key_bridge'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'api_key_bridge') \gexec
              COMMENT ON DATABASE api_key_bridge IS 'neurwerk-api-key-bridge-v1';
              REVOKE ALL ON DATABASE api_key_bridge FROM PUBLIC;
              GRANT CONNECT, TEMPORARY ON DATABASE api_key_bridge TO api_key_bridge;
              {{- end }}
              {{- if .Values.studio.enabled }}
              \getenv studio_password STUDIO_PASSWORD
              DO $$$$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'studio') !=
                   EXISTS (SELECT 1 FROM pg_database WHERE datname = 'studio') THEN
                  RAISE EXCEPTION 'Existing Studio role/database pair is incomplete; refusing takeover';
                END IF;
                IF EXISTS (
                  SELECT 1 FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba
                  WHERE d.datname = 'studio' AND r.rolname != 'studio'
                ) OR EXISTS (
                  SELECT 1 FROM pg_roles
                  WHERE rolname = 'studio' AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)
                ) THEN
                  RAISE EXCEPTION 'Existing Studio database or role is not owned by this provisioner';
                END IF;
                IF EXISTS (SELECT 1 FROM pg_database WHERE datname = 'studio') AND NOT EXISTS (
                  SELECT 1 FROM pg_database d JOIN pg_shdescription s
                    ON s.objoid = d.oid AND s.classoid = 'pg_database'::regclass
                  WHERE d.datname = 'studio' AND s.description = 'neurwerk-studio-notice-preferences-v1'
                ) THEN
                  RAISE EXCEPTION 'Existing Studio database lacks the provisioner marker; refusing takeover';
                END IF;
              END $$$$;
              SELECT format('CREATE ROLE studio LOGIN PASSWORD %L', :'studio_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'studio') \gexec
              SELECT format('ALTER ROLE studio WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'studio_password') \gexec
              SELECT 'CREATE DATABASE studio OWNER studio'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'studio') \gexec
              COMMENT ON DATABASE studio IS 'neurwerk-studio-notice-preferences-v1';
              REVOKE ALL ON DATABASE studio FROM PUBLIC;
              GRANT CONNECT, TEMPORARY ON DATABASE studio TO studio;
              {{- end }}
              {{- if $addonName }}
              \getenv addon_name ADDON_DATABASE_NAME
              \getenv addon_password ADDON_DATABASE_PASSWORD
              \getenv addon_adopt_existing ADDON_DATABASE_ADOPT_EXISTING
              SELECT set_config('addon.name', :'addon_name', false);
              SELECT set_config('addon.adopt_existing', :'addon_adopt_existing', false);
              DO $$$$
              DECLARE name text := current_setting('addon.name', true);
              BEGIN
                -- Names are validated by Helm before the Job is created. Never
                -- adopt an existing mismatched role or database.
                IF EXISTS (SELECT FROM pg_roles WHERE rolname = name) !=
                   EXISTS (SELECT FROM pg_database WHERE datname = name) THEN
                  RAISE EXCEPTION 'Addon database role/database pair is incomplete';
                END IF;
                IF EXISTS (SELECT FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba
                           WHERE d.datname = name AND r.rolname != name) OR
                   EXISTS (SELECT FROM pg_roles WHERE rolname = name AND
                           (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)) OR
                   EXISTS (SELECT FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.member
                           WHERE r.rolname = name) OR
                   EXISTS (SELECT FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.roleid
                           WHERE r.rolname = name) THEN
                  RAISE EXCEPTION 'Addon database or role has unexpected ownership or privileges';
                END IF;
                IF EXISTS (SELECT FROM pg_database WHERE datname = name)
                   AND current_setting('addon.adopt_existing', true) != 'true'
                   AND NOT EXISTS (SELECT FROM pg_database d JOIN pg_shdescription s
                     ON s.objoid = d.oid AND s.classoid = 'pg_database'::regclass
                     WHERE d.datname = name AND s.description = 'neurwerk-addon-database-v1') THEN
                  RAISE EXCEPTION 'Existing addon database lacks ownership marker; refusing takeover';
                END IF;
              END $$$$;
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'addon_name', :'addon_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'addon_name') \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'addon_name', :'addon_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'addon_name', :'addon_name')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'addon_name') \gexec
              SELECT format('COMMENT ON DATABASE %I IS %L', :'addon_name', 'neurwerk-addon-database-v1') \gexec
              SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'addon_name') \gexec
              SELECT format('GRANT CONNECT, TEMPORARY ON DATABASE %I TO %I', :'addon_name', :'addon_name') \gexec
              {{- end }}
              SELECT format('CREATE ROLE agentgateway LOGIN PASSWORD %L', :'agentgateway_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agentgateway') \gexec
              SELECT format(
                'ALTER ROLE agentgateway WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
                :'agentgateway_password'
              ) \gexec
              SELECT format('CREATE ROLE langfuse LOGIN PASSWORD %L', :'langfuse_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'langfuse') \gexec
              SELECT format('ALTER ROLE langfuse WITH LOGIN PASSWORD %L', :'langfuse_password') \gexec
              SELECT format('CREATE ROLE librechat_rag LOGIN PASSWORD %L', :'librechat_rag_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'librechat_rag') \gexec
              SELECT format('ALTER ROLE librechat_rag WITH LOGIN PASSWORD %L', :'librechat_rag_password') \gexec

              SELECT 'CREATE DATABASE postgres_langfuse OWNER langfuse'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'postgres_langfuse') \gexec
              SELECT 'CREATE DATABASE postgres_langfuse_v4 OWNER langfuse'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'postgres_langfuse_v4') \gexec
              SELECT 'CREATE DATABASE librechat_rag OWNER librechat_rag'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'librechat_rag') \gexec
              SELECT 'CREATE DATABASE agentgateway OWNER agentgateway'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agentgateway') \gexec

              ALTER DATABASE agentgateway OWNER TO agentgateway;
              ALTER DATABASE postgres_langfuse OWNER TO langfuse;
              ALTER DATABASE postgres_langfuse_v4 OWNER TO langfuse;
              ALTER DATABASE librechat_rag OWNER TO librechat_rag;
              REVOKE CONNECT, TEMPORARY ON DATABASE postgres, template1 FROM PUBLIC;
              GRANT CONNECT ON DATABASE postgres TO documentdb, operations_admin;
              GRANT CONNECT ON DATABASE postgres TO documentdb_bg_worker_role;
              REVOKE ALL ON DATABASE agentgateway, postgres_langfuse, librechat_rag FROM PUBLIC;
              REVOKE ALL ON DATABASE postgres_langfuse_v4 FROM PUBLIC;
              GRANT CONNECT, TEMPORARY ON DATABASE agentgateway TO agentgateway;
              GRANT CONNECT, TEMPORARY ON DATABASE postgres_langfuse TO langfuse;
              GRANT CONNECT, TEMPORARY ON DATABASE postgres_langfuse_v4 TO langfuse;
              GRANT CONNECT, TEMPORARY ON DATABASE librechat_rag TO librechat_rag;

              \connect librechat_rag
              CREATE EXTENSION IF NOT EXISTS vector;
              \connect postgres
              DO $verify$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_extension WHERE extname = 'documentdb') THEN
                  RAISE EXCEPTION 'DocumentDB extension verification failed';
                END IF;
              END
              $verify$;
              SQL

              psql --set=ON_ERROR_STOP=1 \
                --command='ALTER ROLE operations_admin CREATEROLE; GRANT documentdb_admin_role TO operations_admin WITH ADMIN OPTION'
              revoke_documentdb_authorization() {
                cleanup_status=0
                psql --set=ON_ERROR_STOP=1 \
                  --command='REVOKE ADMIN OPTION FOR documentdb_admin_role FROM operations_admin CASCADE' || cleanup_status=$?
                psql --set=ON_ERROR_STOP=1 \
                  --command='ALTER ROLE operations_admin NOCREATEROLE' || cleanup_status=$?
                return "$cleanup_status"
              }
              cleanup_documentdb_authorization_on_exit() {
                provision_status=$?
                if ! revoke_documentdb_authorization; then
                  echo "DocumentDB administrator authorization revocation failed" >&2
                  exit 1
                fi
                exit "$provision_status"
              }
              trap cleanup_documentdb_authorization_on_exit 0

              mongosh --host="$DOCUMENTDB_HOST" --port="$DOCUMENTDB_PORT" \
                --tls --tlsCAFile="$DOCUMENTDB_CA_FILE" --quiet \
                --file=/opt/neurwerk/provision-documentdb.js

              psql --set=ON_ERROR_STOP=1 \
                --command='GRANT documentdb_admin_role TO librechat'
              revoke_documentdb_authorization
              trap - 0

              psql --set=ON_ERROR_STOP=1 <<'SQL'
              GRANT CONNECT ON DATABASE postgres TO librechat;
              DO $verify$
              BEGIN
                IF NOT has_database_privilege('documentdb_bg_worker_role', 'postgres', 'CONNECT') THEN
                  RAISE EXCEPTION 'DocumentDB background worker CONNECT verification failed';
                END IF;
                IF EXISTS (
                  SELECT FROM pg_database
                  WHERE datname IN (
                     'agentgateway', 'postgres_langfuse', 'postgres_langfuse_v4', 'librechat_rag'
                     {{- if $addonName }}
                      , '{{ $addonName }}'
                     {{- end }}
                     {{- if .Values.studio.enabled }}
                      , 'studio'
                      {{- end }}
                      {{- if .Values.apiKeyBridge.enabled }}
                      , 'api_key_bridge'
                      {{- end }}
                  ) AND has_database_privilege('documentdb_bg_worker_role', oid, 'CONNECT')
                ) THEN
                  RAISE EXCEPTION 'DocumentDB background worker unexpectedly has application database access';
                END IF;
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'librechat' AND rolcanlogin) THEN
                  RAISE EXCEPTION 'DocumentDB application role verification failed';
                END IF;
                IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'operations_admin' AND rolcreaterole) THEN
                  RAISE EXCEPTION 'DocumentDB administrator CREATEROLE revocation failed';
                END IF;
                IF NOT EXISTS (
                  SELECT
                  FROM pg_auth_members membership
                  JOIN pg_roles parent ON parent.oid = membership.roleid
                  JOIN pg_roles child ON child.oid = membership.member
                  WHERE parent.rolname = 'documentdb_admin_role'
                    AND child.rolname = 'operations_admin'
                    AND NOT membership.admin_option
                ) THEN
                  RAISE EXCEPTION 'DocumentDB administrator role delegation revocation failed';
                END IF;
                IF NOT EXISTS (
                  SELECT
                  FROM pg_auth_members membership
                  JOIN pg_roles parent ON parent.oid = membership.roleid
                  JOIN pg_roles child ON child.oid = membership.member
                  JOIN pg_roles grantor ON grantor.oid = membership.grantor
                  WHERE parent.rolname = 'documentdb_admin_role'
                    AND child.rolname = 'librechat'
                    AND grantor.rolname = 'documentdb'
                ) THEN
                  RAISE EXCEPTION 'DocumentDB application role ownership verification failed';
                END IF;
              END
              $verify$;
              SQL

              mongosh --host="$DOCUMENTDB_HOST" --port="$DOCUMENTDB_PORT" \
                --tls --tlsCAFile="$DOCUMENTDB_CA_FILE" --quiet \
                --file=/opt/neurwerk/verify-documentdb.js

              PGPASSWORD="$DOCUMENTDB_PASSWORD" PGUSER=librechat PGDATABASE=postgres \
                psql --tuples-only --command='SELECT current_user' | grep -qx '[[:space:]]*librechat'
              for database in agentgateway postgres_langfuse postgres_langfuse_v4 librechat_rag; do
                if PGPASSWORD="$DOCUMENTDB_PASSWORD" PGUSER=librechat PGDATABASE="$database" \
                  psql --tuples-only --command='SELECT 1' >/dev/null 2>&1; then
                  echo "DocumentDB application role unexpectedly connected to PostgreSQL database $database" >&2
                  exit 1
                fi
              done
              {{- if .Values.studio.enabled }}
              verify_studio_isolation() {
                user=$1
                password=$2
                if PGPASSWORD="$password" PGUSER="$user" PGDATABASE=studio \
                  psql --tuples-only --command='SELECT 1' >/dev/null 2>&1; then
                  echo "$user unexpectedly connected to Studio database" >&2
                  exit 1
                fi
              }
              verify_studio_isolation librechat "$DOCUMENTDB_PASSWORD"
              verify_studio_isolation agentgateway "$AGENTGATEWAY_PASSWORD"
              verify_studio_isolation langfuse "$LANGFUSE_PASSWORD"
              verify_studio_isolation librechat_rag "$LIBRECHAT_RAG_PASSWORD"
              PGPASSWORD="$STUDIO_PASSWORD" PGUSER=studio PGDATABASE=studio \
                psql --set=ON_ERROR_STOP=1 --command='BEGIN; CREATE TABLE public.__studio_provisioning_verification (id integer); INSERT INTO public.__studio_provisioning_verification VALUES (1); ROLLBACK;' >/dev/null
              {{- end }}

              PGPASSWORD="$AGENTGATEWAY_PASSWORD" PGUSER=agentgateway PGDATABASE=agentgateway \
                psql --tuples-only --command='SELECT current_user' | grep -qx '[[:space:]]*agentgateway'
              PGPASSWORD="$LANGFUSE_PASSWORD" PGUSER=langfuse PGDATABASE=postgres_langfuse \
                psql --tuples-only --command='SELECT current_user' | grep -qx '[[:space:]]*langfuse'
              PGPASSWORD="$LANGFUSE_PASSWORD" PGUSER=langfuse PGDATABASE=postgres_langfuse_v4 \
                psql --tuples-only --command='SELECT current_user' | grep -qx '[[:space:]]*langfuse'
              PGPASSWORD="$LIBRECHAT_RAG_PASSWORD" PGUSER=librechat_rag PGDATABASE=librechat_rag \
                psql --tuples-only --command="SELECT extname FROM pg_extension WHERE extname = 'vector'" | grep -qx '[[:space:]]*vector'
              verify_isolation() {
                user=$1
                password=$2
                shift 2
                for database in "$@"; do
                  if PGPASSWORD="$password" PGUSER="$user" PGDATABASE="$database" \
                    psql --tuples-only --command='SELECT 1' >/dev/null 2>&1; then
                    echo "$user unexpectedly connected to PostgreSQL database $database" >&2
                    exit 1
                  fi
                done
              }
              verify_isolation agentgateway "$AGENTGATEWAY_PASSWORD" postgres_langfuse librechat_rag
              verify_isolation langfuse "$LANGFUSE_PASSWORD" agentgateway librechat_rag
              verify_isolation agentgateway "$AGENTGATEWAY_PASSWORD" postgres_langfuse_v4
              verify_isolation librechat_rag "$LIBRECHAT_RAG_PASSWORD" postgres_langfuse_v4
              verify_isolation librechat_rag "$LIBRECHAT_RAG_PASSWORD" agentgateway postgres_langfuse
              {{- if .Values.apiKeyBridge.enabled }}
              PGPASSWORD="$API_KEY_BRIDGE_PASSWORD" PGUSER=api_key_bridge PGDATABASE=api_key_bridge \
                psql --set=ON_ERROR_STOP=1 --command='BEGIN; CREATE TABLE public.__bridge_provisioning_verification (id integer); ROLLBACK;' >/dev/null
              verify_isolation api_key_bridge "$API_KEY_BRIDGE_PASSWORD" postgres template1 agentgateway postgres_langfuse librechat_rag
              verify_isolation api_key_bridge "$API_KEY_BRIDGE_PASSWORD" postgres_langfuse_v4
              verify_isolation librechat "$DOCUMENTDB_PASSWORD" api_key_bridge
              verify_isolation agentgateway "$AGENTGATEWAY_PASSWORD" api_key_bridge
              verify_isolation langfuse "$LANGFUSE_PASSWORD" api_key_bridge
              verify_isolation librechat_rag "$LIBRECHAT_RAG_PASSWORD" api_key_bridge
              {{- if .Values.studio.enabled }}
              verify_isolation studio "$STUDIO_PASSWORD" api_key_bridge
              verify_isolation api_key_bridge "$API_KEY_BRIDGE_PASSWORD" studio
              {{- end }}
              {{- end }}
              {{- if .Values.studio.enabled }}
              verify_isolation studio "$STUDIO_PASSWORD" postgres template1 agentgateway postgres_langfuse librechat_rag
              verify_isolation studio "$STUDIO_PASSWORD" postgres_langfuse_v4
              {{- end }}
              {{- if $addonName }}
              PGPASSWORD="$ADDON_DATABASE_PASSWORD" PGUSER="$ADDON_DATABASE_NAME" PGDATABASE="$ADDON_DATABASE_NAME" \
                psql --set=ON_ERROR_STOP=1 --command='BEGIN; CREATE TABLE public.__addon_provisioning_verification (id integer); ROLLBACK;' >/dev/null
              verify_isolation "$ADDON_DATABASE_NAME" "$ADDON_DATABASE_PASSWORD" postgres template1 agentgateway postgres_langfuse postgres_langfuse_v4 librechat_rag studio api_key_bridge
              verify_isolation agentgateway "$AGENTGATEWAY_PASSWORD" "$ADDON_DATABASE_NAME"
              verify_isolation langfuse "$LANGFUSE_PASSWORD" "$ADDON_DATABASE_NAME"
              verify_isolation librechat_rag "$LIBRECHAT_RAG_PASSWORD" "$ADDON_DATABASE_NAME"
              verify_isolation librechat "$DOCUMENTDB_PASSWORD" "$ADDON_DATABASE_NAME"
              verify_isolation studio "$STUDIO_PASSWORD" "$ADDON_DATABASE_NAME"
              verify_isolation api_key_bridge "$API_KEY_BRIDGE_PASSWORD" "$ADDON_DATABASE_NAME"
              psql --set=ON_ERROR_STOP=1 --command="DO \$verify\$ BEGIN IF has_database_privilege('operations_admin', '$ADDON_DATABASE_NAME', 'CONNECT') THEN RAISE EXCEPTION 'Shared database administrator unexpectedly has addon access'; END IF; END \$verify\$;"
              {{- end }}
              echo "Operations PostgreSQL provisioning verified."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            {{- if .Values.apiKeyBridge.enabled }}
            - name: API_KEY_BRIDGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-key-bridge-postgres-values
                  key: password
            {{- end }}
            {{- if .Values.studio.enabled }}
            - name: STUDIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studio-postgres-values
                  key: password
            {{- end }}
            {{- if $addonName }}
            - name: ADDON_DATABASE_NAME
              value: {{ $addonName | quote }}
            - name: ADDON_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: addon-postgres-values
                  key: password
            - name: ADDON_DATABASE_ADOPT_EXISTING
              value: {{ .Values.postgresOperationsAddon.adoptExisting | quote }}
            {{- end }}
            - name: PGHOST
              value: postgres-operations.{{ .Release.Namespace }}.svc.{{ .Values.postgresOperations.clusterDomain }}
            - name: PGPORT
              value: {{ .Values.postgresOperations.service.postgresqlPort | quote }}
            - name: PGUSER
              value: documentdb
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: admin-password
            - name: DOCUMENTDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: documentdb-password
            - name: AGENTGATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: agentgateway-password
            - name: DOCUMENTDB_ADMIN_USER
              value: operations_admin
            - name: DOCUMENTDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: admin-password
            - name: DOCUMENTDB_USER
              value: librechat
            - name: DOCUMENTDB_DATABASE
              value: LibreChat
            - name: DOCUMENTDB_HOST
              value: postgres-operations.{{ .Release.Namespace }}.svc.{{ .Values.postgresOperations.clusterDomain }}
            - name: DOCUMENTDB_PORT
              value: {{ .Values.postgresOperations.service.documentdbPort | quote }}
            - name: DOCUMENTDB_CA_FILE
              value: /etc/documentdb/ca.crt
            - name: HOME
              value: /tmp
            - name: LANGFUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: langfuse-password
            - name: LIBRECHAT_RAG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: librechat-rag-password
            - name: PGSSLMODE
              value: disable
            - name: PGCONNECT_TIMEOUT
              value: "5"
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/neurwerk/provision-documentdb.js
              subPath: provision-documentdb.js
              readOnly: true
            - name: bootstrap
              mountPath: /opt/neurwerk/verify-documentdb.js
              subPath: verify-documentdb.js
              readOnly: true
            - name: ca
              mountPath: /etc/documentdb
              readOnly: true
            - name: tmp
