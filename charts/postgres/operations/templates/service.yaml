apiVersion: v1
kind: Service
metadata:
  name: postgres-operations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operations.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "postgres-operations.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.postgresOperations.service.postgresqlPort }}
      targetPort: postgresql
      protocol: TCP
    - name: documentdb
      port: {{ .Values.postgresOperations.service.documentdbPort }}
      targetPort: documentdb
      protocol: TCP
