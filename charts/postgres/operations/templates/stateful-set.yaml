apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-operations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres-operations.labels" . | nindent 4 }}
  annotations:
    secret.reloader.stakater.com/reload: postgres-operations-secret,postgres-operations-documentdb-tls
    ignore-check.kube-linter.io/privilege-escalation-container: "The reviewed upstream DocumentDB local image requires passwordless sudo for startup directory preparation."
spec:
  serviceName: postgres-operations
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "postgres-operations.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgres-operations.labels" . | nindent 8 }}
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
    spec:
      serviceAccountName: postgres-operations
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql-documentdb
          image: {{ .Values.postgresOperations.image | quote }}
          imagePullPolicy: {{ .Values.postgresOperations.imagePullPolicy }}
          securityContext:
            # The upstream local image uses passwordless sudo to prepare its
            # data and log directories before dropping back to its runtime user.
            allowPrivilegeEscalation: true
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresOperations.containerPorts.postgresql }}
              protocol: TCP
            - name: documentdb
              containerPort: {{ .Values.postgresOperations.containerPorts.documentdb }}
              protocol: TCP
          env:
            - name: USERNAME
              value: operations_admin
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: admin-password
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-operations-secret
                  key: admin-password
            - name: OWNER
              value: documentdb
            - name: DATA_PATH
              value: /data/postgresql
            - name: POSTGRESQL_PORT
              value: {{ .Values.postgresOperations.containerPorts.postgresql | quote }}
            - name: DOCUMENTDB_PORT
              value: {{ .Values.postgresOperations.containerPorts.documentdb | quote }}
            - name: ALLOW_EXTERNAL_CONNECTIONS
              value: "true"
            - name: ENABLE_TELEMETRY
              value: "false"
            - name: INIT_DATA
              value: "false"
            - name: TLS_MODE
              value: requireTLS
            - name: CERT_PATH
              value: /etc/documentdb/tls/tls.crt
            - name: KEY_FILE
              value: /etc/documentdb/tls/tls.key
          lifecycle:
            postStart:
              exec:
                command:
                  - /opt/neurwerk/bootstrap-admin.sh
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bootstrap
              mountPath: /opt/neurwerk/bootstrap-admin.sh
              subPath: bootstrap-admin.sh
              readOnly: true
            - name: tls
              mountPath: /etc/documentdb/tls
              readOnly: true
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - >-
                  psql --host=/var/run/postgresql --port="$POSTGRESQL_PORT" --username=documentdb --dbname=postgres --tuples-only --command='SELECT 1' >/dev/null
                  && mongosh --host localhost --port "$DOCUMENTDB_PORT" --username "$USERNAME" --password "$PASSWORD" --authenticationDatabase admin --tls --tlsCAFile /etc/documentdb/tls/ca.crt --quiet --eval 'if (!db.adminCommand({ ping: 1 }).ok) quit(1)' >/dev/null
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - >-
                  psql --host=/var/run/postgresql --port="$POSTGRESQL_PORT" --username=documentdb --dbname=postgres --tuples-only --command='SELECT 1' >/dev/null
                  && mongosh --host localhost --port "$DOCUMENTDB_PORT" --username "$USERNAME" --password "$PASSWORD" --authenticationDatabase admin --tls --tlsCAFile /etc/documentdb/tls/ca.crt --quiet --eval 'if (!db.adminCommand({ ping: 1 }).ok) quit(1)' >/dev/null
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - --host=/var/run/postgresql
                - --port={{ .Values.postgresOperations.containerPorts.postgresql }}
                - --username=documentdb
                - --dbname=postgres
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresOperations.resources | nindent 12 }}
      volumes:
        - name: bootstrap
          configMap:
            name: postgres-operations-bootstrap
            defaultMode: 0550
        - name: tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: postgres-operations-documentdb-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - configMap:
                  name: infra-openbao-ca-bundle
                  items:
                    - key: ca.crt
                      path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "postgres-operations.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgresOperations.persistence.size }}
        storageClassName: {{ required "postgresOperations.persistence.storageClassName is required" .Values.postgresOperations.persistence.storageClassName | quote }}
