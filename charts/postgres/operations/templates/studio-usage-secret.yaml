{{- if .Values.studio.usageEnabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-usage-postgres-values
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: infra-postgres-operations-openbao-secret-store, kind: SecretStore}
  target: {name: studio-usage-postgres-values, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: collector-password
      remoteRef: {key: infra-postgres-operations/internal, property: studioUsageCollectorPassword}
    - secretKey: reader-password
      remoteRef: {key: infra-postgres-operations/internal, property: studioUsageReaderPassword}
{{- end }}
