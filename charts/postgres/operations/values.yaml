# IMAGE SOURCE: upstream
postgresOperations:
  # Exact client-approved NetworkPolicy peers for the sole document-store product.
  documentdbIngressPeers: []
  image: ghcr.io/documentdb/documentdb/documentdb-local:pg18-0.116.0
  imagePullPolicy: IfNotPresent
  clusterDomain: cluster.local
  service:
    postgresqlPort: 5432
    documentdbPort: 10260
  containerPorts:
    postgresql: 9712
    documentdb: 10260
  # Shared PostgreSQL startup limits; changes restart PostgreSQL and DocumentDB.
  # Budget client pools together (including DocumentDB); connections are not a
  # promise of simultaneous query capacity within the shared 4Gi memory limit.
  maxConnections: 200
  maxLocksPerTransaction: 512
  pgCron:
    # Record new runs in cron.job_run_details; existing history and statement logs are retained.
    # Changing this startup setting restarts the shared PostgreSQL/DocumentDB pod.
    logRun: false
  persistence:
    size: 50Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  tls:
    duration: 2160h
    issuerName: infra-cert-manager-internal-ca-issuer
  provisioning:
    activeDeadlineSeconds: 300

# A selected product may supply one reviewed database/role name using the
# namespace-local addon-postgres-values Secret. The password is read only by
# the provisioning Job, never rendered into Helm values.
postgresOperationsAddon:
  name: ""
  adoptExisting: false

# Required roles; matching OpenBao credentials must be synced before reconciliation.
studio:
  enabled: true

apiKeyBridge:
  enabled: true
