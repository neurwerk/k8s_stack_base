apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-pii-engine-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-pii-engine.valkeyLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "monitor-pii-engine.valkeySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              monitor-pii-engine-valkey-client: "true"
      ports:
        - port: {{ .Values.monitorPiiEngine.valkey.service.port }}
          protocol: TCP
  egress: []
