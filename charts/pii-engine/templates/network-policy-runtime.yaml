apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-pii-engine-runtime-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-pii-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pii-engine
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runtime
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-agentgateway-extproc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: monitor-agentgateway-extproc
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend-studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-api
      ports:
        - port: {{ .Values.monitorPiiEngine.ports.container.application }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-kube-prometheus-stack
      ports:
        - port: {{ .Values.monitorPiiEngine.ports.container.management }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: valkey
      ports:
        - port: 6379
          protocol: TCP
    {{- if ne .Values.monitorPiiEngine.analyzerBackend "local" }}
    {{- range .Values.monitorPiiEngine.remote.egress }}
    {{- if or (empty .cidr) (not (regexMatch "/(32|128)$" .cidr)) (lt (int .port) 1) (gt (int .port) 65535) }}
    {{- fail "remote NER egress requires a scoped host CIDR (/32 or /128) and a valid TCP port" }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
    {{- end }}
