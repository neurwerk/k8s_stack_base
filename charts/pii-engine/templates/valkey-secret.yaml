{{- $password := randAlphaNum 32 | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "monitor-pii-engine-valkey" -}}
{{- if and $existing (hasKey $existing.data "valkey-password") -}}
{{- $password = index $existing.data "valkey-password" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: monitor-pii-engine-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-pii-engine.valkeyLabels" . | nindent 4 }}
type: Opaque
data:
  valkey-password: {{ $password | quote }}
