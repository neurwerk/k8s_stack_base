apiVersion: v1
kind: Service
metadata:
  name: monitor-pii-engine-valkey-primary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-pii-engine.valkeyLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "monitor-pii-engine.valkeySelectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-redis
      port: {{ .Values.monitorPiiEngine.valkey.service.port }}
      targetPort: valkey
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-pii-engine-valkey-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor-pii-engine.valkeyLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "monitor-pii-engine.valkeySelectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-redis
      port: {{ .Values.monitorPiiEngine.valkey.service.port }}
      targetPort: valkey
      protocol: TCP
