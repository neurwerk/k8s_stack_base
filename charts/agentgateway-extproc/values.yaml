# IMAGE SOURCE: owned service
# The extProc service is a neurwerk transport-only adapter image.
# Pinned here (chart defaults).
# =============================================================================
# charts/agentgateway-extproc/values.yaml — default values
#
# These defaults are overridden by:
#   - ConfigMap: base-shared-resources-config-map (releases/shared/resources.yaml)
#   - ConfigMap: base-shared-document-attachments-config-map
#   - ConfigMap: monitor-agentgateway-extproc-app-defaults
#   - ConfigMap: client-values (client config/client.yaml)
#   - ConfigMap: agentgateway-extproc-product-values (client product values)
# =============================================================================

# ── extProc gRPC service ──────────────────────────────────────────────────────
monitorAgentgatewayExtproc:
  alerts:
    # Covers dependency failures and response failures after headers were sent.
    enabled: true

  extprocImage: ghcr.io/neurwerk/k8s-stack-agentgateway-extproc:0.11.4@sha256:5e3b9c17e76bfabc9053054842ba6bcd1b133cb7b1a47563f06d21e5744f5e1e

  # Docling requires exactly two fixed replicas (no HPA while enabled).
  replicas: 2

  ports:
    container:
      extproc: 9000              # gRPC ext_proc
      http: 8000                 # HTTP /health + /metrics
    service:
      extproc: 9000              # port exposed by the K8s Service — must match container
      http: 80                   # standard HTTP port

  engine:
    url: "https://monitor-pii-engine-service.monitor-pii-engine.svc.cluster.local:443"
    caFile: /var/run/pii-engine/tls/ca.crt
    clientCertFile: /var/run/pii-engine/tls/tls.crt
    clientKeyFile: /var/run/pii-engine/tls/tls.key
    # Must remain above queueWaitTimeout + analysisTimeout and below the
    # AgentGateway extProc backend timeout.
    timeout: 615
    maxResponseBytes: "10485760"
    # Keep the dependency handshake below the outer Kubernetes probe timeout.
    readinessTimeout: 1

  # Text-only limits. Docling derives 64 MiB requests and a 68222976-byte gRPC
  # envelope instead, even if an existing client still supplies these values.
  maxRequestBytes: "5242880"
  maxResponseBytes: "10485760"
  maxTransformedRequestBytes: "10485760"
  grpcMaxReceiveMessageBytes: "6356992"
  # Application stream admission per process; native gRPC reserves rejection headroom.
  grpcMaximumConcurrentRpcs: 4
  shutdownGraceSeconds: 300

  # ── Adapter logging ───────────────────────────────────────────────────────
  debug: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 512Mi

  # Merged over resources only when Docling is enabled, including client values.
  # Override this block to resize upload workers; CPU inherits resources above.
  doclingResources:
    requests:
      memory: 1Gi
    limits:
      memory: 2Gi

  nodeSelector: {}
  tolerations: []

# Canonical client-wide values, shared with the Docling service and Gateway.
# Never override these independently in product values.
docling:
  enabled: false
  inference:
    # Preferred names: internal-standard / private-vlm; cpu / remote are aliases.
    # Templates retain cpu / remote environment values; 0.9.0 accepts both pairs.
    mode: remote
  documentTimeoutSeconds: 300
  # Whole document batch budget, not a separate timeout for every file.
  syncWaitSeconds: 360

# Keep aligned with releases/shared/document-attachments.yaml.
# Positive integers: fileBytes/totalBytes <= 40 MiB, count <= 20, pages <= 1000.
documentAttachments:
  fileBytes: 20971520
  totalBytes: 41943040
  count: 5
  pages: 200
