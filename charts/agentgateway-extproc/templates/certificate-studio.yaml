{{- if .Values.monitorAgentgatewayExtproc.noticePreferences.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitor-agentgateway-extproc-studio-client-certificate
  namespace: {{ .Release.Namespace }}
spec:
  commonName: monitor-agentgateway-extproc-studio
  secretName: monitor-agentgateway-extproc-studio-client-tls
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 360h
  usages:
    - client auth
  issuerRef:
    name: infra-cert-manager-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
