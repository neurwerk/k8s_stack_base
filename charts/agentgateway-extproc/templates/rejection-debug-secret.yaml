{{- if .Values.rejectedRequestDebug.enabled }}
# Dedicated identity: does not share ownership or OpenBao authority with Docling.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-agentgateway-extproc-rejection-debug
  namespace: monitor-agentgateway-extproc
  labels:
    app.kubernetes.io/name: monitor-agentgateway-extproc
    app.kubernetes.io/instance: monitor-agentgateway-extproc
    app.kubernetes.io/part-of: monitor-agentgateway-extproc
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monitor-agentgateway-extproc-rejection-debug
  namespace: monitor-agentgateway-extproc
  labels:
    app.kubernetes.io/name: monitor-agentgateway-extproc
    app.kubernetes.io/instance: monitor-agentgateway-extproc
    app.kubernetes.io/part-of: monitor-agentgateway-extproc
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitor-agentgateway-extproc-rejection-debug
          serviceAccountRef:
            name: monitor-agentgateway-extproc-rejection-debug
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitor-agentgateway-extproc-rejection-debug
  namespace: monitor-agentgateway-extproc
  labels:
    app.kubernetes.io/name: monitor-agentgateway-extproc
    app.kubernetes.io/instance: monitor-agentgateway-extproc
    app.kubernetes.io/part-of: monitor-agentgateway-extproc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: monitor-agentgateway-extproc-rejection-debug
    kind: SecretStore
  target:
    name: monitor-agentgateway-extproc-rejection-debug
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: public-key
      remoteRef:
        key: monitor-agentgateway-extproc/langfuse-debug
        property: publicKey
    - secretKey: secret-key
      remoteRef:
        key: monitor-agentgateway-extproc/langfuse-debug
        property: secretKey
{{- end }}
