{{- $readinessTimeoutValue := .Values.monitorAgentgatewayExtproc.engine.readinessTimeout -}}
{{- if not (or (kindIs "int" $readinessTimeoutValue) (kindIs "int64" $readinessTimeoutValue) (kindIs "float64" $readinessTimeoutValue)) -}}
{{- fail "monitorAgentgatewayExtproc.engine.readinessTimeout must be a number" -}}
{{- end }}
{{- $readinessTimeout := float64 $readinessTimeoutValue -}}
{{- if or (le $readinessTimeout 0.0) (gt $readinessTimeout 1.0) -}}
{{- fail "monitorAgentgatewayExtproc.engine.readinessTimeout must be greater than zero and at most one second" -}}
{{- end }}
{{- $docling := .Values.docling -}}
{{- $imageInspection := .Values.monitorAgentgatewayExtproc.imageInspection -}}
{{- $reloadSecrets := "monitor-agentgateway-extproc-engine-client-tls" -}}
{{- if $docling.enabled -}}
{{- $reloadSecrets = printf "%s,monitor-agentgateway-extproc-docling-secret" $reloadSecrets -}}
{{- end -}}
{{- if $imageInspection.enabled -}}
{{- $reloadSecrets = printf "%s,%s" $reloadSecrets $imageInspection.tokenSecretRef.name -}}
{{- end -}}
{{- $resources := deepCopy .Values.monitorAgentgatewayExtproc.resources -}}
{{- if $docling.enabled -}}
{{- $resources = mergeOverwrite $resources .Values.monitorAgentgatewayExtproc.doclingResources -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-agentgateway-extproc-deployment
  namespace: monitor-agentgateway-extproc
  annotations:
    secret.reloader.stakater.com/reload: {{ $reloadSecrets }}
    {{- if and $imageInspection.enabled $imageInspection.caConfigMap }}
    configmap.reloader.stakater.com/reload: {{ $imageInspection.caConfigMap | quote }}
    {{- end }}
  labels:
    app.kubernetes.io/name: monitor-agentgateway-extproc
    app.kubernetes.io/instance: monitor-agentgateway-extproc
    app.kubernetes.io/part-of: monitor-agentgateway-extproc
spec:
  replicas: {{ .Values.monitorAgentgatewayExtproc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor-agentgateway-extproc
      app.kubernetes.io/instance: monitor-agentgateway-extproc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor-agentgateway-extproc
        app.kubernetes.io/instance: monitor-agentgateway-extproc
        app.kubernetes.io/part-of: monitor-agentgateway-extproc
      annotations:
        checksum/config: {{ .Values.monitorAgentgatewayExtproc.engine.url | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add .Values.monitorAgentgatewayExtproc.shutdownGraceSeconds 30 }}
      securityContext:
        {{- toYaml .Values.monitorAgentgatewayExtproc.securityContext | nindent 8 }}
      containers:
        - name: extproc
          image: {{ .Values.monitorAgentgatewayExtproc.extprocImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.monitorAgentgatewayExtproc.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.monitorAgentgatewayExtproc.ports.container.extproc }}
              name: extproc
              protocol: TCP
            - containerPort: {{ .Values.monitorAgentgatewayExtproc.ports.container.http }}
              name: http
              protocol: TCP
          env:
            - name: EXTPROC_SHUTDOWN_GRACE_SECONDS
              value: {{ .Values.monitorAgentgatewayExtproc.shutdownGraceSeconds | quote }}
            - name: EXTPROC_ENGINE__BASE_URL
              value: {{ .Values.monitorAgentgatewayExtproc.engine.url | quote }}
            - name: EXTPROC_ENGINE__CA_CERT
              value: {{ .Values.monitorAgentgatewayExtproc.engine.caFile | quote }}
            - name: EXTPROC_ENGINE__CLIENT_CERT
              value: {{ .Values.monitorAgentgatewayExtproc.engine.clientCertFile | quote }}
            - name: EXTPROC_ENGINE__CLIENT_KEY
              value: {{ .Values.monitorAgentgatewayExtproc.engine.clientKeyFile | quote }}
            - name: EXTPROC_ENGINE__TIMEOUT
              value: {{ .Values.monitorAgentgatewayExtproc.engine.timeout | quote }}
            - name: EXTPROC_ENGINE__MAX_RESPONSE_BYTES
              value: {{ .Values.monitorAgentgatewayExtproc.engine.maxResponseBytes | quote }}
            - name: EXTPROC_ENGINE__READINESS_TIMEOUT
              value: {{ .Values.monitorAgentgatewayExtproc.engine.readinessTimeout | quote }}
            {{- if $imageInspection.enabled }}
            - name: EXTPROC_IMAGE_INSPECTION__ENABLED
              value: "true"
            - name: EXTPROC_IMAGE_INSPECTION__BASE_URL
              value: {{ $imageInspection.baseUrl | quote }}
            - name: EXTPROC_IMAGE_INSPECTION__ALLOW_HTTP
              value: {{ $imageInspection.allowHttp | quote }}
            {{- if $imageInspection.caConfigMap }}
            - name: EXTPROC_IMAGE_INSPECTION__CA_CERT
              value: {{ $imageInspection.caFile | quote }}
            {{- end }}
            - name: EXTPROC_IMAGE_INSPECTION__API_KEY
              valueFrom:
                secretKeyRef: {{ $imageInspection.tokenSecretRef | toJson }}
            - name: EXTPROC_IMAGE_INSPECTION__MODEL
              value: {{ $imageInspection.model | quote }}
            - name: EXTPROC_IMAGE_INSPECTION__TIMEOUT
              value: {{ $imageInspection.timeout | quote }}
            {{- end }}
            {{- if $docling.enabled }}
            - name: EXTPROC_DOCLING__ENABLED
              value: "true"
            - name: EXTPROC_DOCLING__BASE_URL
              value: "https://docling.docling.svc"
            # Reuse only the common internal CA, not the PII client identity.
            - name: EXTPROC_DOCLING__CA_CERT
              value: "/var/run/pii-engine/tls/ca.crt"
            - name: EXTPROC_DOCLING__API_KEY
              valueFrom:
                secretKeyRef:
                  name: monitor-agentgateway-extproc-docling-secret
                  key: api-key
            - name: EXTPROC_DOCLING__INFERENCE_MODE
              value: {{ ternary "cpu" "remote" (has $docling.inference.mode (list "cpu" "internal-standard")) | quote }}
            - name: EXTPROC_DOCLING__TIMEOUT
              value: {{ $docling.syncWaitSeconds | quote }}
            - name: EXTPROC_DOCLING__DOCUMENT_TIMEOUT
              value: {{ $docling.documentTimeoutSeconds | quote }}
            - name: EXTPROC_DOCLING__FILE_BYTES
              value: {{ .Values.documentAttachments.fileBytes | int64 | quote }}
            - name: EXTPROC_DOCLING__TOTAL_BYTES
              value: {{ .Values.documentAttachments.totalBytes | int64 | quote }}
            - name: EXTPROC_DOCLING__COUNT
              value: {{ .Values.documentAttachments.count | int | quote }}
            - name: EXTPROC_DOCLING__PAGES
              value: {{ .Values.documentAttachments.pages | int | quote }}
            - name: EXTPROC_DOCLING__MAX_RESPONSE_BYTES
              value: "16777216"
            {{- end }}
            - name: EXTPROC_DEBUG
              value: {{ .Values.monitorAgentgatewayExtproc.debug | quote }}
            - name: EXTPROC_MAX_REQUEST_BYTES
              value: {{ if $docling.enabled }}"67108864"{{ else }}{{ .Values.monitorAgentgatewayExtproc.maxRequestBytes | quote }}{{ end }}
            - name: EXTPROC_MAX_RESPONSE_BYTES
              value: {{ .Values.monitorAgentgatewayExtproc.maxResponseBytes | quote }}
            - name: EXTPROC_MAX_TRANSFORMED_REQUEST_BYTES
              value: {{ .Values.monitorAgentgatewayExtproc.maxTransformedRequestBytes | quote }}
            - name: EXTPROC_GRPC_MAX_RECEIVE_MESSAGE_BYTES
              value: {{ if $docling.enabled }}"68222976"{{ else }}{{ .Values.monitorAgentgatewayExtproc.grpcMaxReceiveMessageBytes | quote }}{{ end }}
            - name: EXTPROC_GRPC_MAXIMUM_CONCURRENT_RPCS
              value: {{ .Values.monitorAgentgatewayExtproc.grpcMaximumConcurrentRpcs | quote }}
          volumeMounts:
            - name: engine-tls
              mountPath: /var/run/pii-engine/tls
              readOnly: true
            {{- if and $imageInspection.enabled $imageInspection.caConfigMap }}
            - name: image-inspection-ca
              mountPath: {{ $imageInspection.caFile | quote }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.monitorAgentgatewayExtproc.ports.container.http }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.monitorAgentgatewayExtproc.ports.container.http }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $resources | nindent 12 }}
      volumes:
        - name: engine-tls
          secret:
            secretName: monitor-agentgateway-extproc-engine-client-tls
        {{- if and $imageInspection.enabled $imageInspection.caConfigMap }}
        - name: image-inspection-ca
          configMap:
            name: {{ $imageInspection.caConfigMap | quote }}
            items:
              - {key: ca.crt, path: ca.crt}
        {{- end }}
      {{- with .Values.monitorAgentgatewayExtproc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.monitorAgentgatewayExtproc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: monitor-agentgateway-extproc
                topologyKey: kubernetes.io/hostname
