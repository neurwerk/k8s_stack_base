apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitor-agentgateway-extproc-engine-client-certificate
  namespace: monitor-agentgateway-extproc
  labels:
    app.kubernetes.io/name: monitor-agentgateway-extproc
    app.kubernetes.io/instance: monitor-agentgateway-extproc
    app.kubernetes.io/part-of: monitor-agentgateway-extproc
spec:
  commonName: monitor-agentgateway-extproc
  secretName: monitor-agentgateway-extproc-engine-client-tls
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 360h
  usages:
    - client auth
  issuerRef:
    name: infra-cert-manager-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
