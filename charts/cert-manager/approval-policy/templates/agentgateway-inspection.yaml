{{- $inspection := .Values.agentgateway.inspection -}}
{{- if not (kindIs "bool" $inspection.enabled) }}{{ fail "agentgateway.inspection.enabled must be boolean" }}{{- end }}
{{- if $inspection.enabled }}
{{- if or (not (kindIs "slice" $inspection.rootIds)) (lt (len $inspection.rootIds) 1) (gt (len $inspection.rootIds) 16) }}{{ fail "inspection rootIds must contain 1 to 16 generations" }}{{- end }}
{{- $seen := dict }}
{{- range $id := $inspection.rootIds }}
{{- if or (not (kindIs "string" $id)) (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,14}[a-z0-9])?$" $id)) }}{{ fail "inspection root ID must be a DNS label of at most 16 characters" }}{{- end }}
{{- if hasKey $seen $id }}{{ fail "inspection rootIds must be unique" }}{{- end }}
{{- $_ := set $seen $id true }}
{{- range $profile := list
  (dict "component" "root" "commonName" "Root" "duration" "87600h" "namespace" "infra-cert-manager" "kind" "Issuer" "issuer" "agentgateway-inspection-bootstrap-issuer")
  (dict "component" "signer" "commonName" "Signer" "duration" "2160h" "namespace" "infra-agentgateway" "kind" "ClusterIssuer" "issuer" (printf "agentgateway-inspection-root-%s-issuer" $id))
}}
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cert-manager-agentgateway-inspection-{{ $profile.component }}-{{ $id }}
  labels:
    {{- include "cert-manager-approval-policy.labels" $ | nindent 4 }}
spec:
  allowed:
    commonName:
      value: Neurwerk AgentGateway Inspection {{ $profile.commonName }} {{ $id }}
      required: true
    # These bound requested values; approver-policy cannot require isCA/usages.
    isCA: true
    usages: [cert sign, crl sign]
  constraints:
    minDuration: {{ $profile.duration }}
    maxDuration: {{ $profile.duration }}
    privateKey: {algorithm: ECDSA, minSize: 256, maxSize: 256}
  selector:
    issuerRef:
      group: cert-manager.io
      kind: {{ $profile.kind }}
      name: {{ $profile.issuer }}
    namespace:
      matchNames: [{{ $profile.namespace }}]
{{- end }}
{{- end }}
{{- end }}
