  (dict "name" "cert-manager-public-keycloak" "namespace" "auth-keycloak" "hostname" .Values.authKeycloak.hostname)
  (dict "name" "cert-manager-public-agentgateway" "namespace" "infra-agentgateway" "hostname" .Values.infraAgentgatewayWrapper.hostname)
  (dict "name" "cert-manager-public-librechat" "namespace" "frontend-librechat" "hostname" .Values.frontendLibrechat.hostname)
  (dict "name" "cert-manager-public-librechat-admin" "namespace" "frontend-librechat" "hostname" .Values.frontendLibrechat.adminPanel.hostname)
  (dict "name" "cert-manager-public-dify" "namespace" "frontend-dify" "hostname" .Values.frontendDify.hostname)
  (dict "name" "cert-manager-public-studio" "namespace" "frontend-studio" "hostname" .Values.frontendStudio.studio.hostname)
  (dict "name" "cert-manager-public-langfuse" "namespace" "monitor-langfuse" "hostname" .Values.monitorLangfuseWrapper.hostname)
  (dict "name" "cert-manager-public-rook-object-gateway" "namespace" "infra-rook-ceph" "hostname" .Values.infraRookCeph.objectStore.publicHostname)
-}}
{{- $publicIssuers := list
  (dict "name" "staging" "issuer" "letsencrypt-staging-cluster-issuer")
  (dict "name" "production" "issuer" "letsencrypt-production-cluster-issuer")
-}}
{{- range $policy := $publicPolicies }}
{{- if eq (include "cert-manager-approval-policy.validHostname" $policy.hostname) "true" }}
{{- range $issuer := $publicIssuers }}
---
{{ include "cert-manager-approval-policy.public" (dict "name" (printf "%s-%s" $policy.name $issuer.name) "namespace" $policy.namespace "hostname" $policy.hostname "issuer" $issuer.issuer "root" $) }}
{{- end }}
{{- end }}
{{- end }}
