# approver-policy has no required switch for usages or isCA. These profiles
# constrain their values exactly when the CertificateRequest carries them.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cert-manager-internal-ca-bootstrap
  labels:
    {{- include "cert-manager-approval-policy.labels" . | nindent 4 }}
spec:
  allowed:
    commonName:
      value: Internal CA
      required: true
    isCA: true
    usages:
      - digital signature
      - key encipherment
      - cert sign
  constraints:
    minDuration: 87600h
    maxDuration: 87600h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 2048
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-cert-manager-self-signed-issuer
    namespace:
      matchNames:
        - infra-cert-manager
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cert-manager-internal-openbao-server
  labels:
    {{- include "cert-manager-approval-policy.labels" . | nindent 4 }}
spec:
  allowed:
    dnsNames:
      values:
        - localhost
        - infra-openbao
        - infra-openbao.infra-openbao
        - infra-openbao.infra-openbao.svc
        - infra-openbao.infra-openbao.svc.{{ .Values.infraOpenbaoWrapper.tls.clusterDomain }}
        - infra-openbao-internal
        - infra-openbao-internal.infra-openbao
        - infra-openbao-internal.infra-openbao.svc
        - infra-openbao-internal.infra-openbao.svc.{{ .Values.infraOpenbaoWrapper.tls.clusterDomain }}
        - "*.infra-openbao-internal"
        - "*.infra-openbao-internal.infra-openbao"
        - "*.infra-openbao-internal.infra-openbao.svc"
        - "*.infra-openbao-internal.infra-openbao.svc.{{ .Values.infraOpenbaoWrapper.tls.clusterDomain }}"
        - infra-openbao-0.infra-openbao-internal.infra-openbao.svc
        - infra-openbao-active
        - infra-openbao-active.infra-openbao
        - infra-openbao-active.infra-openbao.svc
        - infra-openbao-standby
        - infra-openbao-standby.infra-openbao
        - infra-openbao-standby.infra-openbao.svc
        - infra-openbao-ui
        - infra-openbao-ui.infra-openbao
        - infra-openbao-ui.infra-openbao.svc
      required: true
    ipAddresses:
      values:
        - 127.0.0.1
      required: true
    isCA: false
    usages:
      - digital signature
      - key encipherment
  constraints:
    minDuration: 2160h
    maxDuration: 2160h
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 256
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: infra-cert-manager-internal-ca-issuer
    namespace:
      matchNames:
        - infra-openbao
---
