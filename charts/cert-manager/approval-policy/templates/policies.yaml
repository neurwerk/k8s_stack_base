apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: cert-manager-deny-unmatched
  labels:
    {{- include "cert-manager-approval-policy.labels" . | nindent 4 }}
spec:
  allowed:
    # A required empty common name can never permit a request. This policy is
    # appropriate for every cert-manager Issuer signer, making misses terminal.
    commonName:
      value: ""
      required: true
  selector:
    issuerRef:
      group: cert-manager.io
      kind: "*Issuer"
      name: "*"
    namespace: {}
