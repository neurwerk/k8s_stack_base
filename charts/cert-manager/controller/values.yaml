# IMAGE SOURCE: upstream
# cert-manager images are controlled by the vendor subchart.
# =============================================================================
# charts/cert-manager/controller/values.yaml — default values
# =============================================================================

cert-manager:
  namespace: infra-cert-manager
  disableAutoApproval: true
  global:
    rbac:
      aggregateClusterRoles: false
  crds:
    enabled: false
  replicaCount: 1
  config:
    enableGatewayAPI: true
  prometheus:
    # Expose metrics during bootstrap. The optional inspection PKI package owns
    # the ServiceMonitor after kube-prometheus-stack; keep vendor monitors off.
    enabled: true
    servicemonitor:
      enabled: false
    podmonitor:
      enabled: false
