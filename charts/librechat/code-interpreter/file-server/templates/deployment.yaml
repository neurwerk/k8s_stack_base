{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "librechat-code-interpreter-file-server.fullname" . }}
  annotations:
    secret.reloader.stakater.com/reload: {{ printf "%s,%s,%s" $product.internalAuthSecretName $product.valkey.authSecretName $product.objectStorage.claimName | quote }}
  labels:
    {{- include "librechat-code-interpreter-file-server.labels" . | nindent 4 }}
spec:
  replicas: {{ $product.fileServer.replicas }}
  selector:
    matchLabels:
      {{- include "librechat-code-interpreter-file-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librechat-code-interpreter-file-server.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "librechat-code-interpreter-file-server.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: file-server
          image: {{ printf "%s:%s" $product.image.repository $product.image.tag | quote }}
          imagePullPolicy: {{ $product.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $product.fileServer.port }}
              protocol: TCP
          env:
            - name: MINIO_ENDPOINT
              value: {{ $product.objectStorage.endpoint | quote }}
            - name: MINIO_PORT
              value: {{ $product.objectStorage.port | quote }}
            - name: MINIO_NO_PORT
              value: "false"
            - name: MINIO_USE_SSL
              value: {{ $product.objectStorage.useSSL | quote }}
            - name: MINIO_BUCKET
              value: {{ $product.objectStorage.bucketName | quote }}
            - name: MINIO_REGION
              value: {{ $product.objectStorage.region | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $product.objectStorage.claimName }}
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $product.objectStorage.claimName }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: REDIS_HOST
              value: {{ $product.valkey.host | quote }}
            - name: REDIS_PORT
              value: {{ $product.valkey.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $product.valkey.authSecretName }}
                  key: password
            - name: CODEAPI_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $product.internalAuthSecretName }}
                  key: token
            - name: FILE_SERVER_PORT
              value: {{ $product.fileServer.port | quote }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $product.fileServer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
