# IMAGE SOURCE: expected first-party build of the pinned upstream source.
# Upstream publishes no image at this commit; this exact-SHA mirror reference
# must be verified or replaced by an equivalently pinned owned build.
frontendLibrechatCodeInterpreter:
  image:
    repository: ghcr.io/neurwerk/librechat-code-interpreter-file-server
    tag: fea707467600f3802d65596a6875c7822f25cfd8
    pullPolicy: IfNotPresent

  fileServer:
    replicas: 1
    port: 3000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  valkey:
    host: librechat-code-interpreter-valkey
    port: 6379
    authSecretName: librechat-code-interpreter-valkey-auth
  internalAuthSecretName: librechat-code-interpreter-internal-auth

  objectStorage:
    # Credentials are generated by this namespace's ObjectBucketClaim.
    claimName: librechat-code-interpreter-files
    bucketName: librechat-code-interpreter-files
    endpoint: rook-ceph-rgw-infra-rook-ceph-object-store.infra-rook-ceph.svc.cluster.local
    port: 80
    useSSL: false
    region: us-east-1
    networkPolicy:
      namespace: infra-rook-ceph
      # NetworkPolicy selects the RGW Pod, whose destination port is 8080.
      port: 8080
      podLabels:
        app: rook-ceph-rgw
        rook_object_store: infra-rook-ceph-object-store
