{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
{{- $sandbox := $product.sandbox -}}
{{- $name := include "librechat-code-interpreter-worker.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-sandbox-runner
  annotations:
    secret.reloader.stakater.com/reload: {{ $product.executionManifest.verifierSecretName | quote }}
    ignore-check.kube-linter.io/privilege-escalation-container: "Direct NsJail requires the documented SYS_ADMIN capability set without privileged mode."
  labels:
    {{- include "librechat-code-interpreter-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-runner
spec:
  replicas: {{ $sandbox.replicas }}
  selector:
    matchLabels:
      {{- include "librechat-code-interpreter-worker.sandboxSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librechat-code-interpreter-worker.labels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-runner
    spec:
      serviceAccountName: {{ $name }}-sandbox-runner
      automountServiceAccountToken: false
      # Service env injection supplies the gateway ClusterIP. Using that IP
      # lets the sandbox-runner operate with no DNS egress at all.
      enableServiceLinks: true
      initContainers:
        - name: wait-for-packages
          image: {{ printf "%s:%s" $product.images.sandboxRunner.repository $product.images.sandboxRunner.tag | quote }}
          imagePullPolicy: {{ $product.images.sandboxRunner.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - until test -s /host-packages/.initialized; do sleep 5; done
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: packages
              mountPath: /host-packages
              readOnly: true
      containers:
        - name: sandbox-runner
          image: {{ printf "%s:%s" $product.images.sandboxRunner.repository $product.images.sandboxRunner.tag | quote }}
          imagePullPolicy: {{ $product.images.sandboxRunner.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: {{ $sandbox.security.privileged }}
            allowPrivilegeEscalation: {{ $sandbox.security.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add:
                {{- toYaml $sandbox.security.capabilities | nindent 16 }}
            {{- if $sandbox.security.seccomp.enabled }}
            seccompProfile:
              type: Localhost
              localhostProfile: {{ $sandbox.security.seccomp.localhostProfile | quote }}
            {{- else }}
            seccompProfile:
              type: Unconfined
            {{- end }}
            {{- if $sandbox.security.appArmor.enabled }}
            appArmorProfile:
              type: Localhost
              localhostProfile: {{ $sandbox.security.appArmor.localhostProfile | quote }}
            {{- end }}
          ports:
            - name: sandbox
              containerPort: {{ $sandbox.port }}
              protocol: TCP
          env:
            - name: KVM_ENABLED
              value: "false"
            - name: CODEAPI_HARDENED_SANDBOX_MODE
              value: {{ $product.hardenedSandboxMode | quote }}
            - name: SANDBOX_RUNNER_FD_LIVENESS_LIMIT
              value: {{ $sandbox.fdLivenessLimit | quote }}
            - name: EGRESS_GATEWAY_URL
              value: "http://$(LIBRECHAT_CODE_INTERPRETER_EGRESS_GATEWAY_SERVICE_HOST):$(LIBRECHAT_CODE_INTERPRETER_EGRESS_GATEWAY_SERVICE_PORT)"
            - name: SANDBOX_LOG_LEVEL
              value: INFO
            - name: SANDBOX_PACKAGES_DIRECTORY
              value: /pkgs
            - name: SANDBOX_MAX_PROCESS_COUNT
              value: {{ $sandbox.maxProcessCount | quote }}
            - name: SANDBOX_RUN_CPU_TIME
              value: {{ $sandbox.runCpuTimeMs | quote }}
            - name: SANDBOX_RUN_TIMEOUT
              value: {{ $sandbox.runTimeoutMs | quote }}
            - name: SANDBOX_COMPILE_CPU_TIME
              value: {{ $sandbox.compileCpuTimeMs | quote }}
            - name: SANDBOX_COMPILE_TIMEOUT
              value: {{ $sandbox.compileTimeoutMs | quote }}
            - name: SANDBOX_OUTPUT_MAX_SIZE
              value: {{ $sandbox.outputMaxSize | quote }}
            - name: SANDBOX_MAX_OPEN_FILES
              value: {{ $sandbox.maxOpenFiles | quote }}
            - name: SANDBOX_MAX_CONCURRENT_JOBS
              value: {{ $sandbox.maxConcurrentJobs | quote }}
            - name: SANDBOX_PER_JOB_UIDS
              value: {{ $sandbox.perJobUids | quote }}
            - name: SANDBOX_JOB_UID_BASE
              value: {{ $sandbox.jobUidBase | quote }}
            - name: SANDBOX_JOB_GID_BASE
              value: {{ $sandbox.jobGidBase | quote }}
            - name: SANDBOX_JOB_UID_COUNT
              value: {{ $sandbox.jobUidCount | quote }}
            - name: SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS
              value: {{ $sandbox.workspaceReaperMaxAgeSeconds | quote }}
            - name: SANDBOX_EXECUTE_BODY_LIMIT
              value: {{ $sandbox.executeBodyLimit | quote }}
            - name: SANDBOX_DISABLE_NETWORKING
              value: "true"
            - name: SANDBOX_ALLOWED_LOCAL_NETWORK_PORT
              value: {{ $product.egressGateway.port | quote }}
            - name: SANDBOX_FORWARD_TARGET
              value: "$(LIBRECHAT_CODE_INTERPRETER_EGRESS_GATEWAY_SERVICE_HOST):$(LIBRECHAT_CODE_INTERPRETER_EGRESS_GATEWAY_SERVICE_PORT)"
            - name: SANDBOX_REQUIRE_EGRESS_MANIFEST
              value: "true"
            - name: SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $product.executionManifest.verifierSecretName }}
                  key: public-key
          livenessProbe:
            exec:
              command: ["/usr/local/bin/sandbox-runner-healthcheck.sh"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: sandbox
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $sandbox.resources | nindent 12 }}
          volumeMounts:
            - name: packages
              mountPath: /host-packages
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: packages
          persistentVolumeClaim:
            claimName: librechat-code-interpreter-packages
        - name: tmp
          emptyDir: {}
      nodeSelector:
        {{- toYaml $product.scheduling.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $product.scheduling.tolerations | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-sandbox-runner
  labels:
    {{- include "librechat-code-interpreter-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-runner
spec:
  type: ClusterIP
  ports:
    - name: sandbox
      port: {{ $sandbox.port }}
      targetPort: sandbox
      protocol: TCP
  selector:
    {{- include "librechat-code-interpreter-worker.sandboxSelectorLabels" . | nindent 4 }}
