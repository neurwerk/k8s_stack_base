{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
{{- $name := include "librechat-code-interpreter-worker.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-service-worker
  labels:
    {{- include "librechat-code-interpreter-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-worker
spec:
  podSelector:
    matchLabels:
      {{- include "librechat-code-interpreter-worker.serviceWorkerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-valkey
      ports:
        - protocol: TCP
          port: {{ $product.valkey.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-worker
              app.kubernetes.io/component: sandbox-runner
      ports:
        - protocol: TCP
          port: {{ $product.sandbox.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-egress-gateway
      ports:
        - protocol: TCP
          port: {{ $product.egressGateway.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-sandbox-runner
  labels:
    {{- include "librechat-code-interpreter-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-runner
spec:
  podSelector:
    matchLabels:
      {{- include "librechat-code-interpreter-worker.sandboxSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-worker
              app.kubernetes.io/component: service-worker
      ports:
        - protocol: TCP
          port: {{ $product.sandbox.port }}
  egress:
    # The gateway ClusterIP is injected through Kubernetes service env vars,
    # so sandbox-runner receives no DNS or direct public egress allowance.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-egress-gateway
      ports:
        - protocol: TCP
          port: {{ $product.egressGateway.port }}
