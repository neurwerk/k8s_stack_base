{{- $name := include "librechat-code-interpreter-worker.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-service-worker
  labels:
    {{- include "librechat-code-interpreter-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-sandbox-runner
  labels:
    {{- include "librechat-code-interpreter-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-runner
automountServiceAccountToken: false
