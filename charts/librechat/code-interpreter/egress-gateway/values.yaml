# IMAGE SOURCE: expected first-party build of the pinned upstream source.
# Upstream publishes no image at this commit; verify this exact-SHA mirror
# before deployment.
frontendLibrechatCodeInterpreter:
  image:
    repository: ghcr.io/neurwerk/librechat-code-interpreter-egress-gateway
    tag: fea707467600f3802d65596a6875c7822f25cfd8
    pullPolicy: IfNotPresent

  hardenedSandboxMode: true
  egressGateway:
    replicas: 2
    port: 3190
    maxToolCallBytes: 1048576
    maxFileBytes: 10000000
    maxPathLength: 256
    maxNestingDepth: 10
    requestTimeoutMs: 30000
    revokeTimeoutMs: 5000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  egressGrant:
    secretName: librechat-code-interpreter-egress-grant
    ledgerRequired: true
    ledgerTtlGraceSeconds: 300
  internalAuthSecretName: librechat-code-interpreter-internal-auth
  valkey:
    host: librechat-code-interpreter-valkey
    port: 6379
    authSecretName: librechat-code-interpreter-valkey-auth
  fileServer:
    host: librechat-code-interpreter-file-server
    port: 3000
  toolCallServer:
    host: librechat-code-interpreter-tool-call-server
    port: 3033
