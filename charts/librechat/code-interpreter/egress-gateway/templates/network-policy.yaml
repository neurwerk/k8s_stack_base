{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "librechat-code-interpreter-egress-gateway.fullname" . }}
  labels:
    {{- include "librechat-code-interpreter-egress-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "librechat-code-interpreter-egress-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-worker
              app.kubernetes.io/component: service-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-worker
              app.kubernetes.io/component: sandbox-runner
      ports:
        - protocol: TCP
          port: {{ $product.egressGateway.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-valkey
      ports:
        - protocol: TCP
          port: {{ $product.valkey.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-file-server
      ports:
        - protocol: TCP
          port: {{ $product.fileServer.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-tool-call-server
      ports:
        - protocol: TCP
          port: {{ $product.toolCallServer.port }}
