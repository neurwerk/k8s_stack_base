{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "librechat-code-interpreter-api.fullname" . }}
  annotations:
    secret.reloader.stakater.com/reload: {{ printf "%s,%s,%s" $product.internalAuthSecretName $product.valkey.authSecretName $product.auth.jwtPublicKeySecretName | quote }}
  labels:
    {{- include "librechat-code-interpreter-api.labels" . | nindent 4 }}
spec:
  replicas: {{ $product.api.replicas }}
  selector:
    matchLabels:
      {{- include "librechat-code-interpreter-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librechat-code-interpreter-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "librechat-code-interpreter-api.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ printf "%s:%s" $product.image.repository $product.image.tag | quote }}
          imagePullPolicy: {{ $product.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $product.api.port }}
              protocol: TCP
          env:
            - name: LOCAL_MODE
              value: "false"
            - name: CODEAPI_AUTH_PROVIDER
              value: {{ $product.auth.provider | quote }}
            - name: CODEAPI_ALLOW_AUTH_PROVIDER_NONE
              value: "false"
            - name: CODEAPI_JWT_ISSUER
              value: {{ $product.auth.issuer | quote }}
            - name: CODEAPI_JWT_AUDIENCE
              value: {{ $product.auth.audience | quote }}
            - name: CODEAPI_JWT_ALLOWED_ALGS
              value: {{ $product.auth.allowedAlgorithms | quote }}
            - name: CODEAPI_JWT_KID
              value: {{ $product.auth.keyId | quote }}
            - name: CODEAPI_JWT_MAX_TTL_SECONDS
              value: {{ $product.auth.maxTokenTtlSeconds | quote }}
            - name: CODEAPI_JWT_CLOCK_SKEW_SECONDS
              value: {{ $product.auth.clockSkewSeconds | quote }}
            - name: CODEAPI_JWT_SINGLE_TENANT_ID
              value: {{ $product.auth.singleTenantId | quote }}
            - name: CODEAPI_TENANT_ISOLATION_STRICT
              value: {{ $product.auth.strictTenantIsolation | quote }}
            - name: CODEAPI_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $product.auth.jwtPublicKeySecretName }}
                  key: public-key
            - name: CODEAPI_HARDENED_SANDBOX_MODE
              value: {{ $product.hardenedSandboxMode | quote }}
            - name: PTC_MODE
              value: {{ $product.ptcMode | quote }}
            - name: REDIS_HOST
              value: {{ $product.valkey.host | quote }}
            - name: REDIS_PORT
              value: {{ $product.valkey.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $product.valkey.authSecretName }}
                  key: password
            - name: FILE_SERVER_URL
              value: {{ printf "http://%s:%v" $product.fileServer.host $product.fileServer.port | quote }}
            - name: TOOL_CALL_SERVER_URL
              value: {{ printf "http://%s:%v" $product.toolCallServer.host $product.toolCallServer.port | quote }}
            - name: EGRESS_GATEWAY_URL
              value: {{ printf "http://%s:%v" $product.egressGateway.host $product.egressGateway.port | quote }}
            - name: CODEAPI_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $product.internalAuthSecretName }}
                  key: token
            - name: EGRESS_GRANT_TTL_SECONDS
              value: {{ $product.egressGrantTtlSeconds | quote }}
            - name: SERVICE_PORT
              value: {{ $product.api.port | quote }}
            - name: CODEAPI_HTTP_JSON_LIMIT
              value: {{ $product.api.httpJsonLimit | quote }}
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # TCP liveness checks only the process. Valkey reachability belongs
          # in readiness and must not cause restart loops during maintenance.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $product.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "librechat-code-interpreter-api.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
