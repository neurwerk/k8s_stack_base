apiVersion: v1
kind: Service
metadata:
  name: {{ include "librechat-code-interpreter-api.fullname" . }}
  labels:
    {{- include "librechat-code-interpreter-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontendLibrechatCodeInterpreter.api.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "librechat-code-interpreter-api.selectorLabels" . | nindent 4 }}
