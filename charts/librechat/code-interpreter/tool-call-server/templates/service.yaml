apiVersion: v1
kind: Service
metadata:
  name: {{ include "librechat-code-interpreter-tool-call-server.fullname" . }}
  labels:
    {{- include "librechat-code-interpreter-tool-call-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontendLibrechatCodeInterpreter.toolCallServer.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "librechat-code-interpreter-tool-call-server.selectorLabels" . | nindent 4 }}
