apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "librechat-code-interpreter-valkey.fullname" . }}
  labels:
    {{- include "librechat-code-interpreter-valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "librechat-code-interpreter-valkey.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-worker
              app.kubernetes.io/component: service-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-file-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-tool-call-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-code-interpreter-egress-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.frontendLibrechatCodeInterpreter.valkey.service.port }}
