{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
{{- $valkey := $product.valkey -}}
{{- if and $product.validation.production (not $valkey.persistence.enabled) -}}
  {{- fail "frontendLibrechatCodeInterpreter.valkey.persistence.enabled must be true because upstream BullMQ and replay state are durable" -}}
{{- end -}}
{{- if and $product.validation.production (not $valkey.persistence.storageClassName) -}}
  {{- fail "frontendLibrechatCodeInterpreter.valkey.persistence.storageClassName is required from client-owned values" -}}
{{- end -}}
{{- if ne $valkey.persistence.lifecycle "Retain" -}}
  {{- fail "frontendLibrechatCodeInterpreter.valkey.persistence.lifecycle must be Retain" -}}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "librechat-code-interpreter-valkey.fullname" . }}
  annotations:
    secret.reloader.stakater.com/reload: {{ $valkey.authSecretName | quote }}
  labels:
    {{- include "librechat-code-interpreter-valkey.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "librechat-code-interpreter-valkey.fullname" . }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "librechat-code-interpreter-valkey.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librechat-code-interpreter-valkey.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "librechat-code-interpreter-valkey.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ printf "%s:%s" $valkey.image.repository $valkey.image.tag | quote }}
          imagePullPolicy: {{ $valkey.image.pullPolicy }}
          command:
            - valkey-server
          args:
            - /etc/valkey-auth/valkey.conf
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - ""
            - --dir
            - /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ $valkey.authSecretName }}
                  key: password
          ports:
            - name: valkey
              containerPort: {{ $valkey.service.port }}
              protocol: TCP
          livenessProbe:
            exec:
              command: ["valkey-cli", "-e", "-h", "127.0.0.1", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["valkey-cli", "-e", "-h", "127.0.0.1", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /etc/valkey-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: {{ $valkey.authSecretName }}
            items:
              - key: valkey.conf
                path: valkey.conf
        - name: tmp
          emptyDir: {}
      {{- if not $valkey.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if $valkey.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "librechat-code-interpreter-valkey.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with $valkey.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $valkey.persistence.size }}
  {{- end }}
