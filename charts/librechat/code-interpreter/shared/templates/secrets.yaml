{{- $product := .Values.frontendLibrechatCodeInterpreter -}}
{{- $secrets := .Values.frontendLibrechatCodeInterpreterSecrets -}}
{{- if $product.validation.production -}}
  {{- $_ := required "frontendLibrechatCodeInterpreterSecrets.internalServiceToken is required" $secrets.internalServiceToken -}}
  {{- $_ := required "frontendLibrechatCodeInterpreterSecrets.valkeyPassword is required" $secrets.valkeyPassword -}}
  {{- $_ := required "frontendLibrechatCodeInterpreterSecrets.egressGrantSecret is required" $secrets.egressGrantSecret -}}
  {{- $_ := required "frontendLibrechatCodeInterpreterSecrets.executionManifestPrivateKey is required" $secrets.executionManifestPrivateKey -}}
  {{- $_ := required "frontendLibrechatCodeInterpreterSecrets.executionManifestPublicKey is required" $secrets.executionManifestPublicKey -}}
  {{- $_ := required "frontendLibrechatCodeInterpreterSecrets.jwtPublicKey is required" $secrets.jwtPublicKey -}}
  {{- $_ := required "frontendLibrechatCodeInterpreter.objectStorage.storageClassName is required in production" $product.objectStorage.storageClassName -}}
  {{- if lt (len $secrets.internalServiceToken) 32 -}}
    {{- fail "frontendLibrechatCodeInterpreterSecrets.internalServiceToken must contain at least 32 characters" -}}
  {{- end -}}
  {{- if lt (len $secrets.egressGrantSecret) 32 -}}
    {{- fail "frontendLibrechatCodeInterpreterSecrets.egressGrantSecret must contain at least 32 characters" -}}
  {{- end -}}
  {{- if lt (len $secrets.valkeyPassword) 16 -}}
    {{- fail "frontendLibrechatCodeInterpreterSecrets.valkeyPassword must contain at least 16 characters" -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $product.secretNames.internalAuth }}
  labels:
    {{- include "librechat-code-interpreter-shared.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $secrets.internalServiceToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $product.secretNames.valkeyAuth }}
  labels:
    {{- include "librechat-code-interpreter-shared.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $secrets.valkeyPassword | quote }}
  valkey.conf: |
    requirepass {{ $secrets.valkeyPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $product.secretNames.egressGrant }}
  labels:
    {{- include "librechat-code-interpreter-shared.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ $secrets.egressGrantSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $product.secretNames.executionSigner }}
  labels:
    {{- include "librechat-code-interpreter-shared.labels" . | nindent 4 }}
type: Opaque
stringData:
  private-key: {{ $secrets.executionManifestPrivateKey | quote }}
---
# The sandbox receives only this public verifier, never the signing key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $product.secretNames.executionVerifier }}
  labels:
    {{- include "librechat-code-interpreter-shared.labels" . | nindent 4 }}
type: Opaque
stringData:
  public-key: {{ $secrets.executionManifestPublicKey | quote }}
---
# LibreChat keeps the corresponding JWT signing key outside this package.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $product.secretNames.jwtVerifier }}
  labels:
    {{- include "librechat-code-interpreter-shared.labels" . | nindent 4 }}
type: Opaque
stringData:
  public-key: {{ $secrets.jwtPublicKey | quote }}
