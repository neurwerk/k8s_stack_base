apiVersion: v1
kind: Service
metadata:
  name: frontend-librechat-rag-api-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-rag-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "frontend-librechat-rag-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontendLibrechat.ragApi.service.port }}
      targetPort: http
      protocol: TCP
