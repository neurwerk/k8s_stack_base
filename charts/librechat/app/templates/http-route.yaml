{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.frontendLibrechat.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-librechat-httproute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: frontend-librechat-gateway
      namespace: {{ .Release.Namespace }}
      sectionName: websecure
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-librechat
          port: {{ .Values.frontendLibrechat.app.service.port }}
{{- end }}
