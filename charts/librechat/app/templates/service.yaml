apiVersion: v1
kind: Service
metadata:
  name: frontend-librechat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "frontend-librechat.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontendLibrechat.app.service.port }}
      targetPort: http
      protocol: TCP
