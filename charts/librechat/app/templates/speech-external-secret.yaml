{{- $speech := include "librechat.speechEndpoints" . | fromYaml -}}
{{- range $direction, $endpoint := $speech }}
{{- if $endpoint.settings.auth.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-librechat-{{ $direction }}-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "frontend-librechat.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-librechat-openbao-secret-store
    kind: SecretStore
  target:
    name: frontend-librechat-{{ $direction }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: {{ $direction }}ApiKey
      remoteRef:
        key: frontend-librechat/external
        property: {{ $direction }}ApiKey
{{- end }}
{{- end }}
