{{- $canonicalEndpointRoutingMode := .Values.canonicalEndpointRouting.mode -}}
{{- if not (has $canonicalEndpointRoutingMode (list "internal-traefik" "public-dns")) -}}
{{- fail "canonicalEndpointRouting.mode must be internal-traefik or public-dns" -}}
{{- end -}}
{{- $modelCatalog := include "frontend-librechat-shared.modelCatalog" . | fromYaml -}}
{{- $speech := include "librechat.speechEndpoints" . | fromYaml -}}
{{- $memory := .Values.frontendLibrechat.memory -}}
{{- if not (kindIs "bool" $memory.enabled) }}{{ fail "frontendLibrechat.memory.enabled must be boolean" }}{{ end -}}
{{- if $memory.enabled -}}
{{- if not (kindIs "bool" $memory.agent.enabled) }}{{ fail "frontendLibrechat.memory.agent.enabled must be boolean" }}{{ end -}}
{{- range $name := list "tokenLimit" "maxInputTokens" "messageWindowSize" -}}
{{- if not (regexMatch `^[1-9][0-9]*$` (toJson (index $memory $name))) }}{{ fail (printf "frontendLibrechat.memory.%s must be a positive integer" $name) }}{{ end -}}
{{- end -}}
{{- if $memory.agent.enabled -}}
{{- if not (has $memory.agent.model $modelCatalog.names) }}{{ fail "frontendLibrechat.memory.agent.model must be in the effective model catalog" }}{{ end -}}
{{- if not (kindIs "string" $memory.agent.instructions) }}{{ fail "frontendLibrechat.memory.agent.instructions must be a string" }}{{ end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-librechat-config-map
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-shared.labels" . | nindent 4 }}
data:
  librechat.yaml: |
    version: 1.3.17
    cache: true
    memory:
      disabled: {{ not $memory.enabled }}
      {{- if $memory.enabled }}
      personalize: true
      tokenLimit: {{ $memory.tokenLimit }}
      maxInputTokens: {{ $memory.maxInputTokens }}
      messageWindowSize: {{ $memory.messageWindowSize }}
      {{- if $memory.agent.enabled }}
      agent:
        enabled: true
        provider: AgentGateway
        model: {{ $memory.agent.model | quote }}
        instructions: {{ $memory.agent.instructions | quote }}
      {{- end }}
      {{- end }}
    {{- if not (kindIs "bool" .Values.frontendLibrechat.documentAttachments.enabled) }}{{ fail "frontendLibrechat.documentAttachments.enabled must be boolean" }}{{ end }}
    {{- $imagesEnabled := .Values.frontendLibrechat.documentAttachments.imagesEnabled }}
    {{- $attachmentPolicyVersion := toJson .Values.guardrails.llmPolicyEngine.attachmentPolicyVersion }}
    {{- if not (kindIs "bool" $imagesEnabled) }}{{ fail "frontendLibrechat.documentAttachments.imagesEnabled must be boolean" }}{{ end }}
    {{- if $imagesEnabled }}
    {{- if not (and .Values.frontendLibrechat.documentAttachments.enabled (has $attachmentPolicyVersion (list "3" "4"))) }}{{ fail "LibreChat image uploads require documentAttachments.enabled and attachmentPolicyVersion: 3 or 4 with compatible deployed services" }}{{ end }}
    # The pinned browser converts HEIC to JPEG before upload. Store and deliver
    # PNG, never WebP, for the gateway's bounded image-processing path.
    imageOutputType: png
    {{- end }}
    {{- if .Values.frontendLibrechat.documentAttachments.enabled }}
    {{- range $name := list "fileBytes" "totalBytes" "count" "pages" }}
    {{- $value := index $.Values.documentAttachments $name }}
    {{- if not (regexMatch `^[1-9][0-9]*$` (toJson $value)) }}{{ fail (printf "documentAttachments.%s must be a positive integer" $name) }}{{ end }}
    {{- end }}
    {{- if lt (int64 .Values.documentAttachments.totalBytes) (int64 .Values.documentAttachments.fileBytes) }}{{ fail "documentAttachments.totalBytes must cover fileBytes" }}{{ end }}
    fileConfig:
      endpoints:
        AgentGateway:
          fileLimit: {{ .Values.documentAttachments.count }}
          fileSizeLimit: {{ divf .Values.documentAttachments.fileBytes 1048576 }}
          totalSizeLimit: {{ divf .Values.documentAttachments.totalBytes 1048576 }}
          supportedMimeTypes:
            - '^application/pdf$'
            - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
            - '^application/vnd\.openxmlformats-officedocument\.spreadsheetml\.sheet$'
            - '^application/vnd\.openxmlformats-officedocument\.presentationml\.presentation$'
            - '^text/plain$'
            - '^text/markdown$'
            - '^text/csv$'
            {{- if $imagesEnabled }}
            - '^image/jpeg$'
            - '^image/png$'
            - '^image/heic$'
            {{- if eq $attachmentPolicyVersion "4" }}
            - '^image/webp$'
            {{- end }}
            {{- end }}
          defaultLLMDeliveryPath:
            fallback: provider
    {{- end }}
    {{- if $speech }}
    speech:
      {{- range $direction, $endpoint := $speech }}
      {{ $direction }}:
        {{- if $endpoint.local }}
        allowedAddresses:
          - {{ printf "%s:%d" $endpoint.host (int $endpoint.port) | quote }}
        {{- end }}
        openai:
          url: {{ $endpoint.settings.url | quote }}
          model: {{ $endpoint.settings.model | quote }}
          {{- if $endpoint.settings.auth.enabled }}
          apiKey: {{ printf "${LIBRECHAT_%s_API_KEY}" (upper $direction) | quote }}
          {{- else }}
          apiKey: ""
          {{- end }}
          {{- if eq $direction "tts" }}
          voices: {{ $endpoint.settings.voices | toJson }}
          {{- end }}
      {{- end }}
      speechTab:
        {{- if hasKey $speech "stt" }}
        {{- $stt := .Values.frontendLibrechat.speech.stt }}
        {{- if not (kindIs "bool" $stt.autoTranscribeAudio) }}{{ fail "frontendLibrechat.speech.stt.autoTranscribeAudio must be boolean" }}{{ end }}
        {{- if not (regexMatch `^-[0-9]+(\.[0-9]+)?$` (toJson $stt.decibelValue)) }}{{ fail "frontendLibrechat.speech.stt.decibelValue must be a negative number" }}{{ end }}
        {{- if not (regexMatch `^(-1|0|[1-9][0-9]*)$` (toJson $stt.autoSendText)) }}{{ fail "frontendLibrechat.speech.stt.autoSendText must be -1 or a nonnegative integer in seconds" }}{{ end }}
        speechToText:
          engineSTT: external
          autoTranscribeAudio: {{ $stt.autoTranscribeAudio }}
          decibelValue: {{ $stt.decibelValue }}
          autoSendText: {{ $stt.autoSendText }}
        {{- end }}
        {{- if hasKey $speech "tts" }}
        textToSpeech:
          engineTTS: external
        {{- end }}
      {{- end }}
    {{- if .Values.frontendLibrechat.objectStorage.enabled }}
    # Keep the legacy selector aligned because LibreChat's file-list endpoint
    # still uses it to refresh expiring S3 URLs.
    fileStrategy: s3
    fileStrategies:
      default: s3
      avatar: s3
      image: s3
      document: s3
    {{- end }}
    interface:
      # The app permission hook owns AGENTS and MARKETPLACE per role. Global
      # interface.agents/marketplace overrides would overwrite both roles.
      presets: false
      parameters: false
      # Grouped model specs own selection; hide the duplicate raw endpoint row.
      modelSelect: false
      fileSearch: {{ .Values.frontendLibrechat.rag.enabled }}
      {{- if $memory.enabled }}
      # Apply upstream memory permissions, including editing and the user off switch.
      memories: true
      {{- end }}
    modelSpecs:
      # Specs provide grouped rows while enforce:false preserves Agents models.
      enforce: false
      list:
        {{- $modelCatalog.specs | toYaml | nindent 8 }}
    endpoints:
      allowedAddresses:
        - {{ .Values.frontendLibrechat.agentGateway.hostPort | quote }}
      agents:
        {{- if or .Values.mcp.enabled .Values.frontendLibrechat.codeInterpreter.enabled .Values.frontendLibrechat.rag.enabled }}
        capabilities:
          {{- if .Values.mcp.enabled }}
          - tools
          {{- end }}
          {{- if .Values.frontendLibrechat.codeInterpreter.enabled }}
          - execute_code
          {{- end }}
          {{- if .Values.frontendLibrechat.rag.enabled }}
          - file_search
          {{- end }}
        {{- else }}
        capabilities: []
        {{- end }}
      custom:
        - name: AgentGateway
          apiKey: unused
          baseURL: {{ .Values.frontendLibrechat.agentGateway.baseUrl | quote }}
          models:
            # Keep request validation aligned with the grouped model specs.
            default: {{ $modelCatalog.names | toJson }}
            fetch: false
          titleConvo: true
          titleModel: current_model
          titleTiming: final
          summarize: false
          forcePrompt: false
          customParams:
            reasoningKey: reasoning_content
            includeReasoningContent: true
            includeReasoningHistory: true
          addParams:
            disableStreaming: {{ not .Values.frontendLibrechat.agentGateway.streaming }}
          headers:
            Authorization: {{ printf "Bearer {{LIBRECHAT_OPENID_ACCESS_TOKEN}}" | quote }}
            X-User-ID: {{ printf "{{LIBRECHAT_OPENID_USER_ID}}" | quote }}
            X-User-Email: {{ printf "{{LIBRECHAT_OPENID_USER_EMAIL}}" | quote }}
            X-Session-ID: {{ printf "{{LIBRECHAT_BODY_CONVERSATIONID}}" | quote }}
    {{- if .Values.mcp.enabled }}
    mcpSettings:
      allowedAddresses:
        - {{ .Values.frontendLibrechat.agentGateway.hostPort | quote }}
        {{- if eq $canonicalEndpointRoutingMode "internal-traefik" }}
        - {{ printf "%s:443" .Values.authKeycloak.hostname | quote }}
        {{- end }}
    mcpServers:
      {{- range .Values.mcp.servers }}
      {{ .name }}:
        type: streamable-http
        url: {{ printf "%s/mcp/%s" (trimSuffix "/v1" $.Values.frontendLibrechat.agentGateway.baseUrl) .name | quote }}
        requiresOAuth: true
        oauth:
          client_id: "${OPENID_CLIENT_ID}"
          client_secret: "${OPENID_CLIENT_SECRET}"
          authorization_url: {{ printf "https://%s/realms/%s/protocol/openid-connect/auth" $.Values.authKeycloak.hostname $.Values.authKeycloak.realm | quote }}
          token_url: {{ printf "https://%s/realms/%s/protocol/openid-connect/token" $.Values.authKeycloak.hostname $.Values.authKeycloak.realm | quote }}
          redirect_uri: {{ printf "https://%s/api/mcp/%s/oauth/callback" $.Values.frontendLibrechat.hostname .name | quote }}
          scope: openid
      {{- end }}
    {{- end }}
