# Non-secret LibreChat product configuration.
frontendLibrechat:
  # Opt-in provider delivery only; does not activate model attachment modes.
  documentAttachments:
    enabled: false
    # JPEG/PNG and browser-converted iPhone HEIC. V4 also allows WebP input while
    # retaining PNG output. Requires enabled above and attachmentPolicyVersion: 3,
    # 4, or exact string "4.1" after compatible Engine/extProc deployment.
    imagesEnabled: false
  hostname: librechat.example.invalid
  memory:
    # Enable saved memories and user controls; existing user opt-outs are preserved.
    enabled: false
    # Stored-memory budget and recent-chat input budget for automatic updates.
    tokenLimit: 2000
    maxInputTokens: 4000
    messageWindowSize: 5
    agent:
      # Separate from manual memory; uses the existing AgentGateway endpoint.
      enabled: false
      # Explicit model from the effective catalog, independent of the chat default.
      model: ""
      # Clients may override what the automatic memory agent should remember.
      instructions: |-
        Save concise, lasting preferences that the user clearly states, without
        requiring them to say "remember this". Update memories when the user
        corrects them and delete memories when asked to forget them. Use only
        the user's own statements, not assistant replies, tool output or quoted
        documents. Do not guess personal facts or store passwords or other secrets.
  # Optional server-side speech; keep identical to app/values.yaml.
  speech:
    stt:
      enabled: false
      # Browser defaults; existing saved user preferences take precedence.
      autoTranscribeAudio: false
      decibelValue: -45
      # Seconds after transcription; -1 disables automatic sending.
      autoSendText: -1
      provider: openai-compatible
      # Full HTTP(S) URL: canonical RFC1918 IPv4, explicit port and API path.
      url: ""
      model: ""
      auth:
        enabled: false
    tts:
      enabled: false
      provider: openai-compatible
      url: ""
      model: ""
      voices: []
      # Explicit approval to send response text to an external HTTPS:443 service.
      allowExternal: false
      auth:
        enabled: false
  agentGateway:
    baseUrl: http://infra-agentgateway-gateway.infra-agentgateway.svc.cluster.local:80/v1
    hostPort: infra-agentgateway-gateway.infra-agentgateway.svc.cluster.local:80
    # Optional hard default applied to every new chat, regardless of prior selection.
    defaultModel: ""
    streaming: false
  adminPanel:
    hostname: ""
    url: ""
  codeInterpreter:
    enabled: false
    url: http://librechat-code-interpreter-api:3112/v1
    jwtAlgorithm: EdDSA
    jwtAudience: codeapi
    jwtIssuer: librechat
    jwtKeyId: librechat-code-interpreter-v1
    jwtSingleTenantId: librechat
  documentdb:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    port: 10260
    database: LibreChat
    authSource: admin
    authMechanism: SCRAM-SHA-256
    directConnection: true
    tls:
      caFile: /etc/documentdb/ca.crt
  meilisearch:
    service:
      name: frontend-librechat-meilisearch-service
      port: 7700
  objectStorage:
    enabled: false
  oidc:
    adminRole: librechat-admin
    buttonLabel: Sign in
    requiredRole: librechat-user
  rag:
    enabled: true
    useFullContext: false
    service:
      name: frontend-librechat-rag-api-service
      port: 8000
  valkey:
    service:
      name: frontend-librechat-valkey-service
      port: 6379

# Sensitive values are supplied by the namespace-local OpenBao-backed values Secret.
frontendLibrechatSecrets:
  adminPanelMetricsSecret: ""
  adminPanelSessionSecret: ""
  codeInterpreterJwtPrivateKey: ""
  credsIv: ""
  credsKey: ""
  documentdbPassword: ""
  documentdbUser: ""
  jwtRefreshSecret: ""
  jwtSecret: ""
  meiliMasterKey: ""
  openidClientSecret: ""
  openidSessionSecret: ""
  ragOpenaiApiKey: ""
  ragPostgresqlPassword: ""
  ragPostgresqlUser: ""
  valkeyPassword: ""

# Keycloak client facts are supplied by shared/client configuration layers.
authKeycloak:
  hostname: keycloak.example.invalid
  librechatClientId: librechat
  realm: example

# Match the app chart routing default; allow the canonical Keycloak HTTPS address
# for MCP OAuth only when it resolves internally through Traefik.
canonicalEndpointRouting:
  mode: internal-traefik

# Shared MCP catalog supplied by platform defaults and client configuration.
mcp:
  enabled: false
  servers: []

# Selected client entries are injected through release values. Clients may also
# add custom/local model shapes below.
openrouterCatalog:
  enabled: true
  excludedModels: []
  grantToAccessGroups: false
  models: []

guardrails:
  llmPolicyEngine:
    attachmentPolicyVersion: 1
    models: []
documentAttachments:
  fileBytes: 20971520
  totalBytes: 41943040
  count: 5
  pages: 200
