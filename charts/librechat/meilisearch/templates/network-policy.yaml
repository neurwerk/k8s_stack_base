apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-librechat-meilisearch-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-meilisearch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frontend-librechat-meilisearch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-librechat
      ports:
        - port: {{ .Values.frontendLibrechat.meilisearch.service.port }}
          protocol: TCP
