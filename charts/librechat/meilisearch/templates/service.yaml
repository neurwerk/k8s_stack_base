apiVersion: v1
kind: Service
metadata:
  name: frontend-librechat-meilisearch-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-librechat-meilisearch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "frontend-librechat-meilisearch.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontendLibrechat.meilisearch.service.port }}
      targetPort: http
      protocol: TCP
