{{- if .Values.externalGateway.enabled }}
{{- $hostname := .Values.frontendLibrechat.adminPanel.hostname | default "" | trim }}
{{- if eq (include "librechat-admin-panel.validHostname" $hostname) "true" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "librechat-admin-panel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "librechat-admin-panel.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "librechat-admin-panel.fullname" . }}
      namespace: {{ .Release.Namespace }}
      sectionName: websecure
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "librechat-admin-panel.fullname" . }}
          port: {{ .Values.frontendLibrechat.adminPanel.ports.service }}
{{- end }}
{{- end }}
