{{- if .Values.externalGateway.enabled }}
{{- $hostname := .Values.frontendLibrechat.adminPanel.hostname | default "" | trim }}
{{- if eq (include "librechat-admin-panel.validHostname" $hostname) "true" }}
{{- $issuer := ternary "letsencrypt-production-cluster-issuer" "letsencrypt-staging-cluster-issuer" .Values.publicCertificates.useProduction }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "librechat-admin-panel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "librechat-admin-panel.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer | quote }}
    cert-manager.io/duration: "2160h"
spec:
  gatewayClassName: {{ .Values.externalGateway.gatewayClassName }}
  listeners:
    - name: websecure
      port: {{ .Values.externalGateway.port }}
      protocol: HTTPS
      hostname: {{ $hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ include "librechat-admin-panel.tlsSecretName" . }}
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
{{- end }}
