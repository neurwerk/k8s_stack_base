apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "librechat-admin-panel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "librechat-admin-panel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "librechat-admin-panel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: {{ .Values.frontendLibrechat.adminPanel.ports.container }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-kube-prometheus-stack
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: {{ .Values.frontendLibrechat.adminPanel.ports.container }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-librechat
      ports:
        - port: 3080
          protocol: TCP
    # OAuth discovery and token exchange are proxied by the internal LibreChat
    # API. The admin-panel Pod therefore needs no Keycloak or public HTTPS rule.
