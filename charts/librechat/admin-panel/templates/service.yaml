apiVersion: v1
kind: Service
metadata:
  name: {{ include "librechat-admin-panel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "librechat-admin-panel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "librechat-admin-panel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontendLibrechat.adminPanel.ports.service }}
      targetPort: http
      protocol: TCP
