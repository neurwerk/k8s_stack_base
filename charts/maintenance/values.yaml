  image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  products:
    studio:
      enabled: false
    langfuse:
      enabled: false
  # Client-approved addon scopes: {example-addon: {enabled: true, hosts: [...]}}.
  addons: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
