# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.7.0@sha256:f744427df82f4a5b0a94f2f9fbf6c59ab98e1ec4f99963b6d836ea9d765e88bb
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  # LibreChat covers both its canonical application and Admin Panel hostnames.
  products:
    studio:
      enabled: false
    dify:
      enabled: false
    librechat:
      enabled: false
    langfuse:
      enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Project these canonical client facts and the logo ConfigMap into maintenance.
authKeycloak:
  realmDisplayName: ""
  branding:
    logoConfigMapName: ""
    logoFormat: png
frontendStudio:
  studio:
    hostname: ""
frontendDify:
  hostname: ""
frontendLibrechat:
  hostname: ""
  adminPanel:
    hostname: ""
monitorLangfuseWrapper:
  hostname: ""
