# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.15.6@sha256:2cfe62109c8067e08a81f422733e6673ef3eb0ee11066f72e7316878a76013db
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  products:
    studio:
      enabled: false
    langfuse:
      enabled: false
  # Client-approved addon scopes: {example-addon: {enabled: true, hosts: [...]}}.
  addons: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Project these canonical client facts and the logo ConfigMap into maintenance.
authKeycloak:
  realmDisplayName: ""
  branding:
    logoConfigMapName: ""
    logoFormat: png
frontendStudio:
  studio:
    hostname: ""
monitorLangfuseWrapper:
  hostname: ""
