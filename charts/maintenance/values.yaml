# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.12.0@sha256:b70f0f93ca2c3e5cef9290af2db6480bec72cedc0289ecd232747996eb01091a
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  products:
    studio:
      enabled: false
    langfuse:
      enabled: false
  # Client-approved addon scopes: {example-addon: {enabled: true, hosts: [...]}}.
  addons: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Project these canonical client facts and the logo ConfigMap into maintenance.
authKeycloak:
  realmDisplayName: ""
  branding:
    logoConfigMapName: ""
    logoFormat: png
frontendStudio:
  studio:
    hostname: ""
monitorLangfuseWrapper:
  hostname: ""
