# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.11.2@sha256:754eada6dba835ec2c5466cc11f62ff3e2920a133798ce28809cf7407a66689f
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  products:
    studio:
      enabled: false
    langfuse:
      enabled: false
  # Client-approved addon scopes: {example-addon: {enabled: true, hosts: [...]}}.
  addons: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Project these canonical client facts and the logo ConfigMap into maintenance.
authKeycloak:
  realmDisplayName: ""
  branding:
    logoConfigMapName: ""
    logoFormat: png
frontendStudio:
  studio:
    hostname: ""
monitorLangfuseWrapper:
  hostname: ""
