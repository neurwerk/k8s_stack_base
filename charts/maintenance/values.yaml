# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.7.3@sha256:efa09b2f29d02fbd07fe12774fd7d3db6bf4e02ef403c7be2c18196fbc956d99
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  # LibreChat covers both its canonical application and Admin Panel hostnames.
  products:
    studio:
      enabled: false
    librechat:
      enabled: false
    langfuse:
      enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Project these canonical client facts and the logo ConfigMap into maintenance.
authKeycloak:
  realmDisplayName: ""
  branding:
    logoConfigMapName: ""
    logoFormat: png
frontendStudio:
  studio:
    hostname: ""
frontendLibrechat:
  hostname: ""
  adminPanel:
    hostname: ""
monitorLangfuseWrapper:
  hostname: ""
