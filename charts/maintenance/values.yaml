# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.7.2@sha256:bfc4d5e1d3e7009c23be9759ee91ef91e5befc8b42af7f743d13449b2b4973b6
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  # LibreChat covers both its canonical application and Admin Panel hostnames.
  products:
    studio:
      enabled: false
    dify:
      enabled: false
    librechat:
      enabled: false
    langfuse:
      enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# Project these canonical client facts and the logo ConfigMap into maintenance.
authKeycloak:
  realmDisplayName: ""
  branding:
    logoConfigMapName: ""
    logoFormat: png
frontendStudio:
  studio:
    hostname: ""
frontendDify:
  hostname: ""
frontendLibrechat:
  hostname: ""
  adminPanel:
    hostname: ""
monitorLangfuseWrapper:
  hostname: ""
