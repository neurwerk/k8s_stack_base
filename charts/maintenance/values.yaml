# Published server image; adoption and runtime acceptance remain separate gates.
maintenance:
  enabled: false
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.15.7@sha256:726e75d02c23e7777d6483ffd08d1e7689a5cc17afb8fb4cdc5306ae84242073
  # Approval scopes, not activation state. Only the operator creates runtime copies.
  products:
    studio:
      enabled: false
    langfuse:
      enabled: false
  # Client-approved addon scopes: {example-addon: {enabled: true, hosts: [...]}}.
  addons: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
