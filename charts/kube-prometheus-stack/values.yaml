# IMAGE SOURCE: upstream
# Monitoring images are controlled by the vendor subchart.
# Pinned here (chart defaults).
# =============================================================================
# charts/kube-prometheus-stack/values.yaml — default values
#
# These defaults are overridden by:
#   - ConfigMap: base-shared-resources-config-map
#   - ConfigMap: monitor-kube-prometheus-stack-app-defaults
#
# No Gateway/HTTPRoute — internal-only monitoring.
# =============================================================================

monitorKubePrometheusStack:
  alerting:
    applications:
      enabled: true
      additionalNamespaces: []
      # Only workloads in the chat/API path and its required dependencies.
      namespaces:
        - infra-agentgateway
        - monitor-agentgateway-extproc
        - monitor-pii-engine
        - docling
        - auth-keycloak-api-key-bridge
        - auth-keycloak
        - infra-postgres-auth
        - infra-postgres-operations
        - infra-rook-ceph
        - kube-system
      unavailableFor: 30s
    email:
      # The platform release enables email by default. Chart-only rendering stays
      # inert until a client supplies its non-secret SMTP and recipient facts.
      enabled: false
      host: ""
      port: 465
      from: ""
      to: ""
      authUsername: ""
      authPassword: ""
      # Log-derived errors have a dedicated route so notification policy changes
      # do not delay critical application availability alerts.
      applicationErrors:
        # After verifying GlitchTip delivery and email, list IDs from the same
        # glitchtip.adapter.scopes supplied to both charts. Only those exact
        # namespace/application/container/failure-type combinations are muted.
        verifiedGlitchtipScopeIds: []
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 1h
        sendResolved: true
        # When enabled, Alertmanager delivers these notifications only during
        # the configured local-time window.
        activeTime:
          enabled: false
          weekdays:
            - monday:friday
          startTime: "08:00"
          endTime: "18:00"
          location: UTC

# ── Subchart dependency: kube-prometheus-stack ────────────────────────────────
# Values under this key are passed directly to the subchart.
kube-prometheus-stack:
  namespaceOverride: monitor-kube-prometheus-stack
  fullnameOverride: monitor-kube-prometheus-stack

  # CRDs are applied manually (consistent with cert-manager pattern)
  crds:
    enabled: false

  # Disable chart's default namespace creation — we manage it via kustomize
  namespace:
    create: false

  # Clean up operator object names to avoid double-prefixing
  cleanPrometheusOperatorObjectNames: true

  prometheusOperator:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-operator
      tag: v0.94.2
      sha: c7edf0379b7271ef1705dce258d2bb73820e299cc95559369e9f6fc3321639ec
    prometheusConfigReloader:
      image:
        registry: quay.io
        repository: prometheus-operator/prometheus-config-reloader
        tag: v0.94.2
        sha: a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
    admissionWebhooks:
      patch:
        image:
          registry: ghcr.io
          repository: jkroepke/kube-webhook-certgen
          tag: "1.11.1"
          sha: 8009b04f9873f7279b5adee37fdd03b6a9aa7b6751d4f69fde2683010e41cd1f

  # Default rules (alerts + recording rules)
  defaultRules:
    create: true

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    enabled: true
    prometheusSpec:
      image:
        registry: quay.io
        repository: prometheus/prometheus
        tag: v3.16.0-distroless
        sha: 9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
      # PodMonitor/ServiceMonitor discovery — match our release label
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      # Retention, storage, and resources are set in releases/shared/resources.yaml

  # ── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    enabled: true
    alertmanagerSpec:
      image:
        registry: quay.io
        repository: prometheus/alertmanager
        tag: v0.34.2
        sha: 39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
      useExistingSecret: true
      configSecret: monitor-kube-prometheus-stack-alertmanager-config
      # Do not merge arbitrary AlertmanagerConfig resources into the platform
      # configuration. No owned resource currently carries this opt-in label.
      alertmanagerConfigSelector:
        matchLabels:
          alerts.neurwerk.com/managed-by: monitor-kube-prometheus-stack
      alertmanagerConfigNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitor-kube-prometheus-stack
    # Storage and resources are set in releases/shared/resources.yaml

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    enabled: false
    image:
      registry: docker.io
      repository: grafana/grafana
      tag: 13.3.0-distroless
      sha: 540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df
    # The wrapper supplies ConfigMap-only Roles in each trusted dashboard
    # namespace instead of the subchart's cluster-wide ConfigMap/Secret role.
    rbac:
      create: false
    admin:
      existingSecret: monitor-kube-prometheus-stack-secret
      userKey: admin-user
      passwordKey: admin-password
    # Automatically import GitOps-managed dashboards from the two trusted
    # namespaces. The sidecars process ConfigMaps only.
    sidecar:
      image:
        registry: quay.io
        repository: kiwigrid/k8s-sidecar
        tag: "2.14.3"
        sha: 52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: monitor-kube-prometheus-stack,infra-agentgateway
        resource: configmap
      datasources:
        resource: configmap
    # No Ingress — use Gateway/HTTPRoute if exposure is needed in the future
    ingress:
      enabled: false
    # Prometheus datasource is auto-provisioned by the chart (default: true)

  # ── kube-state-metrics (dependency subchart) ───────────────────────────────
  kube-state-metrics:
    enabled: true
    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.20.0
      sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

  # ── prometheus-node-exporter (dependency subchart) ─────────────────────────
  prometheus-node-exporter:
    enabled: true
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.12.1-distroless
      distroless: false # The exact tag already selects the distroless image.
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
