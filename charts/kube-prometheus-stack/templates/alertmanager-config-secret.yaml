{{- $email := .Values.monitorKubePrometheusStack.alerting.email -}}
{{- $applicationErrors := $email.applicationErrors -}}
{{- $activeTime := $applicationErrors.activeTime -}}
{{- if $email.enabled -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.host is required when email alerting is enabled" $email.host -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.from is required when email alerting is enabled" $email.from -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.to is required when email alerting is enabled" $email.to -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.authUsername is required when email alerting is enabled" $email.authUsername -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.authPassword is required when email alerting is enabled" $email.authPassword -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.groupWait is required when email alerting is enabled" $applicationErrors.groupWait -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.groupInterval is required when email alerting is enabled" $applicationErrors.groupInterval -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.repeatInterval is required when email alerting is enabled" $applicationErrors.repeatInterval -}}
{{- if $activeTime.enabled -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.activeTime.weekdays must not be empty when active time is enabled" $activeTime.weekdays -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.activeTime.startTime is required when active time is enabled" $activeTime.startTime -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.activeTime.endTime is required when active time is enabled" $activeTime.endTime -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.applicationErrors.activeTime.location is required when active time is enabled" $activeTime.location -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: monitor-kube-prometheus-stack-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-kube-prometheus-stack
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    {{- if $email.enabled }}
      smtp_smarthost: {{ printf "%s:%v" $email.host $email.port | quote }}
      smtp_from: {{ $email.from | quote }}
      smtp_auth_username: {{ $email.authUsername | quote }}
      smtp_auth_password: {{ $email.authPassword | quote }}
      # Alertmanager 0.28 opens implicit TLS directly on port 465. Requiring
      # STARTTLS as well would fail after that TLS session is established.
      smtp_require_tls: {{ ne (toString $email.port) "465" }}
    {{- end }}
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    route:
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = Watchdog
      {{- if $email.enabled }}
        - receiver: application-error-email
          matchers:
            - alertname = ApplicationErrorObserved
          group_by:
            - namespace
            - application
          group_wait: {{ $applicationErrors.groupWait }}
          group_interval: {{ $applicationErrors.groupInterval }}
          repeat_interval: {{ $applicationErrors.repeatInterval }}
          {{- if $activeTime.enabled }}
          active_time_intervals:
            - application-error-email-active
          {{- end }}
        - receiver: application-email
          matchers:
            - alert_scope = application
          group_by:
            - namespace
            - application
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - receiver: critical-email
          matchers:
            - severity = critical
      {{- end }}
    receivers:
      - name: "null"
    {{- if $email.enabled }}
      - name: application-error-email
        email_configs:
          - to: {{ $email.to | quote }}
            send_resolved: {{ $applicationErrors.sendResolved }}
      - name: application-email
        email_configs:
          - to: {{ $email.to | quote }}
            send_resolved: true
      - name: critical-email
        email_configs:
          - to: {{ $email.to | quote }}
            send_resolved: true
    {{- end }}
    {{- if and $email.enabled $activeTime.enabled }}
    time_intervals:
      - name: application-error-email-active
        time_intervals:
          - times:
              - start_time: {{ $activeTime.startTime | quote }}
                end_time: {{ $activeTime.endTime | quote }}
            weekdays: {{ $activeTime.weekdays | toJson }}
            location: {{ $activeTime.location | quote }}
    {{- end }}
    templates:
      - /etc/alertmanager/config/*.tmpl
