{{- $email := .Values.monitorKubePrometheusStack.alerting.email -}}
{{- if $email.enabled -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.host is required when email alerting is enabled" $email.host -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.from is required when email alerting is enabled" $email.from -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.to is required when email alerting is enabled" $email.to -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.authUsername is required when email alerting is enabled" $email.authUsername -}}
{{- $_ := required "monitorKubePrometheusStack.alerting.email.authPassword is required when email alerting is enabled" $email.authPassword -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: monitor-kube-prometheus-stack-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-kube-prometheus-stack
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    {{- if $email.enabled }}
      smtp_smarthost: {{ printf "%s:%v" $email.host $email.port | quote }}
      smtp_from: {{ $email.from | quote }}
      smtp_auth_username: {{ $email.authUsername | quote }}
      smtp_auth_password: {{ $email.authPassword | quote }}
      # Alertmanager 0.28 opens implicit TLS directly on port 465. Requiring
      # STARTTLS as well would fail after that TLS session is established.
      smtp_require_tls: {{ ne (toString $email.port) "465" }}
    {{- end }}
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    route:
      group_by:
        - namespace
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = Watchdog
      {{- if $email.enabled }}
        - receiver: critical-email
          matchers:
            - severity = critical
      {{- end }}
    receivers:
      - name: "null"
    {{- if $email.enabled }}
      - name: critical-email
        email_configs:
          - to: {{ $email.to | quote }}
            send_resolved: true
    {{- end }}
    templates:
      - /etc/alertmanager/config/*.tmpl
