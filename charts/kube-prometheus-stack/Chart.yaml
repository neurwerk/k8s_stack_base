apiVersion: v2
name: monitor-kube-prometheus-stack
description: |
  Wrapper chart — kube-prometheus-stack (monitor-kube-prometheus-stack namespace).

  Deploys:
    - Prometheus Operator
    - Prometheus
    - Alertmanager
    - kube-state-metrics
    - prometheus-node-exporter

  No Gateway/HTTPRoute — internal-only monitoring.
type: application
version: 2.0.0
appVersion: "0.94.2"
dependencies:
  - name: kube-prometheus-stack
    version: "92.21.2"
    repository: oci://ghcr.io/prometheus-community/charts
