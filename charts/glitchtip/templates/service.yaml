{{- if .Values.glitchtip.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: glitchtip
  labels:
    {{- include "glitchtip.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "glitchtip.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "boundary" "application" .Values.glitchtip.gateway.ui.enabled }}
  ports:
    - {name: http, port: 8000, targetPort: {{ ternary "ingest-status" "http" .Values.glitchtip.gateway.ui.enabled }}}
{{- end }}
