{{- $status := .Values.glitchtip.gateway.status }}
{{- if and .Values.glitchtip.enabled $status.enabled }}
{{- if not (regexMatch `^/status-pages/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/$` $status.pagePath) }}
{{- fail "glitchtip.gateway.status.pagePath must select one exact /status-pages/org/slug/ view" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: glitchtip
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.glitchtip.gateway.issuerName | quote }}
    cert-manager.io/duration: "2160h"
spec:
  gatewayClassName: traefik
  listeners:
    - name: status
      port: 443
      protocol: HTTPS
      hostname: {{ $status.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - {name: glitchtip-status-tls, kind: Secret, group: ""}
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glitchtip-status
spec:
  parentRefs: [{name: glitchtip, sectionName: status}]
  hostnames: [{{ $status.hostname | quote }}]
  rules:
    - matches:
        - path: {type: Exact, value: /}
        - path: {type: Exact, value: {{ $status.pagePath | quote }}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: {{ $status.pagePath | quote }}}
      backendRefs: [{name: glitchtip, port: 8000}]
{{- end }}
