glitchtip:
  # Also selects the optional credential catalog through product values.
  enabled: false
  mcpEnabled: false
  image: docker.io/glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
  runtimeSecret: glitchtip-runtime
  domain: https://glitchtip.example.com
  fromEmail: glitchtip@example.com
  retentionDays: 30
  uptimeEnabled: false
  # Keep private-IP monitoring off unless separately reviewed.
  uptimeAllowPrivateIPs: false
  storage:
    size: 5Gi
    storageClassName: ""
  gateway:
    issuerName: letsencrypt-production-cluster-issuer
    status:
      enabled: false
      hostname: status.example.com
      # Public root and this exact view only; no application/admin routes.
      pagePath: ""
    ui:
      enabled: false
      hostname: glitchtip.example.com
      # TCP/TLS passthrough via the existing operator, never a public UI route.
      # Map hostname above to the operator-reported tailnet DNS name/IP privately.
      tailscale:
        # Disable while validating internal TLS; enable only at agreed cutover.
        expose: true
        hostname: ""
        # Dedicated reviewed UI tag(s)/ACL; never inherit the API transport tag.
        tags: []
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
  # SMTP egress must be explicitly selected; no unrestricted Internet egress.
  smtp:
    host: smtp.example.com
    cidrs: []
    port: 465
  # Optional uptime destinations; keep empty when uptime is disabled.
  uptime:
    cidrs: []
    ports: [443]
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  provisioning:
    # First stage with adapter disabled. Save/verify the DSN through stack-setup,
    # then disable provisioning before enabling the adapter (no readiness cycle).
    enabled: false
    image: ghcr.io/neurwerk/k8s-stack-tooling:0.15.6@sha256:2cfe62109c8067e08a81f422733e6673ef3eb0ee11066f72e7316878a76013db
    initialOwnerSecret: glitchtip-owner
    # Native schema: organization/project {slug,name}, team {slug},
    # alert {name,alertRecipients:[{recipientType:email}],timespanMinutes?};
    # optional monitors and statusPage. Credentials never belong in this object.
    # Webhook secrets/recipients are intentionally unsupported by this chart.
    config: {}
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: 500m, memory: 1Gi}
  adapter:
    enabled: false
    image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.1@sha256:8c8d360f2cb9d7bc5d147e66dcbba2a743700eac32678f4f61a4388b3db676df
    credentialsSecret: glitchtip-adapter
    environment: production
    # Required for first activation. Existing state owns subsequent cursors.
    initialStartAt: ""
    pollSeconds: 60
    overlapSeconds: 900
    settleSeconds: 30
    # The adapter validates namespace/container and stable app/service labels.
    # No query/PPL input is accepted by this chart.
    scopes: []
    # Passed unchanged to Tooling; it owns rule validation and ID-based merging.
    # Empty layers retain conservative fallback grouping. Add only reviewed formats.
    # Reloaded each poll after projection; the normal reloader may also restart it.
    reportingPolicy:
      version: 1
      defaults:
        - id: agentgateway-stateless-mcp-get
          source_format: agentgateway-mcp-v1
          priority: 100
          match:
            service: [agentgateway]
            failure_type: [application_error]
            json.gateway: [infra-agentgateway/infra-agentgateway-gateway]
            json.listener: [api-bindings]
            json.http.method: [GET]
            json.http.status: ['405']
            json.http.path: [/mcp/brave, /mcp/context7, /mcp/github, /mcp/glitchtip]
            json.protocol: [mcp]
            json.reason: [MCP]
            json.error: ['mcp: method not allowed; must be GET, POST, or DELETE']
          group_by: [json.http.path, json.route, json.http.host, json.reason, json.error]
          action: log_only
          explanation: Reviewed stateless MCP optional-stream rejection; unfamiliar diagnostics remain reportable.
        - id: agentgateway-mcp-authorization
          source_format: agentgateway-mcp-v1
          match:
            service: [agentgateway]
            failure_type: [application_error]
            json.http.status: ['403']
            json.reason: [Authorization]
            json.error: [authorization failed]
          group_by: [json.jwt.sub, json.http.path, json.http.method, json.route, json.http.host, json.reason, json.error]
          title: 'MCP {json.http.path}: authorization rejected (403)'
          explanation: Repeated authorization failures for the same caller and destination; all semantic diagnostics remain part of the signature.
        - id: librechat-mcp-authentication
          match:
            service: [librechat]
            failure_type: [application_error]
            json.code: [MCP_AUTHENTICATION_REJECTED]
            json.statusCode: [403]
          group_by: [json.serverName, json.userId, json.request_method, json.request_path, json.code, json.statusCode, json.message, json.stack]
          drop_fields: [timestamp, requestId, request_id]
          title: 'LibreChat MCP {json.serverName}: authentication rejected ({json.statusCode})'
          explanation: Repeated explicit destination failures for the same caller; targetless retry messages retain exact grouping.
      products: []
      overrides: []
    # HTTPS origin; empty uses frontendStudio.studio.hostname when configured.
    # Links are event diagnostic metadata, not a native email rendering guarantee.
    studioURL: ""
    monitoring:
      # Zero disables metrics, scraping and reporting-health alerts.
      port: 9090
      pollStaleSeconds: 300
      pendingAgeSeconds: 900
      alertFor: 2m
    opensearchURL: https://opensearch-v3-master.monitor-opensearch.svc.cluster.local:9200
    opensearchCAConfigMap: glitchtip-opensearch-ca
    # Optional additional CA for the DSN endpoint; system trust otherwise.
    glitchtipCAConfigMap: ""
    storage:
      size: 1Gi
      storageClassName: ""
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
