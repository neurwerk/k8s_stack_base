# IMAGE SOURCE: upstream
# OpenSearch Dashboards is controlled by its pinned vendor subchart.
opensearch-dashboards:
  fullnameOverride: monitor-opensearch-dashboards
  replicaCount: 1
  opensearchHosts: "https://opensearch-v3-master.monitor-opensearch.svc.cluster.local:9200"

  image:
    repository: opensearchproject/opensearch-dashboards
    tag: "3.8.0"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: false
    name: monitor-opensearch-dashboards
  rbac:
    create: false

  labels:
    app.kubernetes.io/part-of: monitor-opensearch
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000

  extraEnvs:
    - name: OPENSEARCH_USERNAME
      value: kibanaserver
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: monitor-opensearch-secret
          key: dashboardPassword
    - name: COOKIE_PASS
      valueFrom:
        secretKeyRef:
          name: monitor-opensearch-secret
          key: dashboardCookieSecret

  extraVolumes:
    - name: opensearch-ca
      configMap:
        name: monitor-opensearch-ca-trust
  extraVolumeMounts:
    - name: opensearch-ca
      mountPath: /usr/share/opensearch-dashboards/config/certs
      readOnly: true

  config:
    opensearch_dashboards.yml: |
      server.host: "0.0.0.0"
      opensearch.hosts: ["https://opensearch-v3-master.monitor-opensearch.svc.cluster.local:9200"]
      opensearch.ssl.verificationMode: full
      opensearch.ssl.certificateAuthorities: ["/usr/share/opensearch-dashboards/config/certs/ca.crt"]
      opensearch.username: "${OPENSEARCH_USERNAME}"
      opensearch.password: "${OPENSEARCH_PASSWORD}"
      opensearch.requestHeadersAllowlist: [authorization, securitytenant]
      opensearch_security.auth.type: "basicauth"
      opensearch_security.multitenancy.enabled: false
      opensearch_security.readonly_mode.roles: ["kibana_read_only"]
      opensearch_security.cookie.secure: false
      opensearch_security.cookie.password: "${COOKIE_PASS}"

  service:
    type: ClusterIP
    port: 5601
  ingress:
    enabled: false
  serviceMonitor:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Optional daily Prometheus-backed PDF report. Clients own enablement and SMTP facts.
monitorOpensearchReporting:
  enabled: false
  dashboard:
    # Leave name empty to use the chart-owned default dashboard ConfigMap.
    configMap:
      name: ""
      key: dashboard.ndjson
  provisioning:
    image: ghcr.io/neurwerk/k8s-stack-tooling:0.7.2@sha256:bfc4d5e1d3e7009c23be9759ee91ef91e5befc8b42af7f743d13449b2b4973b6
    activeDeadlineSeconds: 600
    backoffLimit: 3
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
  report:
    image: ghcr.io/neurwerk/k8s-stack-opensearch-reporting-cli:0.1.0@sha256:4b1698d57754baf16ccf8bb0148d588cc5d4b5e6fa086563ced7a5eb73a836c1
    schedule: "0 8 * * *"
    timeZone: Europe/Berlin
    activeDeadlineSeconds: 1200
    startingDeadlineSeconds: 3600
    backoffLimit: 2
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    subject: Neurwerk LLM performance report
    note: Previous local calendar day
    timeout: "900000"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  smtp:
    host: ""
    port: 465
    secure: true
    from: ""
    to: ""
