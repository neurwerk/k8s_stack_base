{{- if .Values.monitorOpensearchReporting.enabled }}
{{- $reporting := .Values.monitorOpensearchReporting -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-opensearch-reporting-provisioner-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-reporting-provisioner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch-reporting-provisioner
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-dashboards
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {protocol: TCP, port: 5601}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-opensearch-reporting-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-reporting
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch-reporting
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-dashboards
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {protocol: TCP, port: 5601}
    # Standard NetworkPolicy cannot select the client-configured SMTP FQDN.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: {{ $reporting.smtp.port }}
{{- end }}
