apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-opensearch-dashboards-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-v3
              app.kubernetes.io/instance: monitor-opensearch
      ports:
        - port: 9200
          protocol: TCP
