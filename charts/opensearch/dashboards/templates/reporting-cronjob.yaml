{{- if .Values.monitorOpensearchReporting.enabled }}
{{- $reporting := .Values.monitorOpensearchReporting -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitor-opensearch-reporting
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-reporting
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
spec:
  schedule: {{ $reporting.report.schedule | quote }}
  timeZone: {{ $reporting.report.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $reporting.report.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $reporting.report.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $reporting.report.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $reporting.report.activeDeadlineSeconds }}
      backoffLimit: {{ $reporting.report.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: opensearch-reporting
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: monitor-opensearch
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: {{ $reporting.report.image | quote }}
              args:
                - --auth
                - basic
                - --multitenancy
                - "false"
                - --format
                - pdf
                - --transport
                - smtp
              env:
                - name: TZ
                  value: {{ $reporting.report.timeZone | quote }}
                - name: OPENSEARCH_URL
                  value: "http://monitor-opensearch-dashboards:5601/app/dashboards#/view/neurwerk-llm-performance?_g=(time:(from:now-1d/d,to:now/d))"
                - name: OPENSEARCH_USERNAME
                  value: opensearch-reporting-reader
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: monitor-opensearch-secret
                      key: reportReaderPassword
                - name: OPENSEARCH_SMTP_HOST
                  value: {{ required "monitorOpensearchReporting.smtp.host is required when reporting is enabled" $reporting.smtp.host | quote }}
                - name: OPENSEARCH_SMTP_PORT
                  value: {{ $reporting.smtp.port | quote }}
                - name: OPENSEARCH_SMTP_SECURE
                  value: {{ $reporting.smtp.secure | quote }}
                - name: OPENSEARCH_SMTP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: monitor-opensearch-secret
                      key: smtpUsername
                - name: OPENSEARCH_SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: monitor-opensearch-secret
                      key: smtpPassword
                - name: OPENSEARCH_FROM
                  value: {{ required "monitorOpensearchReporting.smtp.from is required when reporting is enabled" $reporting.smtp.from | quote }}
                - name: OPENSEARCH_TO
                  value: {{ required "monitorOpensearchReporting.smtp.to is required when reporting is enabled" $reporting.smtp.to | quote }}
                - name: OPENSEARCH_EMAIL_SUBJECT
                  value: {{ $reporting.report.subject | quote }}
                - name: OPENSEARCH_EMAIL_NOTE
                  value: {{ $reporting.report.note | quote }}
                - name: OPENSEARCH_TIMEOUT
                  value: {{ $reporting.report.timeout | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
{{ toYaml $reporting.report.resources | indent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
{{- end }}
