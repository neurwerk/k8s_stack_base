{{- if .Values.monitorOpensearchReporting.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-opensearch-reporting-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-reporting-provisioner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
data:
  provision_reporting.py: |
{{ .Files.Get "files/provision_reporting.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-opensearch-reporting-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-reporting-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
data:
  dashboard.ndjson: |
{{ .Files.Get "files/llm-performance-dashboard.ndjson" | indent 4 }}
{{- end }}
