# Studio logs viewer user provisioning converges the read-only OpenSearch user
# to the password managed in the local monitor-opensearch-secret.
# Uses the same parameterized `upsert-opensearch-user` tooling as the
# fluent-bit ingest Job (see init-job.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: monitor-opensearch-init-studio-logs-user-job
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: opensearch-user-provisioning
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: monitor-opensearch-init-studio-logs-user-job
      labels:
        app.kubernetes.io/name: opensearch-user-provisioning
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ .Release.Namespace }}
    spec:
      serviceAccountName: monitor-opensearch-opensearch-ingest-service-account
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: init
          image: {{ (.Values.k8sTools).image | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Wait for OpenSearch HTTPS to be ready with authenticated admin access.
              # 30 attempts × 5s = 150s max. Success = authenticated HTTP 2xx.
              # Retry on connection errors, 401 (security not initialized), 503 (not ready).
              python3 -c "
              import os, sys, time, requests
              url = os.environ['OPENSEARCH_INTERNAL_URL'].rstrip('/') + '/_cluster/health'
              auth = (os.environ['OPENSEARCH_ADMIN_USER'], os.environ['OPENSEARCH_ADMIN_PASSWORD'])
              for i in range(1, 31):
                  try:
                      resp = requests.get(url, auth=auth, timeout=10, verify='/certs/ca.crt')
                      if 200 <= resp.status_code < 300:
                          print(f'OpenSearch ready (HTTP {resp.status_code})')
                          break
                      print(f'  Attempt {i}/30: HTTP {resp.status_code}, retrying...')
                  except Exception as e:
                      print(f'  Attempt {i}/30: {e}, retrying...')
                  if i == 30:
                      print('ERROR: OpenSearch not ready after 30 attempts')
                      sys.exit(1)
                  time.sleep(5)
              "
              exec upsert-opensearch-user
          env:
            - name: OPENSEARCH_INTERNAL_URL
              value: "https://opensearch-cluster-master.{{ .Release.Namespace }}.svc.cluster.local:9200"
            - name: OPENSEARCH_ADMIN_USER
              value: "admin"
            - name: OPENSEARCH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-opensearch-secret
                  key: adminPassword
            - name: REQUESTS_CA_BUNDLE
              value: /certs/ca.crt
            - name: INGEST_USER
              value: {{ .Values.monitorOpensearchWrapper.studioLogsUser | quote }}
            - name: INGEST_ROLE
              value: {{ .Values.monitorOpensearchWrapper.studioLogsRole | quote }}
            - name: INGEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-opensearch-secret
                  key: studioPassword
          volumeMounts:
            - name: ca-cert
              mountPath: /certs
              readOnly: true
      volumes:
        - name: ca-cert
          configMap:
            name: monitor-opensearch-ca-trust
            defaultMode: 0440
