# ServiceAccount for the security bootstrap Job (normal resource, not a hook —
# created alongside the Job that references it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-opensearch-security-bootstrap-service-account
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opensearch-security-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Release.Namespace }}
