apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-cert-manager-opensearch-ca-sync-role-binding
  namespace: infra-cert-manager
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-cert-manager-opensearch-ca-sync-role
subjects:
  - kind: ServiceAccount
    name: monitor-opensearch-ca-sync-service-account
    namespace: {{ .Release.Namespace }}
