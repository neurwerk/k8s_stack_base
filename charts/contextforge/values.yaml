contextforge:
  # Base installs the service by default; MCP providers remain unselected.
  enabled: true
  image: ghcr.io/ibm/mcp-context-forge:v1.1.1@sha256:16c7a8985c1a3528ba49fcab32951e06c9a41a171fc5c41d24b085283c4556a5

  # Configuration and External Secrets delivery must finish before installation.
  existingConfigMap: contextforge-runtime
  existingSecret: contextforge-runtime

  # Native Gunicorn HTTPS on the existing private Service/Pod port 4444.
  # Reconcile releases/contextforge/certificates and wait for Certificate Ready first.
  tls:
    enabled: true
    existingSecret: contextforge-tls

  # Explicit private-proxy activation; does not register accounts or integrations.
  # The fixed service principal and roles must be verified before enabling callers.
  trustedProxy:
    enabled: false
    defaultUserRole: ""
    defaultTeamMemberRole: ""
    # Exact public Studio origin, e.g. https://studio.example.com. Native default
    # redirect_uri is this origin plus /oauth/callback, served by Studio API only.
    studioOrigin: ""
    # Native limits aggregate all Studio users behind one Pod IP; retain limiting
    # with a budget for batched catalog reads and the account/role checks per action.
    rateLimits:
      criticalRpm: 120
      highRpm: 600
      mediumRpm: 1200
      lowRpm: 1200

  # Runs after migration and application readiness; definitions come from the
  # AgentGateway-generated catalog, never another hand-maintained server list.
  setup:
    enabled: false
    teamName: neurwerk-mcp
    serviceAccountEmail: ""
    ownerRoleName: neurwerk-mcp-provisioner
    activeDeadlineSeconds: 600
    # Studio leases discovery to the verified calling administrator.
    adminDiscovery:
      enabled: false
    # Both API Service and post-DNAT server destinations, supplied by the client.
    kubernetesApiEgress: []

  # Allow only the client's private Service ranges needed by retained upstreams.
  ssrfAllowedNetworks: []

  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "1", memory: 1Gi}
  migration:
    activeDeadlineSeconds: 300
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}

  # Approved upstream IP ranges and destination Pod ports; no provider egress by default.
  # Example: [{cidr: 192.0.2.10/32, port: 443}]
  providerEgress: []

# Same canonical, non-routing upstream workload definitions consumed by the
# AgentGateway chart. Project the approved client values into this namespace.
mcp-servers:
  studioSetup:
    enabled: false
  upstreamWorkloads: []
  catalog:
    presets: {}
    custom: []
