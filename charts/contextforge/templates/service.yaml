{{- if .Values.contextforge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "contextforge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    {{- if .Values.contextforge.tls.enabled }}
    - {name: https, port: 4444, targetPort: http, protocol: TCP}
    {{- else }}
    - {name: http, port: 4444, targetPort: http, protocol: TCP}
    {{- end }}
  selector:
    app.kubernetes.io/name: contextforge
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: application
{{- end }}
