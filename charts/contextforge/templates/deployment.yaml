{{- if .Values.contextforge.enabled }}
{{- if or (not (kindIs "bool" .Values.contextforge.tls.enabled)) (not (kindIs "bool" .Values.contextforge.trustedProxy.enabled)) }}
{{- fail "ContextForge tls.enabled and trustedProxy.enabled must be booleans" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "contextforge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: contextforge
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        {{- include "contextforge.labels" . | nindent 8 }}
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "contextforge.podSecurity" . | nindent 8 }}
      initContainers:
        {{- include "contextforge.trustInit" . | nindent 8 }}
      containers:
        - name: contextforge
          image: {{ .Values.contextforge.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "contextforge.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 4444, protocol: TCP}
          envFrom:
            - configMapRef: {name: {{ .Values.contextforge.existingConfigMap }}}
          env:
            {{- include "contextforge.credentials" . | nindent 12 }}
            {{- if .Values.contextforge.trustedProxy.enabled }}
            {{- include "contextforge.proxyEnvironment" . | nindent 12 }}
            {{- end }}
            {{- if .Values.contextforge.tls.enabled }}
            - {name: SSL, value: "true"}
            - {name: CERT_FILE, value: /var/run/contextforge/tls/tls.crt}
            - {name: KEY_FILE, value: /var/run/contextforge/tls/tls.key}
            {{- end }}
            - {name: SSL_CERT_FILE, value: /trust/ca.crt}
            - {name: GUNICORN_WORKERS, value: "1"}
            - {name: MCPGATEWAY_SKIP_MIGRATIONS, value: "true"}
          resources:
            {{- .Values.contextforge.resources | toYaml | nindent 12 }}
          startupProbe:
            {{- if .Values.contextforge.tls.enabled }}
            httpGet: {path: /ready, port: http, scheme: HTTPS}
            {{- else }}
            httpGet: {path: /ready, port: http}
            {{- end }}
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            {{- if .Values.contextforge.tls.enabled }}
            httpGet: {path: /ready, port: http, scheme: HTTPS}
            {{- else }}
            httpGet: {path: /ready, port: http}
            {{- end }}
            timeoutSeconds: 5
            periodSeconds: 5
          # /health returns HTTP 200 even for an unhealthy dependency.
          livenessProbe:
            tcpSocket: {port: http}
            timeoutSeconds: 3
            periodSeconds: 15
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: trust, mountPath: /trust, readOnly: true}
            {{- if .Values.contextforge.tls.enabled }}
            - {name: server-tls, mountPath: /var/run/contextforge/tls, readOnly: true}
            {{- end }}
      volumes:
        {{- include "contextforge.trustVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- if .Values.contextforge.tls.enabled }}
        - name: server-tls
          secret:
            secretName: {{ required "ContextForge tls.existingSecret is required" .Values.contextforge.tls.existingSecret }}
            defaultMode: 0440
        {{- end }}
{{- end }}
