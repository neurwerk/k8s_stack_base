{{- if and .Values.forgejo.enabled .Values.externalGateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: forgejo-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: {{ .Values.externalGateway.port }}
      protocol: HTTPS
      hostname: {{ .Values.forgejo.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: forgejo-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forgejo.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: forgejo-gateway
      sectionName: websecure
  hostnames: [{{ .Values.forgejo.hostname | quote }}]
  rules:
    - backendRefs:
        - name: forgejo
          port: 80
{{- end }}
