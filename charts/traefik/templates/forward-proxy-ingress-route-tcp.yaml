{{- if and .Values.aiGateway.enabled .Values.aiGateway.proxy.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: infra-agentgateway-forward-proxy
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: traefik-forward-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: {{ printf "HostSNI(`%s`)" .Values.aiGateway.proxy.hostname | quote }}
      services:
        - name: infra-agentgateway-forward-proxy
          port: {{ .Values.aiGateway.proxy.port }}
  tls:
    passthrough: true
{{- end }}
