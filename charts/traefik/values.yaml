# IMAGE SOURCE: upstream
# Traefik images are controlled by the vendor subchart; this wrapper has no owned image default.
traefik:
  # Disable before exposing OAuth callbacks: even 4xx access logs can include
  # credential-bearing query strings. This affects all edge access logs.
  accessLogs:
    enabled: true
  ports:
    web:
      port: 8000
      exposedPort: 80
    websecure:
      port: 443
      exposedPort: 443
  providers:
    kubernetesCRD:
      enabled: true
      # Keep maintenance overlays fail-closed while their temporary Pod is absent.
      allowEmptyServices: true
    kubernetesGateway:
      enabled: true

# Shared client-values contract, also consumed by the root AgentGateway chart.
# Enable only after public inspection trust and gateway hostname TLS are ready.
aiGateway:
  enabled: false
  proxy:
    enabled: false
    # Exact public DNS hostname; outer TLS terminates at AgentGateway.
    hostname: ""
    # One TCP port for the entrypoint, ClusterIP Service, host port and backend.
    # Must not collide with web/websecure or vendor admin/metrics ports.
    port: 8443
