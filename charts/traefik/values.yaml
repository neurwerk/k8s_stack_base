# IMAGE SOURCE: upstream
# Traefik images are controlled by the vendor subchart; this wrapper has no owned image default.
traefik:
  # Disable before exposing OAuth callbacks: even 4xx access logs can include
  # credential-bearing query strings. This affects all edge access logs.
  accessLogs:
    enabled: true
  ports:
    web:
      port: 8000
      exposedPort: 80
    websecure:
      port: 443
      exposedPort: 443
  providers:
    kubernetesCRD:
      enabled: true
      # Keep maintenance overlays fail-closed while their temporary Pod is absent.
      allowEmptyServices: true
    kubernetesGateway:
      enabled: true
