apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: infra-openbao-ca-bundle
  labels:
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-openbao
spec:
  sources:
    - secret:
        name: infra-cert-manager-internal-ca-secret
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        secrets.neurwerk.com/openbao-trust: "true"
