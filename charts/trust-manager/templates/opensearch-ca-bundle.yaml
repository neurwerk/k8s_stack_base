apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: monitor-opensearch-ca-bundle
  labels:
    app.kubernetes.io/name: trust-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-opensearch
spec:
  sources:
    - secret:
        name: infra-cert-manager-internal-ca-secret
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: infra-cert-manager
