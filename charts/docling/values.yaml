# Keep aligned with releases/shared/document-attachments.yaml. Client-wide
# overrides belong in client-values, projected into each consumer namespace.
# Positive integers: fileBytes/totalBytes <= 40 MiB, count <= 20, pages <= 1000.
documentAttachments:
  fileBytes: 20971520
  totalBytes: 41943040
  count: 5
  pages: 2

docling:
  enabled: false
  # Shared client-values selection; external runs the complete Serve API elsewhere.
  mode: internal
  image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
  # Existing namespace-local Secrets only; never put credentials in values.
  apiKeySecretRef: {name: "", key: ""}
  external:
    url: ""
    allowHttp: false
    cidrs: []
    port: 443
    caConfigMap: ""
  ingress:
    # Public HTTPS for the native API. Requires an external HTTP IPv4 /32 backend.
    # Callers supply X-Api-Key; the route never injects a service credential.
    enabled: false
    host: ""
  # Standard pipeline neural stage batch sizes; positive integers.
  batches:
    ocr: 4
    layout: 4
    table: 4
  # Native conversion budget, NOT a hard job cancellation deadline.
  documentTimeoutSeconds: 300
  # Shared with extProc's whole-batch budget and Gateway's derived outer timeout.
  # Also bounds Uvicorn draining; Pod termination adds 30 seconds for cleanup.
  syncWaitSeconds: 360
  resultRemovalDelaySeconds: 60
  cleanup:
    schedule: "*/5 * * * *"
    retentionSeconds: 600
    activeDeadlineSeconds: 60
    resources:
      requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi}
      limits: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
  # Disposable per-Pod storage, never mounted over the baked model artifacts.
  scratchSizeLimit: 1Gi
  tmpSizeLimit: 256Mi
  resources:
    requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi}
    limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 2Gi}

publicCertificates:
  useProduction: false
