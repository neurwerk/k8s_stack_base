{{- $docling := .Values.docling -}}
{{- if not (kindIs "bool" $docling.enabled) -}}
  {{- fail "docling.enabled must be boolean" -}}
{{- end -}}

{{- if hasKey $docling "inference" -}}
  {{- fail "docling.inference is no longer supported; use docling.mode" -}}
{{- end -}}
{{- if not (and (kindIs "string" $docling.mode) (has $docling.mode (list "internal" "external"))) -}}
  {{- fail "docling.mode must be internal or external" -}}
{{- end -}}
{{- if and $docling.enabled $docling.ingress.enabled -}}
{{- if ne $docling.mode "external" -}}
  {{- fail "docling.ingress currently requires docling.mode=external" -}}
{{- end -}}
{{- $host := $docling.ingress.host -}}
{{- if or (gt (len $host) 253) (eq $host "place.holder") (not (regexMatch `^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$` $host)) -}}
  {{- fail "docling.ingress.host must be a DNS hostname" -}}
{{- end -}}
{{- range splitList "." $host -}}
  {{- if gt (len .) 63 -}}{{- fail "docling.ingress.host labels must be at most 63 characters" -}}{{- end -}}
{{- end -}}
{{- $external := $docling.external -}}
{{- if not (regexMatch `^http://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(:[1-9][0-9]{0,4})?/?$` $external.url) -}}
  {{- fail "docling.ingress requires an external HTTP IPv4 origin" -}}
{{- end -}}
{{- if ne $external.allowHttp true -}}
  {{- fail "HTTP Docling requires docling.external.allowHttp=true" -}}
{{- end -}}
{{- $url := urlParse $external.url -}}
{{- $ip := first (splitList ":" $url.host) -}}
{{- $port := "80" -}}
{{- if contains ":" $url.host -}}{{- $port = last (splitList ":" $url.host) -}}{{- end -}}
{{- if or (ne (int $port) (int $external.port)) (gt (int $port) 65535) -}}
  {{- fail "docling.external.port must match the URL port" -}}
{{- end -}}
{{- $octets := splitList "." $ip -}}
{{- range $octets -}}
  {{- if or (gt (int .) 255) (ne (toString (int .)) .) -}}
    {{- fail "docling.ingress requires a valid private IPv4 address" -}}
  {{- end -}}
{{- end -}}
{{- $first := int (index $octets 0) -}}
{{- $second := int (index $octets 1) -}}
{{- if not (or (eq $first 10) (and (eq $first 172) (ge $second 16) (le $second 31)) (and (eq $first 192) (eq $second 168))) -}}
  {{- fail "docling.ingress backend must be RFC1918 IPv4" -}}
{{- end -}}
{{- if not (and (eq (len $external.cidrs) 1) (has (printf "%s/32" $ip) $external.cidrs)) -}}
  {{- fail "docling.ingress requires the external backend's exact /32 CIDR" -}}
{{- end -}}
{{- if or (not (regexMatch `^[1-9][0-9]*$` (toJson $docling.syncWaitSeconds))) (gt (int $docling.syncWaitSeconds) 3660) -}}
  {{- fail "docling.syncWaitSeconds must be positive integer seconds at most 3660" -}}
{{- end -}}
{{- end -}}
{{- if and $docling.enabled (eq $docling.mode "internal") -}}
{{- $attachments := .Values.documentAttachments -}}
{{- range $stage := list "ocr" "layout" "table" -}}
  {{- if not (regexMatch `^[1-9][0-9]*$` (toJson (index $docling.batches $stage))) -}}
    {{- fail (printf "docling.batches.%s must be a positive integer" $stage) -}}
  {{- end -}}
{{- end -}}

{{/* Existing service API credential, delivered only for the internal server. */}}
{{- with $docling.apiKeySecretRef -}}
  {{- if or
      (not (regexMatch `^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$` .name))
      (not (regexMatch `^[a-zA-Z0-9._-]+$` .key))
  -}}
    {{- fail "internal docling requires an existing API Secret name/key reference" -}}
  {{- end -}}
{{- else -}}
  {{- fail "internal docling requires an existing API Secret name/key reference" -}}
{{- end -}}

{{/* Attachment and time limits. */}}
{{- range $name, $maximum := dict "fileBytes" 41943040 "totalBytes" 41943040 "count" 20 "pages" 1000 -}}
  {{- $value := index $attachments $name -}}
  {{- if or (not (regexMatch `^[1-9][0-9]*$` (toJson $value))) (gt (float64 $value) (float64 $maximum)) -}}
    {{- fail (printf "documentAttachments.%s must be a positive integer at most %d" $name $maximum) -}}
  {{- end -}}
{{- end -}}
{{- if lt (int64 $attachments.totalBytes) (int64 $attachments.fileBytes) -}}
  {{- fail "documentAttachments.totalBytes must cover fileBytes" -}}
{{- end -}}
{{- range $seconds := list
    $docling.documentTimeoutSeconds
    $docling.syncWaitSeconds
    $docling.resultRemovalDelaySeconds
    $docling.cleanup.retentionSeconds
    $docling.cleanup.activeDeadlineSeconds
-}}
  {{- if not (regexMatch `^[1-9][0-9]*$` (toJson $seconds)) -}}
    {{- fail "docling time bounds must be positive integer seconds" -}}
  {{- end -}}
{{- end -}}
{{- if or
    (gt (int $docling.documentTimeoutSeconds) 3600)
    (le (int $docling.syncWaitSeconds) (int $docling.documentTimeoutSeconds))
    (gt (int $docling.syncWaitSeconds) 3660)
    (gt (int $docling.resultRemovalDelaySeconds) 600)
    (gt (int $docling.cleanup.retentionSeconds) 3600)
    (gt (int $docling.cleanup.activeDeadlineSeconds) 300)
-}}
  {{- fail "docling time bounds are inconsistent or exceed safety maxima" -}}
{{- end -}}

{{/* CPU, memory and disposable storage. Compare quantities in common units. */}}
{{- $resourceNames := list "cpu" "memory" "ephemeral-storage" -}}
{{- $unitFactors := dict "" 1 "m" 0.001 "Ki" 1024 "Mi" 1048576 "Gi" 1073741824 -}}
{{- range $resources := list $docling.resources $docling.cleanup.resources -}}
  {{- range $resource := $resourceNames -}}
    {{- $amounts := dict -}}
    {{- range $kind := list "requests" "limits" -}}
      {{- $value := toString (index $resources $kind $resource) -}}
      {{- $pattern := `^[1-9][0-9]*(Ki|Mi|Gi)?$` -}}
      {{- if eq $resource "cpu" -}}
        {{- $pattern = `^[1-9][0-9]*m?$` -}}
      {{- end -}}
      {{- if not (regexMatch $pattern $value) -}}
        {{- fail "docling resources require positive cpu, memory and ephemeral-storage requests/limits" -}}
      {{- end -}}
      {{- $unit := regexFind `[A-Za-z]+$` $value -}}
      {{- $factor := get $unitFactors $unit -}}
      {{- $_ := set $amounts $kind (mulf (regexFind `^[0-9]+` $value) $factor) -}}
    {{- end -}}
    {{- if gt (float64 $amounts.requests) (float64 $amounts.limits) -}}
      {{- fail "docling resource requests must not exceed limits" -}}
    {{- end -}}
  {{- end -}}
  {{- range $entries := $resources -}}
    {{- range $key, $_ := $entries -}}
      {{- if not (has $key $resourceNames) -}}
        {{- fail "docling is CPU-only; unsupported resource" -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range $size := list $docling.scratchSizeLimit $docling.tmpSizeLimit -}}
  {{- if not (regexMatch `^[1-9][0-9]*(Mi|Gi)$` $size) -}}
    {{- fail "docling disposable volume bounds must be positive Mi/Gi quantities" -}}
  {{- end -}}
{{- end -}}
{{- end -}}
