{{- if .Values.docling.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: docling
  labels:
    {{- include "docling.labels" . | nindent 4 }}
spec:
  secretName: docling-tls
  commonName: docling
  dnsNames:
    - docling
    - docling.docling
    - docling.docling.svc
    - docling.docling.svc.cluster.local
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: RSA, size: 2048, rotationPolicy: Always}
  usages: [server auth]
  issuerRef:
    name: infra-cert-manager-internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
