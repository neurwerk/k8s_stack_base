{{- if and .Values.docling.enabled .Values.docling.ingress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: docling-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docling.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.docling.external.port }}
      targetPort: {{ .Values.docling.external.port }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: docling-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docling.labels" . | nindent 4 }}
    kubernetes.io/service-name: docling-external
    endpointslice.kubernetes.io/managed-by: docling-chart.neurwerk.com
addressType: IPv4
ports:
  - name: http
    port: {{ .Values.docling.external.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ first (splitList ":" (urlParse .Values.docling.external.url).host) | quote }}
    conditions:
      ready: true
{{- end }}
