{{- if and .Values.docling.enabled .Values.docling.ingress.enabled }}
{{- $issuer := ternary "letsencrypt-production-cluster-issuer" "letsencrypt-staging-cluster-issuer" .Values.publicCertificates.useProduction }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: docling-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docling.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer | quote }}
    cert-manager.io/duration: "2160h"
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.docling.ingress.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: docling-public-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
