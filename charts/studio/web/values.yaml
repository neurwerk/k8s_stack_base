# --- Studio web configuration ---
frontendStudio:
  api:
    contextforge:
      enabled: false
  webImage: "ghcr.io/neurwerk/k8s-stack-studio-web:0.19.8@sha256:d27f09ecb3201ceb8e5e12f6d0c18538588aef8b5f3977a07dea5f65aa3a0860"
  studio:
    hostname: ""          # set in client_*/config/client.yaml
    replicas: 1
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      fsGroup: 1000
    ports:
      container:
        web: 3000
      service:
        web: 80
      gateway:
        tls: 443
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

    # --- OIDC (set via client_*/config/client.yaml) ---
    oidcAuthority: ""
    oidcClientId: ""

    # --- API service URL (internal, same namespace) ---
    apiServiceUrl: "http://frontend-studio-api-service.frontend-studio.svc.cluster.local:80"

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false
