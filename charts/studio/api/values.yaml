# --- Studio API configuration ---
frontendStudio:
  apiImage: "ghcr.io/neurwerk/k8s-stack-studio-api:0.15.1@sha256:6f674780c178b7964bb16795d9142c716c721308de22c3caac18649356ba1307"
  api:
    replicas: 1
    # Python and Uvicorn application logs; warnings and errors remain visible.
    logLevel: warning
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      fsGroup: 1000
    ports:
      container:
        http: 4010
        mgmt: 4090
      service:
        http: 80
        mgmt: 4090
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    # --- PII Engine workload mTLS ---
    piiEngineUrl: "https://monitor-pii-engine-service.monitor-pii-engine.svc.cluster.local:443"
    piiEngineCaCert: "/var/run/pii-engine/tls/ca.crt"
    piiEngineClientCert: "/var/run/pii-engine/tls/tls.crt"
    piiEngineClientKey: "/var/run/pii-engine/tls/tls.key"
    piiEngineClientSecretName: frontend-studio-pii-engine-client-tls
    piiEngineTimeout: 45

    # --- OpenSearch (logs viewer) ---
    # Password comes from frontend-studio-openbao-secret.
    opensearchUrl: "https://opensearch-v3-master.monitor-opensearch.svc.cluster.local:9200"
    opensearchUser: "studio-logs-read"
    # Path to the internal CA cert (mounted from the frontend-studio-shared-opensearch-ca ConfigMap)
    opensearchCaCert: "/certs/ca.crt"

    # --- AgentGateway request-log usage analytics ---
    agentgatewayAdminUrl: "http://infra-agentgateway-gateway.infra-agentgateway.svc.cluster.local:15000"
    usageTimezone: "UTC"

    # Explicit opt-in for the self-only LLM activity viewer. Both credentials
    # and egress are absent from the API Pod when this is false.
    llmLogs:
      enabled: false
      url: "http://monitor-langfuse-web.monitor-langfuse.svc.cluster.local:3000"
      secretName: frontend-studio-llm-logs-secret

    # Optional native MCP management, served only through the authenticated API.
    # Project the canonical MCP catalog into this namespace; never copy provider
    # definitions into Helm values or reference a ConfigMap in another namespace.
    contextforge:
      enabled: false
      accountOnboardingEnabled: false
      connectionsEnabled: false
      studioOrigin: ""
      catalogConfigMapName: mcp-catalog
      catalogKey: studio.json
      url: https://contextforge.contextforge.svc.cluster.local:4444
      caConfigMapName: infra-openbao-ca-bundle
      # Non-secret identity label for the approved fixed non-admin native account.
      # The operator provisions and verifies that account separately.
      serviceAccountEmail: ""
      teamId: ""
      globalRoleId: ""
      teamRoleId: ""

    # Required notice preference database and namespace-local password Secret.
    postgres:
      enabled: true
      host: postgres-operations.infra-postgres-operations.svc.cluster.local
      port: 5432
      database: studio
      user: studio
      secretName: frontend-studio-postgres-secret

    # Dedicated private HTTPS/mTLS listener; never expose on the public route.
    noticePreferences:
      enabled: true
      port: 8443
      servicePort: 443
      serverSecretName: frontend-studio-notice-preferences-tls

    # --- Keycloak / OIDC (set via client_*/config/client.yaml) ---
    keycloakServerUrl: ""
    keycloakRealm: ""
    keycloakClientId: ""
