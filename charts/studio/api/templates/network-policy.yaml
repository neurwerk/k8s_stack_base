apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-studio-api-egress-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: studio-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-pii-engine
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pii-engine
              app.kubernetes.io/component: runtime
      ports:
        # The PII Engine Service maps port 443 to Pod port 8443.
        - port: 8443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-keycloak
          podSelector:
            matchLabels:
              app: auth-keycloak-keycloak-app
      ports:
        # The Keycloak Service maps port 80 to Pod port 8080.
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-keycloak-api-key-bridge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-keycloak-api-key-bridge
      ports:
        # The API-key bridge Service maps port 3010 to Pod port 8000.
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-agentgateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: infra-agentgateway-gateway
              gateway.networking.k8s.io/gateway-name: infra-agentgateway-gateway
      ports:
        - port: 15000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-opensearch
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-v3
      ports:
        - port: 9200
          protocol: TCP
    {{- if .Values.frontendStudio.api.llmLogs.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-langfuse
          podSelector:
            matchLabels:
              app.kubernetes.io/name: langfuse
              app.kubernetes.io/instance: monitor-langfuse
              app.kubernetes.io/component: web
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
    {{- if .Values.frontendStudio.api.postgres.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-postgres-operations
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-operations
              app.kubernetes.io/instance: postgres-operations
      ports:
        - port: 9712
          protocol: TCP
    {{- end }}
{{- if .Values.frontendStudio.api.noticePreferences.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-studio-notice-preferences-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    # The private listener policy isolates the entire API Pod; preserve its public API route.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: {{ .Values.frontendStudio.api.ports.container.http }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitor-agentgateway-extproc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: monitor-agentgateway-extproc
              app.kubernetes.io/instance: monitor-agentgateway-extproc
      ports:
        - port: {{ .Values.frontendStudio.api.noticePreferences.port }}
          protocol: TCP
{{- end }}
