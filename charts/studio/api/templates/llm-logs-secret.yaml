{{- if .Values.frontendStudio.api.llmLogs.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-studio-llm-logs-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: frontend-studio-openbao-secret-store
    kind: SecretStore
  target:
    name: {{ .Values.frontendStudio.api.llmLogs.secretName }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: public-key
      remoteRef:
        key: frontend-studio/internal
        property: llmLogsPublicKey
    - secretKey: secret-key
      remoteRef:
        key: frontend-studio/internal
        property: llmLogsSecretKey
{{- end }}
