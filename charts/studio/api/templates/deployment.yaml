{{- if or (ne .Values.frontendStudio.api.noticePreferences.enabled true) (ne .Values.frontendStudio.api.postgres.enabled true) }}
{{- fail "Studio noticePreferences.enabled and postgres.enabled are required for this Base release" }}
{{- end }}
{{- if not (kindIs "bool" .Values.frontendStudio.api.llmLogs.enabled) }}
{{- fail "Studio llmLogs.enabled must be a boolean" }}
{{- end }}
# =============================================================================
# frontend-studio API Deployment (authenticated API + management server)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-studio-api-deployment
  namespace: {{ .Release.Namespace }}
  annotations:
    secret.reloader.stakater.com/reload: "frontend-studio-openbao-secret,{{ .Values.frontendStudio.api.piiEngineClientSecretName }}{{ if .Values.frontendStudio.api.postgres.enabled }},{{ .Values.frontendStudio.api.postgres.secretName }}{{ end }}{{ if .Values.frontendStudio.api.noticePreferences.enabled }},{{ .Values.frontendStudio.api.noticePreferences.serverSecretName }}{{ end }}{{ if .Values.frontendStudio.api.llmLogs.enabled }},{{ .Values.frontendStudio.api.llmLogs.secretName }}{{ end }}"
  labels:
    app.kubernetes.io/name: studio-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontendStudio.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: studio-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studio-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ .Release.Namespace }}
    spec:
      securityContext:
        runAsUser: {{ .Values.frontendStudio.api.securityContext.runAsUser }}
        runAsNonRoot: {{ .Values.frontendStudio.api.securityContext.runAsNonRoot }}
        fsGroup: {{ .Values.frontendStudio.api.securityContext.fsGroup }}
      {{- if .Values.frontendStudio.api.postgres.enabled }}
      initContainers:
        - name: notice-schema-migrate
          image: {{ .Values.frontendStudio.apiImage }}
          imagePullPolicy: Always
          command: ["k8s-stack-studio-migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: K8S_STUDIO_NOTICE_POSTGRES_HOST
              value: {{ .Values.frontendStudio.api.postgres.host | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_PORT
              value: {{ .Values.frontendStudio.api.postgres.port | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_DATABASE
              value: {{ .Values.frontendStudio.api.postgres.database | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_USER
              value: {{ .Values.frontendStudio.api.postgres.user | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontendStudio.api.postgres.secretName }}
                  key: password
      {{- end }}
      containers:
        # --- Authenticated API (port 4010) ---
        - name: {{ .Release.Name }}-api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: {{ .Values.frontendStudio.apiImage }}
          imagePullPolicy: Always
          env:
            - name: K8S_STUDIO_LOG_LEVEL
              value: {{ .Values.frontendStudio.api.logLevel | quote }}
            - name: K8S_STUDIO_PII_ENGINE_URL
              value: {{ .Values.frontendStudio.api.piiEngineUrl | quote }}
            - name: K8S_STUDIO_PII_ENGINE_CA_CERT
              value: {{ .Values.frontendStudio.api.piiEngineCaCert | quote }}
            - name: K8S_STUDIO_PII_ENGINE_CLIENT_CERT
              value: {{ .Values.frontendStudio.api.piiEngineClientCert | quote }}
            - name: K8S_STUDIO_PII_ENGINE_CLIENT_KEY
              value: {{ .Values.frontendStudio.api.piiEngineClientKey | quote }}
            - name: K8S_STUDIO_PII_ENGINE_TIMEOUT
              value: {{ .Values.frontendStudio.api.piiEngineTimeout | quote }}

            - name: K8S_STUDIO_KEYCLOAK_SERVER_URL
              value: {{ .Values.frontendStudio.api.keycloakServerUrl | quote }}
            - name: K8S_STUDIO_KEYCLOAK_REALM
              value: {{ .Values.frontendStudio.api.keycloakRealm | quote }}
            - name: K8S_STUDIO_KEYCLOAK_CLIENT_ID
              value: {{ .Values.frontendStudio.api.keycloakClientId | quote }}
            - name: K8S_STUDIO_KEYCLOAK_API_KEY_BRIDGE_URL
              value: "http://auth-keycloak-api-key-bridge-service.auth-keycloak-api-key-bridge.svc.cluster.local:3010"
            - name: K8S_STUDIO_OPENSEARCH_URL
              value: {{ .Values.frontendStudio.api.opensearchUrl | quote }}
            - name: K8S_STUDIO_OPENSEARCH_USER
              value: {{ .Values.frontendStudio.api.opensearchUser | quote }}
            - name: K8S_STUDIO_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-studio-openbao-secret
                  key: OPENSEARCH_PASSWORD
            - name: K8S_STUDIO_OPENSEARCH_CA_CERT
              value: {{ .Values.frontendStudio.api.opensearchCaCert | quote }}
            - name: K8S_STUDIO_AGENTGATEWAY_ADMIN_URL
              value: {{ .Values.frontendStudio.api.agentgatewayAdminUrl | quote }}
            - name: K8S_STUDIO_USAGE_TIMEZONE
              value: {{ .Values.frontendStudio.api.usageTimezone | quote }}
            - name: K8S_STUDIO_LLM_LOGS_ENABLED
              value: {{ .Values.frontendStudio.api.llmLogs.enabled | quote }}
            {{- if .Values.frontendStudio.api.llmLogs.enabled }}
            - name: K8S_STUDIO_LANGFUSE_URL
              value: {{ .Values.frontendStudio.api.llmLogs.url | quote }}
            - name: K8S_STUDIO_LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontendStudio.api.llmLogs.secretName }}
                  key: public-key
            - name: K8S_STUDIO_LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontendStudio.api.llmLogs.secretName }}
                  key: secret-key
            {{- end }}
            {{- if .Values.frontendStudio.api.postgres.enabled }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_HOST
              value: {{ .Values.frontendStudio.api.postgres.host | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_PORT
              value: {{ .Values.frontendStudio.api.postgres.port | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_DATABASE
              value: {{ .Values.frontendStudio.api.postgres.database | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_USER
              value: {{ .Values.frontendStudio.api.postgres.user | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontendStudio.api.postgres.secretName }}
                  key: password
            {{- end }}
          command: ["k8s-stack-studio"]
          ports:
            - name: http
              containerPort: {{ .Values.frontendStudio.api.ports.container.http }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: opensearch-ca
              mountPath: /certs
              readOnly: true
            - name: pii-engine-tls
              mountPath: /var/run/pii-engine/tls
              readOnly: true
          resources:
            {{- toYaml .Values.frontendStudio.api.resources | nindent 12 }}
        {{- if .Values.frontendStudio.api.noticePreferences.enabled }}
        # The private mTLS endpoint runs separately from the public ASGI server.
        - name: notice-preferences
          image: {{ .Values.frontendStudio.apiImage }}
          imagePullPolicy: Always
          command: ["k8s-stack-studio-notices"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: K8S_STUDIO_LOG_LEVEL
              value: {{ .Values.frontendStudio.api.logLevel | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_HOST
              value: {{ .Values.frontendStudio.api.postgres.host | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_PORT
              value: {{ .Values.frontendStudio.api.postgres.port | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_DATABASE
              value: {{ .Values.frontendStudio.api.postgres.database | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_USER
              value: {{ .Values.frontendStudio.api.postgres.user | quote }}
            - name: K8S_STUDIO_NOTICE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontendStudio.api.postgres.secretName }}
                  key: password
            - name: K8S_STUDIO_NOTICE_PORT
              value: {{ .Values.frontendStudio.api.noticePreferences.port | quote }}
            - name: K8S_STUDIO_NOTICE_TLS_CERT
              value: /var/run/notice-preferences/tls.crt
            - name: K8S_STUDIO_NOTICE_TLS_KEY
              value: /var/run/notice-preferences/tls.key
            - name: K8S_STUDIO_NOTICE_TLS_CA
              value: /var/run/notice-preferences/ca.crt
            - name: K8S_STUDIO_NOTICE_CLIENT_CN
              value: monitor-agentgateway-extproc-studio
          ports:
            - name: preferences
              containerPort: {{ .Values.frontendStudio.api.noticePreferences.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: preferences
          livenessProbe:
            tcpSocket:
              port: preferences
          volumeMounts:
            - name: notice-preferences-tls
              mountPath: /var/run/notice-preferences
              readOnly: true
          resources:
            {{- toYaml .Values.frontendStudio.api.resources | nindent 12 }}
        {{- end }}
        # --- Management server (port 4090) — internal-only, no auth ---
        - name: {{ .Release.Name }}-mgmt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: {{ .Values.frontendStudio.apiImage }}
          imagePullPolicy: Always
          command: ["k8s-stack-studio-mgmt"]
          env:
            - name: K8S_STUDIO_LOG_LEVEL
              value: {{ .Values.frontendStudio.api.logLevel | quote }}
          ports:
            - name: mgmt
              containerPort: {{ .Values.frontendStudio.api.ports.container.mgmt }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontendStudio.api.ports.container.mgmt }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontendStudio.api.ports.container.mgmt }}
          resources:
            {{- toYaml .Values.frontendStudio.api.resources | nindent 12 }}
      volumes:
        # Internal CA trust bundle for OpenSearch TLS — synced by the
        # monitor-opensearch-ca-sync-job (optional so the pod can start
        # before the opensearch release has synced it).
        - name: opensearch-ca
          configMap:
            name: frontend-studio-shared-opensearch-ca
            optional: true
        - name: pii-engine-tls
          secret:
            secretName: {{ .Values.frontendStudio.api.piiEngineClientSecretName }}
        {{- if .Values.frontendStudio.api.noticePreferences.enabled }}
        - name: notice-preferences-tls
          secret:
            secretName: {{ .Values.frontendStudio.api.noticePreferences.serverSecretName }}
        {{- end }}
