{{- $objectStore := .Values.infraRookCeph.objectStore -}}
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: monitor-pii-engine-models-object-bucket-claim
  namespace: {{ $objectStore.piiModels.namespace }}
  labels:
    {{- include "infra-rook-ceph.labels" . | nindent 4 }}
    app.kubernetes.io/component: pii-models
spec:
  bucketName: {{ $objectStore.piiModels.bucketName }}
  storageClassName: {{ $objectStore.bucketStorageClassName }}
  additionalConfig:
    bucketOwner: {{ $objectStore.piiModels.publisherUser }}
    bucketPolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "ModelSyncBucketRead",
            "Effect": "Allow",
            "Principal": {"AWS": ["arn:aws:iam:::user/{{ $objectStore.piiModels.modelSyncUser }}"]},
            "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
            "Resource": ["arn:aws:s3:::{{ $objectStore.piiModels.bucketName }}"]
          },
          {
            "Sid": "ModelSyncObjectRead",
            "Effect": "Allow",
            "Principal": {"AWS": ["arn:aws:iam:::user/{{ $objectStore.piiModels.modelSyncUser }}"]},
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::{{ $objectStore.piiModels.bucketName }}/*"]
          },
          {
            "Sid": "PublisherBucketRead",
            "Effect": "Allow",
            "Principal": {"AWS": ["arn:aws:iam:::user/{{ $objectStore.piiModels.publisherUser }}"]},
            "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketMultipartUploads"],
            "Resource": ["arn:aws:s3:::{{ $objectStore.piiModels.bucketName }}"]
          },
          {
            "Sid": "PublisherObjectManage",
            "Effect": "Allow",
            "Principal": {"AWS": ["arn:aws:iam:::user/{{ $objectStore.piiModels.publisherUser }}"]},
            "Action": [
              "s3:PutObject",
              "s3:GetObject",
              "s3:DeleteObject",
              "s3:AbortMultipartUpload",
              "s3:ListMultipartUploadParts"
            ],
            "Resource": ["arn:aws:s3:::{{ $objectStore.piiModels.bucketName }}/*"]
          }
        ]
      }
