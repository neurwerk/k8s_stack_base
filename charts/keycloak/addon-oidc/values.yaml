# Enable only with explicit addon settings and client approval.
enabled: false
k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.11.2@sha256:754eada6dba835ec2c5466cc11f62ff3e2920a133798ce28809cf7407a66689f
authKeycloak:
  realm: ""
  adminUser: ""
authentication:
  clientId: ""
  redirectUris: []
  webOrigins: []
  realmRoles: []
  roleClaim: addon_roles
  audiences: []
  refreshTokenRotation: true
  mode: login-only
  userTokenForwarding: false
  gatewayPermissions: []
# Supply exclusively from trusted client configuration, never addon defaults.
# Scope permits claims for roles users already have; it never assigns user roles.
clientApproval:
  clientId: ""
  realmRoles: []
  audiences: []
  gatewayPermissions: []
clientSecret:
  name: ""
  key: clientSecret
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
