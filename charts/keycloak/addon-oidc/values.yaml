# Enable only with explicit addon settings and client approval.
enabled: false
k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.15.6@sha256:2cfe62109c8067e08a81f422733e6673ef3eb0ee11066f72e7316878a76013db
authKeycloak:
  realm: ""
  adminUser: ""
authentication:
  clientId: ""
  redirectUris: []
  webOrigins: []
  # Optional nonempty exact HTTPS URLs; omission preserves webOrigins fallback.
  # Requires an explicitly selected published Tooling image >=0.13.6.
  # postLogoutRedirectUris: [https://app.example.com/auth]
  realmRoles: []
  roleClaim: addon_roles
  audiences: []
  refreshTokenRotation: true
  mode: login-only
  userTokenForwarding: false
  gatewayPermissions: []
# Supply exclusively from trusted client configuration, never addon defaults.
# Scope permits claims for roles users already have; it never assigns user roles.
clientApproval:
  clientId: ""
  redirectUris: []
  webOrigins: []
  # Optional trusted allowlist for authentication.postLogoutRedirectUris.
  # postLogoutRedirectUris: [https://app.example.com/auth]
  realmRoles: []
  audiences: []
  gatewayPermissions: []
clientSecret:
  name: ""
  key: clientSecret
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
