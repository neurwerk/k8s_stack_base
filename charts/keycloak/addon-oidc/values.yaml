# Enable only with explicit addon settings and client approval.
enabled: false
k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.11.1@sha256:8268cdc0af8b5abffa4d7082fae063cf5801d8af28d3e1bb8b5d8262ad67de00
authKeycloak:
  realm: ""
  adminUser: ""
authentication:
  clientId: ""
  redirectUris: []
  webOrigins: []
  realmRoles: []
  roleClaim: addon_roles
  audiences: []
  refreshTokenRotation: true
  mode: login-only
  userTokenForwarding: false
  gatewayPermissions: []
# Supply exclusively from trusted client configuration, never addon defaults.
# Scope permits claims for roles users already have; it never assigns user roles.
clientApproval:
  clientId: ""
  realmRoles: []
  audiences: []
  gatewayPermissions: []
clientSecret:
  name: ""
  key: clientSecret
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
