{{- if .Values.addonAccess.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "auth-keycloak-%s-access-egress" (required "addonAccess.name is required" .Values.addonAccess.name) | quote }}
  namespace: auth-keycloak
spec:
  podSelector:
    matchLabels:
      app: {{ printf "auth-keycloak-%s-access-job" .Values.addonAccess.name | quote }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: auth-keycloak-keycloak-app
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP
{{- end }}
