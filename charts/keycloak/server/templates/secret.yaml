# =============================================================================
# Keycloak credentials Secret
#
# Provides the generated master-realm admin and database credentials to Keycloak
# and the realm initialization Job. ESO projects these values from OpenBao;
# human onboarding never uses a shared password.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: auth-keycloak-secret
  namespace: auth-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  adminPassword: {{ .Values.authKeycloakSecrets.adminPassword
    | required "authKeycloakSecrets.adminPassword is required" | quote }}
  dbPassword: {{ .Values.authKeycloakSecrets.dbPassword
    | required "authKeycloakSecrets.dbPassword is required" | quote }}
