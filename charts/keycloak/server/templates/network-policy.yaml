apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-keycloak-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      app: auth-keycloak-keycloak-app
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: configuration
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: frontend-studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-keycloak-api-key-bridge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-keycloak-api-key-bridge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-agentgateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: infra-agentgateway-gateway
              gateway.networking.k8s.io/gateway-name: infra-agentgateway-gateway
        # The controller resolves remote JWKS before pushing JWT policy to the gateway.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-agentgateway
          podSelector:
            matchLabels:
              agentgateway: agentgateway
              app.kubernetes.io/name: agentgateway
              app.kubernetes.io/instance: infra-agentgateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-keycloak-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      app: auth-keycloak-keycloak-app
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra-postgres-auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-auth
              app.kubernetes.io/instance: postgres-auth
      ports:
        - port: {{ .Values.authKeycloak.database.port }}
          protocol: TCP
    {{- if .Values.authKeycloak.activeDirectory.enabled }}
    - to:
        {{- range .Values.authKeycloak.activeDirectory.egressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 636
          protocol: TCP
    {{- end }}
    {{- if .Values.authKeycloak.smtp.enabled }}
    # Standard NetworkPolicy cannot select the client-configured SMTP FQDN.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - port: {{ .Values.authKeycloak.smtp.port }}
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-init-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      app: auth-keycloak-init-job-app
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: auth-keycloak-keycloak-app
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP
