{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.authKeycloak.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
# =============================================================================
# Keycloak HTTPRoute
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-keycloak-httproute
  namespace: auth-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  parentRefs:
    - name: auth-keycloak-gateway
      namespace: auth-keycloak
      sectionName: websecure
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: auth-keycloak-keycloak-service
          port: {{ .Values.authKeycloak.keycloak.ports.service.http }}
{{- end }}
