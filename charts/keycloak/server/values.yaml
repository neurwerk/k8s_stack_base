authKeycloak:
  keycloakImage: ghcr.io/neurwerk/k8s-stack-keycloak-theme:0.1.2@sha256:ebadb5dd16baf2b516747cd9308bca0ea2fd215917e90d4dd2805b02acc311b9
  adminUser: admin
  realm: ""
  # REQUIRED: set per client through keycloak-product-values
  realmDisplayName: ""
  # Empty theme selections are omitted, not cleared on an existing realm.
  loginTheme: ""
  emailTheme: ""
  branding:
    # Mount the fixed client-brand child of neurwerk; selection is separate.
    # Company name comes from realmDisplayName. No client layout overrides.
    enabled: false
    # Required when enabled: namespace-local ConfigMap with company-logo.<logoFormat>.
    logoConfigMapName: ""
    # Supported logo formats: png or svg; filenames and shared layout are fixed.
    logoFormat: png
  smtp:
    enabled: false
    host: ""
    port: 465
    from: ""
    ssl: true
    starttls: false
  activeDirectory:
    enabled: false
    # Explicit plaintext opt-in; only ldap://host:389, never a TLS fallback.
    allowInsecureLdap: false
    connectionUrl: "ldaps://<active-directory-host>:636"
    usersDn: "<users-dn>"
    groupsDn: "<groups-dn>"
    usernameAttribute: sAMAccountName
    # When enabled, select exactly one non-empty list. Legacy same-name groups:
    groupNames: []
    # Example: {sourceName: AD_Group, targetParent: /access/neurwerk-studio-users}.
    groupMappings: []
    emailVerified: true
    # Required only for LDAPS; never used for plaintext LDAP.
    caConfigMapName: auth-keycloak-active-directory-ca
    caKey: ca.crt
    egressCidrs: []
  # Keycloak administrator-issued action link lifespan in seconds.
  adminActionTokenLifespan: 1800
  librechatClientId: librechat
  agentgatewayClientId: agentgateway
  database:
    host: postgres-auth.infra-postgres-auth.svc.cluster.local
    port: 5432
    name: keycloak
    username: keycloak
    caConfigMapName: infra-openbao-ca-bundle
    caKey: ca.crt
    caMountPath: /opt/keycloak/conf/truststores/postgres

  keycloak:
    ports:
      container:
        http: 8080       # Keycloak HTTP port
        mgmt: 9000       # Keycloak management port
      service:
        http: 80         # ClusterIP port for HTTP
        mgmt: 9000       # ClusterIP port for management
      gateway:
        tls: 443         # Gateway TLS listener port

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false

k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.7.4@sha256:6f6a72a2b16f6bd93771c60190f5e0dba552790c283ea99ad4005cbf94e6894e

# Populated from the OpenBao-backed Helm input Secret.
authKeycloakSecrets: {}
