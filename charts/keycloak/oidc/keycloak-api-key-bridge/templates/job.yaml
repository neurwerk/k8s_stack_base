# =============================================================================
# keycloak-api-key-bridge OIDC configuration Job
#
# Converges the keycloak-api-key-bridge OIDC client to the desired
# OpenBao-managed secret.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-keycloak-keycloak-api-key-bridge-oidc-job
  namespace: auth-keycloak
  labels:
    app.kubernetes.io/name: keycloak-api-key-bridge-oidc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: auth-keycloak-keycloak-api-key-bridge-oidc-job
      labels:
        app: auth-keycloak-keycloak-api-key-bridge-oidc-job
        job: auth-keycloak-keycloak-api-key-bridge-oidc-job
        app.kubernetes.io/name: keycloak-api-key-bridge-oidc
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: auth-keycloak
        app.kubernetes.io/component: configuration
    spec:
      serviceAccountName: auth-keycloak-keycloak-api-key-bridge-oidc-service-account
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: {{ (.Values.k8sTools).image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          command:
            - upsert-oidc-client
          env:
            - name: KC_INTERNAL_URL
              value: "http://auth-keycloak-keycloak-service.auth-keycloak.svc.cluster.local"
            - name: KC_ADMIN_USER
              value: {{ required "authKeycloak.adminUser is required" .Values.authKeycloak.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-secret
                  key: adminPassword
            - name: KC_REALM
              value: {{ required "authKeycloak.realm is required" .Values.authKeycloak.realm | quote }}
            - name: KC_CLIENT_ID
              value: {{ .Values.authKeycloak.keycloakApiKeyBridgeClientId | quote }}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-openbao-secret
                  key: bridgeOidcClientSecret
            - name: KC_REDIRECT_URI
              value: {{ .Values.authKeycloak.keycloakApiKeyBridgeRedirectUri | quote }}
            - name: KC_WEB_ORIGIN
              value: {{ .Values.authKeycloak.keycloakApiKeyBridgeWebOrigin | quote }}
            - name: KC_DIRECT_ACCESS_GRANTS_ENABLED
              value: "false"
            - name: KC_SERVICE_ACCOUNTS_ENABLED
              value: "true"
            - name: KC_CLIENT_AUDIENCES
              value: '["keycloak-api-key-bridge"]'
            - name: KC_SERVICE_ACCOUNT_ROLES
              value: '[{"clientId": "realm-management", "roleName": "view-users"}, {"clientId": "realm-management", "roleName": "query-clients"}, {"clientId": "realm-management", "roleName": "view-clients"}]'
            - name: KC_LOG_PREFIX
              value: "keycloak-api-key-bridge-oidc"
