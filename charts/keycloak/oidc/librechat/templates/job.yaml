# =============================================================================
# LibreChat OIDC configuration Job
#
# Converges the LibreChat OIDC client to the desired OpenBao-managed secret.
# =============================================================================
{{- $redirectUris := compact (list .Values.authKeycloak.librechatRedirectUri .Values.authKeycloak.librechatAdminRedirectUri) }}
{{- $webOrigins := compact (list .Values.authKeycloak.librechatWebOrigin .Values.authKeycloak.librechatAdminWebOrigin) }}
{{- if .Values.mcp.enabled }}
  {{- $hostname := required "frontendLibrechat.hostname is required when MCP is enabled" .Values.frontendLibrechat.hostname }}
  {{- range .Values.mcp.servers }}
    {{- $name := required "every MCP server requires a name" .name }}
    {{- if or (gt (len $name) 48) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$" $name)) }}{{- fail (printf "MCP server name %q must be a 1-48 character lowercase ASCII DNS subdomain" $name) }}{{- end }}
    {{- $redirectUris = append $redirectUris (printf "https://%s/api/mcp/%s/oauth/callback" $hostname $name) }}
  {{- end }}
{{- end }}
{{- $redirectUris = uniq $redirectUris }}
{{- $webOrigins = uniq $webOrigins }}
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-keycloak-librechat-oidc-job
  namespace: auth-keycloak
  labels:
    app.kubernetes.io/name: librechat-oidc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: auth-keycloak-librechat-oidc-job
      labels:
        app: auth-keycloak-librechat-oidc-job
        job: auth-keycloak-librechat-oidc-job
        app.kubernetes.io/name: librechat-oidc
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: auth-keycloak
        app.kubernetes.io/component: configuration
    spec:
      serviceAccountName: auth-keycloak-librechat-oidc-service-account
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ (.Values.k8sTools).image | quote }}
          command:
            - upsert-oidc-client
          env:
            - name: KC_INTERNAL_URL
              value: "http://auth-keycloak-keycloak-service.auth-keycloak.svc.cluster.local"
            - name: KC_ADMIN_USER
              value: {{ required "authKeycloak.adminUser is required — set via client-values or keycloak-product-values" .Values.authKeycloak.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-secret
                  key: adminPassword
            - name: KC_REALM
              value: {{ required "authKeycloak.realm is required — set via client-values or keycloak-product-values" .Values.authKeycloak.realm | quote }}
            - name: KC_CLIENT_ID
              value: {{ .Values.authKeycloak.librechatClientId | quote }}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-openbao-secret
                  key: librechatOidcClientSecret
            - name: KC_REDIRECT_URI
              value: {{ .Values.authKeycloak.librechatRedirectUri | quote }}
            - name: KC_WEB_ORIGIN
              value: {{ .Values.authKeycloak.librechatWebOrigin | quote }}
            - name: KC_REDIRECT_URIS
              value: {{ $redirectUris | toJson | quote }}
            - name: KC_WEB_ORIGINS
              value: {{ $webOrigins | toJson | quote }}
            - name: KC_REFRESH_TOKEN_ROTATION_ENABLED
              value: "true"
            - name: KC_CLIENT_AUDIENCES
              # Add "agentgateway" to the LibreChat OIDC client's access token audience.
              # This ensures AgentGateway's JWT validation succeeds — the token's `aud`
              # claim will include `"agentgateway"` which matches the AgentgatewayPolicy's
              # `allowedAudiences` list. Without this, the access token may only have
              # `"librechat"` or `"account"` in its audience, causing JWT validation to
              # fail and AgentGateway to return 403.
              value: '["agentgateway"]'
            - name: KC_LOG_PREFIX
              value: "keycloak-librechat-oidc"
