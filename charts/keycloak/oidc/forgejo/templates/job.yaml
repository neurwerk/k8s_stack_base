{{- if .Values.forgejo.enabled }}
{{- $hostname := required "forgejo.hostname is required" .Values.forgejo.hostname }}
{{- if not (regexMatch `^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$` $hostname) }}
{{- fail "forgejo.hostname must be an exact DNS hostname" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-keycloak-forgejo-oidc-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-oidc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: forgejo
data:
  reconcile.py: |
    {{- .Files.Get "files/reconcile.py" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-keycloak-forgejo-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-oidc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: forgejo
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-keycloak-forgejo-oidc-job
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: forgejo-oidc
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: forgejo
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: auth-keycloak-forgejo-oidc-job
        app.kubernetes.io/component: configuration
        app.kubernetes.io/name: forgejo-oidc
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: forgejo
    spec:
      serviceAccountName: auth-keycloak-forgejo-oidc
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          image: {{ .Values.k8sTools.image | quote }}
          command: [python, /opt/forgejo/reconcile.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: KC_INTERNAL_URL
              value: http://auth-keycloak-keycloak-service.auth-keycloak.svc.cluster.local
            - name: KC_ADMIN_USER
              value: {{ required "authKeycloak.adminUser is required" .Values.authKeycloak.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-secret
                  key: adminPassword
            - name: KC_REALM
              value: {{ required "authKeycloak.realm is required" .Values.authKeycloak.realm | quote }}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc-values
                  key: oidcClientSecret
            - name: KC_STANDARD_FLOW_ENABLED
              value: "true"
            - name: KC_DIRECT_ACCESS_GRANTS_ENABLED
              value: "false"
            - name: KC_SERVICE_ACCOUNTS_ENABLED
              value: "false"
            - name: KC_REDIRECT_URI
              value: {{ printf "https://%s/user/oauth2/keycloak/callback" $hostname | quote }}
            - name: KC_WEB_ORIGIN
              value: {{ printf "https://%s" $hostname | quote }}
          volumeMounts:
            - name: script
              mountPath: /opt/forgejo
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: auth-keycloak-forgejo-oidc-script
{{- end }}
