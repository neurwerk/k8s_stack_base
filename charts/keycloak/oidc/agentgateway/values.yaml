# IMAGE SOURCE: tooling
# k8sTools is a pinned neurwerk image used by this OIDC bootstrap Job.
# =============================================================================
# values.yaml — keycloak-oidc-configurations/agentgateway
#
# Default values for the AgentGateway OIDC client configuration.
#
# AgentGateway validates JWTs using JWKS (public keys) — no client secret
# injection needed. The OIDC Job only creates the client in Keycloak so the
# gateway's builtin azp policy can match it.
#
# Hostnames and URLs are defined in client_*/config/client.yaml.
# This file only defines non-hostname defaults.
# =============================================================================

# AgentGateway OIDC client ID (default — unlikely to change)
authKeycloak:
  agentgatewayClientId: agentgateway
  # Clients retain explicit llm, MCP, and custom/local model permissions;
  # platform OpenRouter model permissions are derived below.
  agentgatewayClientRoles:
    - llm:invoke
  # agentgatewayRedirectUri: "" => set in client_*/config/client.yaml
  # agentgatewayWebOrigin: "" => set in client_*/config/client.yaml

# k8sTools — init script image version
k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.11.2@sha256:754eada6dba835ec2c5466cc11f62ff3e2920a133798ce28809cf7407a66689f

openrouterCatalog:
  enabled: true
  excludedModels: []
  grantToAccessGroups: false
  models: []
