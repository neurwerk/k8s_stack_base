# IMAGE SOURCE: tooling
# k8sTools is a pinned neurwerk image used by this realm bootstrap Job.
# =============================================================================
# values.yaml — keycloak-realm-config/realm-roles
#
# Default values for realm-level role creation.
# =============================================================================

authKeycloak:
  # Keycloak master realm admin credentials — used to authenticate
  # to the Admin REST API. Set by the chart; override per-client if needed.
  adminUser: admin

  # The standard groups are owned by files/standard-access.yaml, not client values.
  # Remove only these direct application grants from platform-admin (role names):
  # keycloak-admin, api-key-admin, opensearch-admin, langfuse-admin, pii-admin, mcp-admin,
  # gateway-admin and studio-user.
  # [] restores all defaults. Groups, memberships, and invocation grants are unchanged.
  platformAdminRoleExclusions: []

  # Clients retain explicit llm, MCP, application, provider company-use and custom/local model permissions. The
  # platform derives inherited OpenRouter model permissions from its catalog.
  agentgatewayClientRoles:
    - llm:invoke

  # /access/neurwerk-llm-all-users accepts llm/model/provider permissions;
  # /access/neurwerk-mcp-all-users accepts llm/MCP permissions;
  # /access/neurwerk-ai-application-users accepts llm/application/provider permissions.
  # All resource groups exist without grants; application admission implies no access.
  agentgatewayAccessGroups: {}

openrouterCatalog:
  enabled: true
  excludedModels: []
  # Global catalog auto-grants are unsupported; clients grant selected roles explicitly.
  grantToAccessGroups: false
  models: []

k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.12.0@sha256:b70f0f93ca2c3e5cef9290af2db6480bec72cedc0289ecd232747996eb01091a
