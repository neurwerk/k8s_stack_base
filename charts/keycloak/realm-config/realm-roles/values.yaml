# IMAGE SOURCE: tooling
# k8sTools is a pinned neurwerk image used by this realm bootstrap Job.
# =============================================================================
# values.yaml — keycloak-realm-config/realm-roles
#
# Default values for realm-level role creation.
# =============================================================================

authKeycloak:
  # Keycloak master realm admin credentials — used to authenticate
  # to the Admin REST API. Set by the chart; override per-client if needed.
  adminUser: admin

  # The 13 standard groups and optional Forgejo roles/groups are owned by
  # files/standard-access.yaml and files/forgejo-access.yaml, not client values.
  # Remove only these direct application grants from platform-admin (role names):
  # keycloak-admin, api-key-admin, opensearch-admin, langfuse-admin, pii-admin,
  # studio-user, librechat-admin, dify-admin, forgejo-admin.
  # Forgejo is granted only when enabled; its exclusion is valid while disabled.
  # [] restores all defaults. Groups, memberships, and model/MCP grants are unchanged.
  platformAdminRoleExclusions: []

  # Clients retain explicit llm, MCP, and custom/local model permissions. The
  # platform derives inherited OpenRouter model permissions from its catalog.
  agentgatewayClientRoles:
    - llm:invoke

  # Only /access/neurwerk-llm-all-users (llm/model permissions) and
  # /access/neurwerk-mcp-all-users (llm/MCP permissions) may receive these grants.
  # Both groups exist without grants; application admission implies no access.
  agentgatewayAccessGroups: {}

openrouterCatalog:
  enabled: true
  excludedModels: []
  # Global catalog auto-grants are unsupported; clients grant selected roles explicitly.
  grantToAccessGroups: false
  models: []

# Disabling omits the optional definitions, never deletes existing identities.
forgejo:
  enabled: false

k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.7.0@sha256:f744427df82f4a5b0a94f2f9fbf6c59ab98e1ec4f99963b6d836ea9d765e88bb
