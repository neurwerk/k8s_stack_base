# IMAGE SOURCE: tooling
# The bind identity is materialized from OpenBao only when federation is enabled.
authKeycloak:
  adminUser: admin
  realm: ""
  activeDirectory:
    enabled: false
    connectionUrl: "ldaps://<active-directory-host>:636"
    usersDn: "<users-dn>"
    groupsDn: "<groups-dn>"
    usernameAttribute: sAMAccountName
    groupNames: []
    emailVerified: true
    caConfigMapName: auth-keycloak-active-directory-ca
    caKey: ca.crt
    egressCidrs: []

k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.6.1@sha256:60829618924ae8121817a2039faecff2dbf881debef852f84bec7c1ceb03a805
