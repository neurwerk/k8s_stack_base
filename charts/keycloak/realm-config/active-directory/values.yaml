# IMAGE SOURCE: tooling
# The bind identity is materialized from OpenBao only when federation is enabled.
authKeycloak:
  adminUser: admin
  realm: ""
  activeDirectory:
    # Explicit runtime-supported addon groups approved for directory mapping.
    addonGroupTargets: []
    enabled: false
    # Explicit plaintext opt-in; only ldap://host:389, never a TLS fallback.
    allowInsecureLdap: false
    connectionUrl: "ldaps://<active-directory-host>:636"
    connectionTimeoutMs: 5000
    readTimeoutMs: 10000
    usersDn: "<users-dn>"
    groupsDn: "<groups-dn>"
    usernameAttribute: sAMAccountName
    # When enabled, select exactly one non-empty list. Legacy same-name groups:
    groupNames: []
    # Example: {sourceName: AD_Group, targetParent: /access/neurwerk-studio-users}.
    # Tooling >=0.7.2 warns for missing mapped groups and retains them for later discovery.
    groupMappings: []
    emailVerified: true
    # Required only for LDAPS; never used for plaintext LDAP.
    caConfigMapName: auth-keycloak-active-directory-ca
    caKey: ca.crt
    egressCidrs: []

k8sTools:
  image: ghcr.io/neurwerk/k8s-stack-tooling:0.14.0@sha256:a1db80f00e8579478382ecc34717af484cf75239008ae8dbe66b01632aa49305
