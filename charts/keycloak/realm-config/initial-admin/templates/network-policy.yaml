apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-initial-admin-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: initial-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      app: auth-keycloak-initial-admin-job
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: auth-keycloak-keycloak-app
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP
{{- if and .Values.authKeycloak.smtp.enabled .Values.externalGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-initial-admin-action-email-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: initial-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      job: auth-keycloak-initial-admin-action-email-job
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 443
          protocol: TCP
{{- end }}
