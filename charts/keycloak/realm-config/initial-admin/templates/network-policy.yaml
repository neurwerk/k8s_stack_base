apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-initial-admin-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: initial-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      app: auth-keycloak-initial-admin-job
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: auth-keycloak-keycloak-app
      ports:
        - port: 8080
          protocol: TCP
        - port: 9000
          protocol: TCP
{{- if and .Values.authKeycloak.smtp.enabled .Values.externalGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-keycloak-initial-admin-action-email-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: initial-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: auth-keycloak
spec:
  podSelector:
    matchLabels:
      job: auth-keycloak-initial-admin-action-email-job
  policyTypes: [Egress]
  egress:
    # Standard NetworkPolicy cannot select the client-configured issuer FQDN.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - port: 443
          protocol: TCP
{{- end }}
