apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-fluent-bit-application-errors
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: monitor-fluent-bit
data:
  application-errors.lua: |
    local addon_applications = {
    {{- range $namespace, $application := .Values.monitorFluentBit.applicationAlerts.addonApplications }}
    {{- if or (not (regexMatch `^[a-z][a-z0-9-]{0,62}$` $namespace)) (not (regexMatch `^[a-z][a-z0-9-]{0,62}$` $application)) }}{{ fail "applicationAlerts.addonApplications requires exact namespace and application identifiers" }}{{ end }}
      [{{ $namespace | quote }}] = {{ $application | quote }},
    {{- end }}
    }
    {{- .Files.Get "files/application-errors.lua" | nindent 4 }}
