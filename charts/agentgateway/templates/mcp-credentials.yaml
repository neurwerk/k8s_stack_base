{{- if not (kindIs "bool" .Values.mcp.studioSetup.enabled) }}{{ fail "mcp.studioSetup.enabled must be a boolean" }}{{- end }}
{{- if .Values.mcp.studioSetup.enabled }}
{{- if or (not .Values.mcp.enabled) (not (empty .Values.mcp.servers)) }}{{ fail "Studio MCP setup requires the enabled native catalog" }}{{- end }}
{{- $shared := list }}
{{- range include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if not .contextforge }}{{ fail "Studio MCP setup requires native catalog entries" }}{{- end }}
{{- if eq (.credential.owner | default "none") "shared" }}{{- $shared = append $shared . }}{{- end }}
{{- end }}
{{- if $shared }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-shared-delivery
  namespace: infra-agentgateway
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mcp-shared-delivery
  namespace: infra-agentgateway
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mcp-shared-delivery
          serviceAccountRef:
            name: mcp-shared-delivery
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-runtime-values
  namespace: infra-agentgateway
spec:
  refreshInterval: 5s
  secretStoreRef: {name: mcp-shared-delivery, kind: SecretStore}
  target:
    name: mcp-runtime-values
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        # Only version/configured metadata reaches Helm values, never a key.
        values.yaml: |
          mcp:
            runtimeCredentials:
              {{- range $index, $server := $shared }}
              {{ $server.name }}:
                version: {{ printf "{{ (index . %q | fromJson).version | quote }}" (printf "record%d" $index) }}
                kvVersion: {{ printf "{{ (index . %q | fromJson).kvVersion }}" (printf "record%d" $index) }}
                configured: {{ printf "{{ ne (index . %q | fromJson).apiKey \"\" }}" (printf "record%d" $index) }}
              {{- end }}
  data:
    {{- range $index, $server := $shared }}
    - secretKey: {{ printf "record%d" $index }}
      remoteRef:
        key: {{ printf "mcp/shared/%s" $server.name }}
    {{- end }}
{{- range $server := $shared }}
{{- $record := include "infra-agentgateway.mcpCredentialVersion" (dict "root" $ "id" $server.name) | fromYaml }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "infra-agentgateway.mcpCredentialName" (dict "id" $server.name "version" $record.version) }}
  namespace: infra-agentgateway
spec:
  refreshInterval: 1m
  secretStoreRef: {name: mcp-shared-delivery, kind: SecretStore}
  target:
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: {{ printf "mcp/shared/%s" $server.name }}
        version: {{ $record.kvVersion | quote }}
        property: apiKey
{{- end }}
{{- end }}
{{- $deployments := list }}
{{- range include "infra-agentgateway.mcpUpstreamWorkloads" . | fromYamlArray }}
{{- if .credential }}
{{- $deployments = append $deployments (include "infra-agentgateway.mcpResourceName" (dict "id" .name "component" "deploy")) }}
{{- end }}
{{- end }}
{{- range $shared }}
{{- if and (eq .credential.method "upstream-env") (not (has (include "infra-agentgateway.mcpResourceName" (dict "id" .name "component" "deploy")) $deployments)) }}{{ fail "MCP upstream-env credentials require an installed upstream workload" }}{{- end }}
{{- end }}
{{- if $deployments }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studio-mcp-runtime
  namespace: infra-agentgateway
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: {{ $deployments | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studio-mcp-runtime
  namespace: infra-agentgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: studio-mcp-runtime
subjects:
  - kind: ServiceAccount
    name: studio-mcp
    namespace: frontend-studio
{{- end }}
{{- end }}
