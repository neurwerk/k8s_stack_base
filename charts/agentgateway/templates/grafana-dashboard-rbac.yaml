apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-agentgateway-grafana-dashboard-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-dashboard-reader
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infra-agentgateway-grafana-dashboard-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-dashboard-reader
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-agentgateway-grafana-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: monitor-kube-prometheus-stack-grafana
    namespace: monitor-kube-prometheus-stack
