# =============================================================================
# Model Cost Catalog ConfigMap
#
# Stores the model cost catalog JSON referenced by AgentgatewayParameters.
# AgentGateway uses this to compute realized USD cost per LLM request and
# expose it in logs, traces, metrics, and CEL (llm.cost, llm.costRates).
#
# Cost data flows automatically to Langfuse via existing OTel traces.
#
# The catalog is generated by agctl from models.dev pricing data:
#   agctl costs import --pretty --providers openai,anthropic,deepseek \
#     --out charts/agentgateway/files/catalog.json
#
# Format: JSON with USD per 1,000,000 tokens. Supports cacheRead, cacheWrite,
# reasoning, tiers, and other token types per the AgentGateway cost catalog schema.
# =============================================================================
{{- $catalog := .Files.Get "files/catalog.json" }}
{{- if $catalog }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-agentgateway-model-cost-catalog
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: model-cost-catalog
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
data:
  catalog.json: |
    {{- $catalog | nindent 4 }}
{{- end }}
