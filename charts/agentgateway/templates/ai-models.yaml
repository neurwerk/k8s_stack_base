{{- if .Values.aiGateway.enabled }}
{{- $revision := include "infra-agentgateway.aiRevision" . }}
{{- range $binding := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- $entries := list }}
{{- if $binding.api }}{{ $entries = append $entries (dict "name" "api" "listener" "api-bindings" "prefix" $binding.prefix) }}{{ end }}
{{- if $binding.inspect }}{{ $entries = append $entries (dict "name" "proxy" "listener" (printf "inspect-%s" $binding.id) "prefix" "/") }}{{ end }}
{{- $pii := dict }}
{{- range $model := $binding.models }}{{ $_ := set $pii $model.name $model.piiEnabled }}{{ end }}
{{- $inner := merge (dict "contract_version" "4.1" "destination_kind" "model" "models" $pii) $binding.attachmentPolicy }}
{{- $innerExpression := printf `%s.merge({"principal_id": metadata.neurwerk_admission.principal_id, "credential_context_version": metadata.neurwerk_admission.credential_context_version, "credential_id": metadata.neurwerk_admission.credential_id, "credential_kind": metadata.neurwerk_admission.credential_kind})` ($inner | toJson) }}
{{- if gt (len $innerExpression) 16384 }}{{ fail "v5 destination_policy exceeds native metadata limit" }}{{ end }}
{{- range $entry := $entries }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-{{ $binding.id }}-{{ $entry.name }}
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  parentRefs:
    - {name: infra-agentgateway-gateway, sectionName: {{ $entry.listener }}}
  {{- if eq $entry.name "proxy" }}
  hostnames: [{{ $binding.host | quote }}]
  {{- end }}
  rules:
    - name: models
      matches:
        - method: POST
          path: {type: PathPrefix, value: {{ $entry.prefix | quote }}}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayModel, name: "*"}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-{{ $binding.id }}-{{ $entry.name }}-processing
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-{{ $binding.id }}-{{ $entry.name }}, sectionName: models}
  traffic:
    phase: PostRouting
    # Disable retries explicitly, including inherited Gateway retry settings.
    # Accounting currently observes one upstream attempt.
    retry:
      attempts: 1
      precondition: 'false'
      codes: []
    extProc:
      backendRef:
        group: ""
        kind: Service
        name: monitor-agentgateway-extproc-service
        namespace: monitor-agentgateway-extproc
        port: {{ $.Values.guardrails.llmPolicyEngine.extProcPort }}
      failureMode: FailClosed
      metadataContext:
        agentgateway.dev.grpc_initial_metadata:
          x-request-id: 'metadata.neurwerk_admission.request_id'
        neurwerk.destination_policy:
          contract_version: '5'
          request_context: 'metadata.neurwerk_admission'
          destination_policy: {{ $innerExpression | squote }}
          model_bindings: {{ $binding.modelBindings | toJson | squote }}
          reroute_targets: {{ $binding.rerouteTargets | toJson | squote }}
      processingOptions:
        requestHeaderMode: Send
        requestBodyMode: Buffered
        responseHeaderMode: Send
        responseBodyMode: FullDuplexStreamed
        allowModeOverride: false
    {{- if and (eq $entry.name "proxy") (has "openai-codex-responses-v1" $binding.profiles) }}
    # Route extProc sees the admitted native path before transformation; model
    # serving then recognizes Responses and applies the fixed upstream baseURL.
    transformation:
      request:
        set:
          - name: ':path'
            value: '"/v1/responses"'
    {{- end }}
{{- end }}
{{- range $model := $binding.models }}
{{- $name := printf "ai-%s-%s" $binding.id (sha256sum $model.name | trunc 12) }}
{{- $matches := list $model.name }}
{{/* Google selects by URL before consulting body.model. Its unique upstream-name
alias needs the same exact virtual route; it is not a second catalog destination. */}}
{{- if eq $binding.provider "Gemini" }}{{ $matches = list $model.name $model.upstreamModel | uniq }}{{ end }}
{{- range $match := $matches }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ $name }}{{ if ne $match $model.name }}-alias{{ end }}
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- range $entry := $entries }}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-{{ $binding.id }}-{{ $entry.name }}, sectionName: models}
    {{- end }}
  match:
    model: {{ $match | quote }}
  visibility: Public
  # Same canonical model and upstream; only its frozen credential source chooses
  # an internal target. Every branch is conditional: there is no fallback.
  virtualModel:
    conditional:
      targets:
        {{- if $binding.localReroute }}
        - when: {{ printf `metadata.neurwerk_admission.provider_credential_source == "company" && extproc["neurwerk.request_context"].dispatch_destination_id == %q && extproc["neurwerk.request_context"].dispatch_binding_id == %q` $binding.localReroute $binding.localRerouteBackend.binding_id | squote }}
          modelRef: {name: {{ $name }}-local-reroute}
        {{- end }}
        {{- range $source := $binding.credentialSources }}
        - when: {{ printf `metadata.neurwerk_admission.provider_credential_source == %q && extproc["neurwerk.request_context"].dispatch_destination_id == %q && extproc["neurwerk.request_context"].dispatch_binding_id == %q` $source $model.name $binding.id | squote }}
          modelRef:
            name: {{ $name }}-{{ ternary "personal" $source (eq $source "caller_supplied") }}
        {{- end }}
{{- end }}
{{- range $source := $binding.credentialSources }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ $name }}-{{ ternary "personal" $source (eq $source "caller_supplied") }}
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- range $entry := $entries }}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-{{ $binding.id }}-{{ $entry.name }}, sectionName: models}
    {{- end }}
  visibility: Internal
  {{- $includedCodex := and (eq ($binding.billingMode | default "") "included") (has "openai-codex-responses-v1" $binding.profiles) (eq $source "caller_supplied") }}
  provider: {{ ternary "Custom" $binding.provider $includedCodex }}
  baseURL: {{ $binding.upstreamURL | quote }}
  {{- if $includedCodex }}
  custom:
    providerOverride: codex
    formats: [{type: Responses}]
  {{- else if eq $binding.provider "Custom" }}
  custom:
    formats: [{type: Completions}]
  {{- end }}
  policies:
    {{- if eq $source "company" }}
    auth:
      secretRef: {name: {{ $binding.authSecret | quote }}}
    {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - >-
            extproc["neurwerk.request_context"].resolved_model == {{ $model.upstreamModel | toJson }} &&
            extproc["neurwerk.request_context"].destination_id == {{ $model.name | toJson }} &&
            extproc["neurwerk.request_context"].dispatch_destination_id == {{ $model.name | toJson }} &&
            extproc["neurwerk.request_context"].dispatch_binding_id == {{ $binding.id | toJson }} &&
            extproc["neurwerk.request_context"].requested_model in {{ list $model.name $model.upstreamModel | uniq | toJson }} &&
            metadata.neurwerk_admission.all(k, extproc["neurwerk.request_context"][k] == metadata.neurwerk_admission[k]) &&
            metadata.neurwerk_admission.binding_id == {{ $binding.id | toJson }} &&
            metadata.neurwerk_admission.provider_credential_source == {{ $source | toJson }} &&
            metadata.neurwerk_admission.policy_revision == {{ $revision | toJson }} &&
            extproc["neurwerk.request_context"].content_tracing_enabled == {{ $model.contentTracingEnabled }} &&
            extproc["neurwerk.request_context"].pii_policy.enabled == {{ $model.piiEnabled }} &&
            {{ (get $binding.modelBindings $model.name).required_permissions | toJson }}.all(p, p in metadata.neurwerk_admission.permissions)
            {{- if eq $source "company" }}
            && {{ printf "provider:%s:company-use" $binding.providerId | toJson }} in metadata.neurwerk_admission.permissions
            {{- end }}
    transformations:
      - field: model
        expression: {{ $model.upstreamModel | toJson | squote }}
{{- end }}
{{- if $binding.localReroute }}
{{- $target := $binding.localRerouteBackend }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ $name }}-local-reroute
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- range $entry := $entries }}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-{{ $binding.id }}-{{ $entry.name }}, sectionName: models}
    {{- end }}
  visibility: Internal
  provider: {{ $target.provider }}
  baseURL: {{ $target.upstreamURL | quote }}
  {{- if eq $target.provider "Custom" }}
  custom:
    formats: [{type: Completions}]
  {{- end }}
  policies:
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - >-
            metadata.neurwerk_admission.all(k, extproc["neurwerk.request_context"][k] == metadata.neurwerk_admission[k]) &&
            metadata.neurwerk_admission.binding_id == {{ $binding.id | toJson }} &&
            metadata.neurwerk_admission.provider_credential_source == "company" &&
            metadata.neurwerk_admission.policy_revision == {{ $revision | toJson }} &&
            extproc["neurwerk.request_context"].destination_id == {{ $model.name | toJson }} &&
            extproc["neurwerk.request_context"].requested_model in {{ list $model.name $model.upstreamModel | uniq | toJson }} &&
            extproc["neurwerk.request_context"].dispatch_destination_id == {{ $binding.localReroute | toJson }} &&
            extproc["neurwerk.request_context"].dispatch_binding_id == {{ $target.binding_id | toJson }} &&
            extproc["neurwerk.request_context"].resolved_model == {{ $target.upstream_model | toJson }} &&
            extproc["neurwerk.request_context"].pii_policy.enabled == {{ $model.piiEnabled }} &&
            extproc["neurwerk.request_context"].content_tracing_enabled == {{ and $model.contentTracingEnabled $target.content_tracing_enabled }} &&
            {{ concat (get $binding.modelBindings $model.name).required_permissions $target.required_permissions (list (printf "provider:%s:company-use" $binding.providerId)) | uniq | toJson }}.all(p, p in metadata.neurwerk_admission.permissions)
    transformations:
      - field: model
        expression: {{ $target.upstream_model | toJson | squote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
