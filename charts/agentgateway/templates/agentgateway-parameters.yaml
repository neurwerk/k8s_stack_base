# =============================================================================
# AgentGateway Parameters — Data Plane Configuration
#
# Configures tracing, an optional client model catalog, and other data plane settings for the
# AgentGateway gateway proxy (infra-agentgateway-gateway). This is the proper
# way to enable OTLP tracing — environment variables like OTEL_EXPORTER_OTLP_ENDPOINT
# only affect the control plane's own telemetry, not the LLM request traces.
#
# The Gateway must reference this via spec.infrastructure.parametersRef:
#
#   spec:
#     infrastructure:
#       parametersRef:
#         name: infra-agentgateway-parameters
#         group: agentgateway.dev
#         kind: AgentgatewayParameters
#
# Without this reference, tracing config is never pushed to the data plane.
# See: https://agentgateway.dev/docs/kubernetes/latest/setup/customize/customize
#
# ── Sampling ────────────────────────────────────────────────────────────────
# randomSampling: true  →  CEL expression evaluates to true, meaning 100% of
#   root spans (requests without an incoming trace context) are sampled.
#   Default (false/unspecified) = no random sampling (0%).
# clientSampling: unset  →  defaults to 100% enabled, meaning requests that
#   already carry a trace context are fully sampled.
# Together this provides 100% trace coverage.
#
# ── Model Catalog ────────────────────────────────────────────────────────────
# modelCatalog references client ConfigMaps containing model cost catalog JSON
# (USD per 1M tokens per model). AgentGateway computes realized cost for every
# LLM request and exposes it in logs, traces, metrics, and CEL (llm.cost,
# llm.costRates). Cost data flows automatically to Langfuse via OTel traces.
#
# Flow:
#   AgentGateway Gateway ──OTLP gRPC (4317)──► OTel Collector ──OTLP HTTP──► Langfuse
# =============================================================================
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: infra-agentgateway-parameters
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: parameters
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  logging:
    # agent_llm WARN includes raw malformed provider bodies; request logs stay enabled.
    level: "info,agent_llm=error"
  env:
    - name: AGENTGATEWAY_DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: infra-agentgateway-database-secret
          key: password
  deployment:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: infra-agentgateway-database-secret
    {{- if .Values.aiGateway.enabled }}
    spec:
      template:
        metadata:
          annotations:
            # sensitiveHeaders is startup-only; enabling v6 must restart the proxy.
            neurwerk.com/ai-gateway-config: {{ include "infra-agentgateway.aiRevision" . | quote }}
    {{- end }}
  # AgentGateway otherwise generates a LoadBalancer Service. Keep its data plane
  # private so external traffic always enters through Traefik's HTTPS Gateway.
  service:
    spec:
      type: ClusterIP
      ports:
        - name: admin
          port: 15000
          targetPort: 15000
          protocol: TCP
  {{- $modelCatalogSources := .Values.infraAgentgatewayWrapper.modelCatalog.sources | default list }}
  {{- if $modelCatalogSources }}
  modelCatalog:
    sources:
      {{- toYaml $modelCatalogSources | nindent 6 }}
  {{- end }}
  rawConfig:
    frontendPolicies:
      accessLog:
        database:
          llm: metadata
          {{- if .Values.aiGateway.enabled }}
          add:
            {{- include "infra-agentgateway.aiTelemetry" . | nindent 12 }}
          {{- end }}
        {{- if .Values.aiGateway.enabled }}
        add:
          {{- include "infra-agentgateway.aiTelemetry" . | nindent 10 }}
        {{- end }}
      {{- if .Values.guardrails.llmPolicyEngine.enabled }}
      http:
        maxBufferSize: {{ if .Values.docling.enabled }}67108864{{ else }}{{ int .Values.guardrails.llmPolicyEngine.maxBufferSize }}{{ end }}
      {{- end }}
    config:
      adminAddr: "0.0.0.0:15000"
      {{- if .Values.aiGateway.enabled }}
      sensitiveHeaders: [x-neurwerk-authorization, x-neurwerk-credential-mode, x-api-key, x-goog-api-key, cookie, set-cookie]
      {{- end }}
      standardAttributes:
        user: >-
          has(jwt.sub)
            ? jwt.sub
            : (has(extauthz.principal_id) ? extauthz.principal_id : "")
      logging:
        database:
          url: "postgresql://agentgateway:${AGENTGATEWAY_DATABASE_PASSWORD}@postgres-operations.infra-postgres-operations.svc.cluster.local:5432/agentgateway?sslmode=disable"
          maxConnections: 5
      {{- if .Values.infraAgentgatewayWrapper.tracing }}
    {{- $fields := deepCopy (.Values.infraAgentgatewayWrapper.tracing.fields | default dict) }}
    {{- $add := get $fields "add" | default dict }}
    {{- $llmInput := include "infra-agentgateway.llmTraceInput" . }}
    {{- $llmOutput := include "infra-agentgateway.llmTraceOutput" . }}
    {{- $traceEnabled := `extproc != null && "neurwerk.request_context" in extproc && has(extproc["neurwerk.request_context"].content_tracing_enabled) && extproc["neurwerk.request_context"].content_tracing_enabled` }}
    {{- range $field, $expression := include "infra-agentgateway.aiTelemetry" . | fromYaml }}
    {{- $_ := set $add $field $expression }}
    {{- end }}
    {{- range $field := list "gen_ai.prompt" "gen_ai.completion" }}
    {{- $content := ternary $llmInput $llmOutput (eq $field "gen_ai.prompt") }}
    {{- $_ := set $add $field (printf `(%s) ? %s : null` $traceEnabled $content) }}
    {{- end }}
    {{- $_ := set $add "langfuse.observation.input" (printf `has(mcp.tool.arguments) && (%s) ? flattenRecursive(mcp.tool.arguments) : null` $traceEnabled) }}
    {{- $_ := set $add "langfuse.observation.output" (printf `has(mcp.tool.result) && (%s) ? flattenRecursive(mcp.tool.result) : null` $traceEnabled) }}
    {{- $_ := set $add "gen_ai.usage.cost" `has(llm.cost) ? double(llm.cost.total) : null` }}
    {{- $_ := set $add "langfuse.session.id" `has(metadata.neurwerk_identity) && has(metadata.neurwerk_identity.request_id) ? metadata.neurwerk_identity.request_id : has(metadata.neurwerk_admission) && has(metadata.neurwerk_admission.request_id) ? metadata.neurwerk_admission.request_id : null` }}
    {{- $_ := set $add "langfuse.observation.metadata.requested_model" `extproc != null && "neurwerk.request_context" in extproc && has(extproc["neurwerk.request_context"].requested_model) ? extproc["neurwerk.request_context"].requested_model : null` }}
    {{- $_ := set $fields "add" $add }}
      tracing:
        otlpEndpoint: {{ .Values.infraAgentgatewayWrapper.tracing.otlpEndpoint | quote }}
        otlpProtocol: {{ .Values.infraAgentgatewayWrapper.tracing.otlpProtocol | quote }}
        randomSampling: {{ .Values.infraAgentgatewayWrapper.tracing.randomSampling }}
        {{- if $fields }}
        fields:
          {{- toYaml $fields | nindent 10 }}
        {{- end }}
      {{- end }}
