# =============================================================================
# AgentGateway LLM provider API keys Secrets
#
# Stores the provider API keys used by AgentGateway to authenticate with
# upstream LLM providers (OpenRouter, DeepSeek, etc.).
#
# The Authorization key is used as the Bearer token in upstream requests.
# Referenced by AgentgatewayBackend resources via spec.policies.auth.secretRef.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: infra-agentgateway-secret
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: provider-credentials
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
  annotations: {}
type: Opaque
stringData:
  # ── OpenRouter API key ──────────────────────────────────────────────────
  # AgentGateway sends this as the Authorization: Bearer <key> header
  # to OpenRouter (openrouter.ai).
  Authorization: {{ .Values.infraAgentgatewayWrapperSecrets.openrouterApiKey | default "" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: infra-agentgateway-deepseek-secret
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: deepseek-credentials
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
  annotations: {}
type: Opaque
stringData:
  # ── DeepSeek API key ───────────────────────────────────────────────────
  # AgentGateway sends this as the Authorization: Bearer <key> header
  # to DeepSeek (api.deepseek.com).
  Authorization: {{ .Values.infraAgentgatewayWrapperSecrets.deepseekApiKey | default "" | quote }}
{{- range .Values.mcp.servers | default list }}
{{- $serverName := .name }}
{{- $secretName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "secret") }}
{{- $mcpSecrets := $.Values.infraAgentgatewayWrapperSecrets.mcp | default dict }}
{{- $serverSecrets := index $mcpSecrets .name | default dict }}
{{- if $serverSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
    app.kubernetes.io/part-of: infra-agentgateway
  annotations: {}
type: Opaque
stringData:
  {{- $serverSecrets | toYaml | nindent 2 }}
{{- end }}
{{- end }}
