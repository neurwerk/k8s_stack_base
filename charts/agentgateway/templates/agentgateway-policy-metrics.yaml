apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: infra-agentgateway-ux-metrics
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: ux-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra-agentgateway-gateway
      sectionName: api-bindings
  frontend:
    metrics:
      attributes:
        add:
          # Stable, trusted dimensions only: never request IDs, headers or payloads.
          {{- range $field := list "principal_id" "app_id" "credential_id" "credential_kind" "entry_mode" "policy_revision" }}
          - name: studio_{{ $field }}
            expression: >-
              has(metadata.neurwerk_identity) && has(metadata.neurwerk_identity.{{ $field }})
              ? metadata.neurwerk_identity.{{ $field }} : ""
          {{- end }}
          {{- range $field := list "destination_kind" "destination_id" "provider_id" "binding_id" "protocol_profile" "operation_id" "provider_credential_source" "billing_classification" }}
          - name: studio_{{ $field }}
            expression: >-
              has(metadata.neurwerk_admission) && has(metadata.neurwerk_admission.{{ $field }})
              ? metadata.neurwerk_admission.{{ $field }} : ""
          {{- end }}
          # Serialized request size is a stable prompt-complexity proxy across
          # providers whose token usage and cache accounting differ.
          - name: request_size
            expression: >-
              !has(request.body) ? "unknown" :
              size(request.body) <= 4096 ? "0-4KiB" :
              size(request.body) <= 16384 ? "4-16KiB" :
              size(request.body) <= 65536 ? "16-64KiB" :
              size(request.body) <= 262144 ? "64-256KiB" :
              size(request.body) <= 1048576 ? "256KiB-1MiB" :
              size(request.body) <= 5242880 ? "1-5MiB" : "5MiB+"
          - name: llm_streaming
            expression: >-
              !has(llm.streaming) ? "unknown" : llm.streaming ? "true" : "false"
