# =============================================================================
# AgentGateway Internal Gateway (agentgateway class)
#
# Handles JWT/API key authentication and LLM provider routing via
# AgentgatewayPolicy. TLS is terminated externally by the Traefik Gateway
# (infra-agentgateway-external-gateway), so this listener uses plain HTTP.
#
# ── Tracing ─────────────────────────────────────────────────────────────────
# To enable OTLP tracing from the data plane proxy, the AgentgatewayParameters
# resource (agentgateway-parameters.yaml) is linked via the Gateway's
# spec.infrastructure.parametersRef. Without this reference, tracing config
# (otlpEndpoint, sampling, fields) is never pushed to the proxy.
# See: https://agentgateway.dev/docs/kubernetes/latest/setup/customize/customize
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra-agentgateway-gateway
  namespace: infra-agentgateway
  {{- if and .Values.aiGateway.enabled .Values.aiGateway.proxy.enabled }}
  annotations:
    agentgateway.dev/internal-ports: "443"
  {{- end }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      name: infra-agentgateway-parameters
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    - name: websecure
      port: {{ .Values.infraAgentgatewayWrapper.ports.service.http }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
          - group: agentgateway.dev
            kind: AgentgatewayModel
    {{- if .Values.internalRagEmbedding.enabled }}
    - name: internal-rag-embedding
      port: {{ required "internalRagEmbedding.listenerPort is required when internalRagEmbedding is enabled" .Values.internalRagEmbedding.listenerPort }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: agentgateway.dev
            kind: AgentgatewayModel
    {{- end }}
    {{- if .Values.aiGateway.enabled }}
    - name: api-bindings
      port: {{ .Values.aiGateway.apiPort }}
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
        kinds:
          - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    {{- if .Values.aiGateway.proxy.enabled }}
    - name: forward-proxy
      port: {{ .Values.aiGateway.proxy.port }}
      hostname: {{ .Values.aiGateway.proxy.hostname | quote }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {kind: Secret, name: {{ .Values.aiGateway.proxy.tlsSecretName | quote }}}
      allowedRoutes:
        namespaces: {from: Same}
    {{- range include "infra-agentgateway.aiBindings" . | fromJsonArray }}
    {{- if .inspect }}
    - name: inspect-{{ .id }}
      port: 443
      hostname: {{ .host | quote }}
      protocol: HTTPS
      tls:
        mode: Terminate
        options:
          agentgateway.dev/tls-certificate-source: DYNAMIC_CA
        certificateRefs:
          - {kind: Secret, name: {{ $.Values.aiGateway.proxy.signerSecretName | quote }}}
      allowedRoutes:
        namespaces: {from: Same}
        kinds:
          - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
