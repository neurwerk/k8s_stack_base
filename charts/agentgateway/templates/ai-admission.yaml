{{- if .Values.aiGateway.enabled }}
{{- $bindings := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- $revision := include "infra-agentgateway.aiRevision" . }}
{{- $apiBindings := list }}
{{- $listeners := list }}
{{- range $binding := $bindings }}
{{- if $binding.api }}{{ $apiBindings = append $apiBindings $binding }}{{ end }}
{{- if $binding.inspect }}{{ $listeners = append $listeners (dict "name" (printf "inspect-%s" $binding.id) "mode" "forward_proxy" "bindings" (list $binding)) }}{{ end }}
{{- end }}
{{- if (index .Values "mcp-servers").enabled }}
{{- range $server := include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if or (not $server.contextforge) (has $server.name (index $.Values "mcp-servers").contextforgeRoutesEnabled) }}
{{- $apiBindings = append $apiBindings (dict "id" (printf "mcp-%s" $server.name) "prefix" "/mcp" "kind" "mcp" "providerId" nil "local" true "credentialSources" (list "none") "credentialHeader" "" "requiredPermission" (printf "mcp:%s:invoke" $server.name) "operations" (list (dict "profile" "mcp-streamable-http-v1" "id" "exchange" "paths" (list (printf "/%s" $server.name))))) }}
{{- end }}
{{- end }}
{{- end }}
{{- $listeners = prepend $listeners (dict "name" "api-bindings" "mode" "api" "bindings" $apiBindings) }}
{{- $approvedOidc := include "infra-agentgateway.approvedOidcAuthorization" (dict "root" . "bindings" $apiBindings) }}
{{- $discoveryPath := `request.path.endsWith("/v1/models") || request.path.contains("/v1/models/")` }}
{{- range $listener := $listeners }}
{{- $proxy := eq $listener.mode "forward_proxy" }}
{{- $credential := ternary "proxy-authorization" "x-neurwerk-authorization" $proxy }}
{{- $headers := ternary "source.connectHeaders" "request.headers" $proxy }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-admission-{{ $listener.name }}
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: infra-agentgateway-gateway, sectionName: {{ $listener.name }}}
  traffic:
    phase: PreRouting
    {{- if not $proxy }}
    jwtAuthentication:
      mode: Permissive
      location:
        # Standard OIDC clients send only Authorization; override-provider calls
        # use the separate Neurwerk header. Expression extraction never removes
        # provider Authorization. The admitted branch strips employee credentials.
        expression: >-
          ("x-neurwerk-authorization" in request.headers
          ? (size(request.headers.raw()["x-neurwerk-authorization"]) == 1 && request.headers["x-neurwerk-authorization"].startsWith("Bearer ") ? request.headers["x-neurwerk-authorization"].substring(7) : "")
          : (!("x-neurwerk-credential-mode" in request.headers) && "authorization" in request.headers && size(request.headers.raw()["authorization"]) == 1 && request.headers["authorization"].startsWith("Bearer ") ? request.headers["authorization"].substring(7) : ""))
      providers:
        - issuer: {{ printf "https://%s/realms/%s" $.Values.authKeycloak.hostname $.Values.authKeycloak.realm | quote }}
          audiences: {{ $.Values.infraAgentgatewayWrapper.jwtAuth.allowedAudiences | toJson }}
          jwks:
            remote:
              backendRef:
                name: auth-keycloak-keycloak-service
                namespace: auth-keycloak
                port: 80
              jwksPath: {{ printf "/realms/%s/protocol/openid-connect/certs" $.Values.authKeycloak.realm | quote }}
              cacheDuration: "5m"
    {{- end }}
    extAuth:
      conditional:
        - condition: {{ ternary "true" "!has(jwt.sub)" $proxy | squote }}
          policy:
            backendRef:
              group: agentgateway.dev
              kind: AgentgatewayBackend
              name: infra-agentgateway-extauth-apikey-bridge-backend
            http:
              path: {{ ternary `"/validate/proxy"` `"/validate/neurwerk"` $proxy | squote }}
              # Employee identity comes only from the dedicated header.
              allowedRequestHeaders: [content-type]
              addRequestHeaders:
                x-request-id: 'uuid()'
                {{ $credential }}: {{ printf `%q in %s && size(%s.raw()[%q]) == 1 ? %s[%q] : ""` $credential $headers $headers $credential $headers $credential | squote }}
              responseMetadata:
                request_id: 'response.headers["x-request-id"]'
                {{- range $field := list "contract_version" "principal_id" "permissions" "credential_id" "credential_kind" "account_email" }}
                {{ $field }}: {{ printf `json(response.headers["x-agentgateway-auth-context"]).%s` $field | squote }}
                {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - >-
            ((has(jwt.sub) && type(jwt.sub) == string && size(jwt.sub) > 0 &&
            has(jwt.azp) && (jwt.azp == "agentgateway" ||
            (jwt.azp == {{ $.Values.authKeycloak.studioClientId | default "studio" | toJson }} && has(jwt.realm_access.roles) && "studio-user" in jwt.realm_access.roles){{ if not $proxy }} || {{ $approvedOidc }}{{ end }}) &&
            has(jwt.resource_access.agentgateway.roles) && type(jwt.resource_access.agentgateway.roles) == list &&
            "llm:invoke" in jwt.resource_access.agentgateway.roles) ||
            (!has(jwt.sub) && extauthz.contract_version == 1 && type(extauthz.principal_id) == string && size(extauthz.principal_id) > 0 &&
            type(extauthz.credential_id) == string && size(extauthz.credential_id) > 0 &&
            extauthz.credential_kind in ["personal", "managed"] &&
            type(extauthz.permissions) == list && size(extauthz.permissions) <= 256 &&
            extauthz.permissions.all(p, type(p) == string && size(p) > 0 && size(p) <= 256 && extauthz.permissions.filter(q, q == p).size() == 1) &&
            "llm:invoke" in extauthz.permissions)) &&
            !("upgrade" in request.headers)
            {{- if not $proxy }}
            && ("x-neurwerk-authorization" in request.headers ? size(request.headers.raw()["x-neurwerk-authorization"]) == 1 : has(jwt.sub))
            && (!("x-neurwerk-credential-mode" in request.headers) ||
            (size(request.headers.raw()["x-neurwerk-credential-mode"]) == 1 &&
            request.headers["x-neurwerk-credential-mode"].matches("^[ \\t]*(global|none|override)[ \\t]*$") &&
            "x-neurwerk-authorization" in request.headers &&
            !("proxy-authorization" in request.headers) &&
            !("cookie" in request.headers) &&
            (({{ include "infra-agentgateway.selectedCredentialSource" $ }}) == "override" ?
            ["authorization", "x-api-key", "x-goog-api-key", "api-key"].all(h, !(h in request.headers) ||
            (size(request.headers.raw()[h]) == 1 && request.headers[h].matches(h == "authorization" ? "^[Bb][Ee][Aa][Rr][Ee][Rr] +[A-Za-z0-9._~+/-]+=*$" : "^[A-Za-z0-9._~+/-]+=*$"))) :
            (!["x-api-key", "x-goog-api-key", "api-key"].exists(h, h in request.headers) &&
            (!("authorization" in request.headers) || (size(request.headers.raw()["authorization"]) == 1 &&
            request.headers["authorization"].matches("^[Bb][Ee][Aa][Rr][Ee][Rr] +[A-Za-z0-9._~+/-]+=*$")))))))
            {{- end }}
            {{- if $proxy }}
            && request.host in {{ list (first $listener.bindings).host (printf "%s:443" (first $listener.bindings).host) | toJson }}
            && !("x-neurwerk-credential-mode" in request.headers)
            && !("x-neurwerk-credential-mode" in source.connectHeaders)
            {{- end }}
    {{- if $listener.bindings }}
    transformation:
      conditional:
        {{- if not $proxy }}
        {{- range $variant := list "oidc" "dedicated" "selected" }}
        - condition: {{ printf `request.method == "GET" && (%s) && %s(has(jwt.sub) && !("x-neurwerk-authorization" in request.headers)) && %s("x-neurwerk-credential-mode" in request.headers)` $discoveryPath (ternary "" "!" (eq $variant "oidc")) (ternary "" "!" (eq $variant "selected")) | squote }}
          policy:
            request:
              metadata:
                neurwerk_identity: >-
                  {{- include "infra-agentgateway.sharedIdentity" (dict "mode" $listener.mode "revision" $revision "discovery" true) | nindent 18 }}
              set:
                - name: x-request-id
                  value: 'metadata.neurwerk_identity.request_id'
                {{- if eq $variant "selected" }}
                - name: x-neurwerk-credential-mode
                  value: 'metadata.neurwerk_identity.provider_credential_source'
                {{- end }}
              remove:
                {{- if ne $variant "oidc" }}
                - authorization
                {{- else }}
                - x-neurwerk-authorization
                {{- end }}
                - proxy-authorization
                - cookie
                - x-user-id
                - x-auth-user
                - x-auth-app
                - x-auth-permissions
                - x-agentgateway-permissions
                - x-agentgateway-auth-context
                - x-contextforge-account-email
                - x-remote-allowed
                - x-route-class
                - x-api-key
                - x-goog-api-key
                {{- if eq $variant "selected" }}
                - api-key
                {{- end }}
            response:
              set:
                - name: x-request-id
                  value: 'metadata.neurwerk_identity.request_id'
              remove: [authorization, proxy-authorization, x-neurwerk-authorization, x-api-key, x-goog-api-key, set-cookie, x-agentgateway-auth-context, x-neurwerk-credential-mode]
        {{- end }}
        {{- end }}
        {{- $variants := list "dedicated" }}
        {{- if not $proxy }}{{ $variants = list "oidc" "dedicated" "selected-strip" }}{{ end }}
        {{- range $variant := $variants }}
        {{- $condition := "true" }}
        {{- if not $proxy }}{{ $condition = printf `!(request.method == "GET" && (%s))` $discoveryPath }}{{ end }}
        {{- if not $proxy }}{{ $condition = printf `%s && %s(has(jwt.sub) && !("x-neurwerk-authorization" in request.headers))` $condition (ternary "" "!" (eq $variant "oidc")) }}{{ end }}
        {{- if not $proxy }}
        {{- $strip := printf `("x-neurwerk-credential-mode" in request.headers && (%s) in ["global", "none"])` (include "infra-agentgateway.selectedCredentialSource" $) }}
        {{- $condition = printf `%s && %s%s` $condition (ternary "" "!" (eq $variant "selected-strip")) $strip }}
        {{- end }}
        - condition: {{ $condition | squote }}
          policy:
            request:
              metadata:
                neurwerk_identity: >-
                  {{- include "infra-agentgateway.sharedIdentity" (dict "mode" $listener.mode "revision" $revision) | nindent 18 }}
              set:
                - name: x-request-id
                  value: 'metadata.neurwerk_identity.request_id'
              remove:
                - x-neurwerk-authorization
                - proxy-authorization
                - cookie
                - x-user-id
                - x-auth-user
                - x-auth-app
                - x-auth-permissions
                - x-agentgateway-permissions
                - x-agentgateway-auth-context
                - x-contextforge-account-email
                - x-remote-allowed
                - x-route-class
                {{- if or (eq $variant "oidc") (eq $variant "selected-strip") }}
                - authorization
                {{- end }}
                {{- if not $proxy }}
                - x-neurwerk-credential-mode
                {{- end }}
            response:
              set:
                - name: x-request-id
                  value: 'metadata.neurwerk_identity.request_id'
              remove: [authorization, proxy-authorization, x-neurwerk-authorization, x-api-key, x-goog-api-key, set-cookie, x-agentgateway-auth-context, x-neurwerk-credential-mode]
        {{- end }}
    {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-route-default-deny-{{ $listener.name }}
  namespace: infra-agentgateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: infra-agentgateway-gateway, sectionName: {{ $listener.name }}}
  traffic:
    phase: PostRouting
    authorization:
      action: Allow
      policy:
        matchExpressions: ['false']
{{- end }}
{{- end }}
