{{- if .Values.aiGateway.enabled }}
{{- $bindings := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- $revision := include "infra-agentgateway.aiRevision" . }}
{{- $apiBindings := list }}
{{- $listeners := list }}
{{- range $binding := $bindings }}
{{- if $binding.api }}{{ $apiBindings = append $apiBindings $binding }}{{ end }}
{{- if $binding.inspect }}{{ $listeners = append $listeners (dict "name" (printf "inspect-%s" $binding.id) "mode" "forward_proxy" "bindings" (list $binding)) }}{{ end }}
{{- end }}
{{- $listeners = prepend $listeners (dict "name" "api-bindings" "mode" "api" "bindings" $apiBindings) }}
{{- range $listener := $listeners }}
{{- $proxy := eq $listener.mode "forward_proxy" }}
{{- $credential := ternary "proxy-authorization" "x-neurwerk-authorization" $proxy }}
{{- $headers := ternary "source.connectHeaders" "request.headers" $proxy }}
{{- $matches := list }}
{{- range $binding := $listener.bindings }}
{{- $paths := list }}
{{- range $operation := $binding.operations }}
{{- range $path := $operation.paths }}
{{- if not $proxy }}{{ $path = printf "%s%s" $binding.prefix $path }}{{ end }}
{{- $paths = append $paths $path }}
{{- end }}
{{- end }}
{{- $matches = append $matches (printf `(request.path in %s && (%s))` ($paths | toJson) (include "infra-agentgateway.aiCredentialAuthorization" $binding)) }}
{{- end }}
{{- $allowed := join " || " $matches | default "false" }}
{{- if gt (len $allowed) 14000 }}{{ fail "binding operation allowlist exceeds native authorization expression bounds" }}{{ end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-admission-{{ $listener.name }}
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: infra-agentgateway-gateway, sectionName: {{ $listener.name }}}
  traffic:
    phase: PreRouting
    extAuth:
      backendRef:
        group: agentgateway.dev
        kind: AgentgatewayBackend
        name: infra-agentgateway-extauth-apikey-bridge-backend
      http:
        path: {{ ternary `"/validate/proxy"` `"/validate/neurwerk"` $proxy | squote }}
        # Empty defaults to Authorization; simple allowlists collapse duplicates.
        allowedRequestHeaders: [content-type]
        addRequestHeaders:
          {{ $credential }}: {{ printf `%q in %s && size(%s.raw()[%q]) == 1 ? %s[%q] : ""` $credential $headers $headers $credential $headers $credential | squote }}
        responseMetadata:
          {{- range $field := list "contract_version" "principal_id" "permissions" "credential_id" "credential_kind" }}
          {{ $field }}: {{ printf `json(response.headers["x-agentgateway-auth-context"]).%s` $field | squote }}
          {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - >-
            extauthz.contract_version == 1 && type(extauthz.principal_id) == string && size(extauthz.principal_id) > 0 &&
            type(extauthz.credential_id) == string && size(extauthz.credential_id) > 0 &&
            extauthz.credential_kind in ["personal", "managed"] &&
            type(extauthz.permissions) == list && size(extauthz.permissions) <= 256 &&
            extauthz.permissions.all(p, type(p) == string && size(p) > 0 && size(p) <= 256 && extauthz.permissions.filter(q, q == p).size() == 1) &&
            "llm:invoke" in extauthz.permissions && request.method == "POST" &&
            ({{ $allowed }}) && !("upgrade" in request.headers)
            {{- if $proxy }}
            && request.host in {{ list (first $listener.bindings).host (printf "%s:443" (first $listener.bindings).host) | toJson }}
            {{- end }}
    {{- if $listener.bindings }}
    transformation:
      conditional:
        {{- range $binding := $listener.bindings }}
        {{- range $operation := $binding.operations }}
        {{- $paths := list }}
        {{- range $path := $operation.paths }}
        {{- if not $proxy }}{{ $path = printf "%s%s" $binding.prefix $path }}{{ end }}
        {{- $paths = append $paths $path }}
        {{- end }}
        - condition: {{ printf `request.path in %s` ($paths | toJson) | squote }}
          policy:
            request:
              metadata:
                # Generated once after authentication, before the route extProc.
                neurwerk_admission: >-
                  {"request_id": uuid(), "principal_id": extauthz.principal_id,
                  "credential_context_version": "1", "credential_id": extauthz.credential_id,
                  "credential_kind": extauthz.credential_kind, "permissions": extauthz.permissions,
                  "entry_mode": {{ $listener.mode | toJson }}, "destination_kind": "model",
                  "provider_id": {{ $binding.providerId | toJson }}, "binding_id": {{ $binding.id | toJson }},
                  "protocol_profile": {{ $operation.profile | toJson }}, "operation_id": {{ $operation.id | toJson }},
                  "provider_credential_source": ({{ include "infra-agentgateway.aiCredentialSource" $binding }}),
                  "policy_revision": {{ $revision | toJson }}}
              remove:
                - x-neurwerk-authorization
                - proxy-authorization
                - cookie
                - x-user-id
                - x-auth-user
                - x-auth-app
                - x-auth-permissions
                - x-agentgateway-permissions
                - x-agentgateway-auth-context
                - x-remote-allowed
                - x-route-class
                {{- range $header := list "authorization" "x-api-key" "x-goog-api-key" }}
                {{- if or $binding.local (ne $header $binding.credentialHeader) }}
                - {{ $header }}
                {{- end }}
                {{- end }}
            response:
              remove: [authorization, proxy-authorization, x-neurwerk-authorization, x-api-key, x-goog-api-key, set-cookie, x-agentgateway-auth-context]
        {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
