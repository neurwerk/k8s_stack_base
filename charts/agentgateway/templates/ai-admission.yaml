{{- if .Values.aiGateway.enabled }}
{{- $bindings := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- $revision := include "infra-agentgateway.aiRevision" . }}
{{- $listeners := list }}
{{- $apiBindings := list }}
{{- $apiEntries := list }}
{{- range $binding := $bindings }}
{{- if $binding.api }}{{ $apiBindings = append $apiBindings $binding }}{{ end }}
{{- range $binding.apiEntries }}{{ $apiEntries = append $apiEntries (merge (deepCopy .) (dict "credentialHeader" $binding.credentialHeader)) }}{{ end }}
{{- if $binding.inspect }}
{{- $listeners = append $listeners (dict "name" (printf "inspect-%s" $binding.id) "mode" "forward_proxy" "host" $binding.host "entries" (list (dict "prefix" "/" "source" "override" "identityHeader" "proxy-authorization" "credentialHeader" $binding.credentialHeader))) }}
{{- end }}
{{- end }}
{{- $apiEntries = append $apiEntries (dict "prefix" "/mcp" "source" "none" "identityHeader" "authorization" "credentialHeader" "") }}
{{- if (index .Values "mcp-servers").enabled }}
{{- range $server := include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if or (not $server.contextforge) (has $server.name (index $.Values "mcp-servers").contextforgeRoutesEnabled) }}
{{- $apiBindings = append $apiBindings (dict "id" (printf "mcp-%s" $server.name)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $groups := dict }}
{{- range $entry := $apiEntries }}
{{- $key := printf "%s-%s" $entry.source $entry.credentialHeader }}
{{- if eq $entry.source "none" }}{{ $key = "none" }}{{ end }}
{{- if eq $entry.source "global" }}{{ $key = "global" }}{{ end }}
{{- if not (hasKey $groups $key) }}{{ $_ := set $groups $key (merge (dict "paths" list) (deepCopy $entry)) }}{{ end }}
{{- $group := get $groups $key }}
{{- $_ := set $group "paths" (append $group.paths (printf "%s/" $entry.prefix)) }}
{{- end }}
{{- $grouped := list }}
{{- range $key := keys $groups | sortAlpha }}{{ $grouped = append $grouped (get $groups $key) }}{{ end }}
{{- $listeners = prepend $listeners (dict "name" "api-bindings" "mode" "api" "entries" $grouped) }}
{{- $approvedOidc := include "infra-agentgateway.approvedOidcAuthorization" (dict "root" . "bindings" $apiBindings) }}
{{- $identityHeader := include "infra-agentgateway.identityHeader" . }}
{{- range $listener := $listeners }}
{{- $proxy := eq $listener.mode "forward_proxy" }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-admission-{{ $listener.name }}
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" $ | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: infra-agentgateway-gateway, sectionName: {{ $listener.name }}}
  traffic:
    phase: PreRouting
    {{- if not $proxy }}
    jwtAuthentication:
      mode: Permissive
      location:
        expression: >-
          {{ include "infra-agentgateway.validBearer" $identityHeader }} ? request.headers[{{ $identityHeader }}].substring(7) : ""
      providers:
        - issuer: {{ printf "https://%s/realms/%s" $.Values.authKeycloak.hostname $.Values.authKeycloak.realm | quote }}
          audiences: {{ $.Values.infraAgentgatewayWrapper.jwtAuth.allowedAudiences | toJson }}
          jwks:
            remote:
              backendRef:
                name: auth-keycloak-keycloak-service
                namespace: auth-keycloak
                port: 80
              jwksPath: {{ printf "/realms/%s/protocol/openid-connect/certs" $.Values.authKeycloak.realm | quote }}
              cacheDuration: "5m"
    {{- end }}
    extAuth:
      conditional:
        - condition: {{ ternary "true" "!has(jwt.sub)" $proxy | squote }}
          policy:
            backendRef:
              group: agentgateway.dev
              kind: AgentgatewayBackend
              name: infra-agentgateway-extauth-apikey-bridge-backend
            http:
              path: {{ ternary `"/validate/proxy"` `"/validate/neurwerk"` $proxy | squote }}
              allowedRequestHeaders: [content-type]
              addRequestHeaders:
                x-request-id: 'uuid()'
                {{- if $proxy }}
                proxy-authorization: '"proxy-authorization" in source.connectHeaders && size(source.connectHeaders.raw()["proxy-authorization"]) == 1 ? source.connectHeaders["proxy-authorization"] : ""'
                {{- else }}
                authorization: {{ printf `%s ? "Bearer " + request.headers[%s].substring(7) : ""` (include "infra-agentgateway.validBearer" $identityHeader) $identityHeader | squote }}
                {{- end }}
              responseMetadata:
                request_id: 'response.headers["x-request-id"]'
                {{- range $field := list "contract_version" "principal_id" "permissions" "credential_id" "credential_kind" "account_email" }}
                {{ $field }}: {{ printf `json(response.headers["x-agentgateway-auth-context"]).%s` $field | squote }}
                {{- end }}
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - >-
            ((has(jwt.sub) && type(jwt.sub) == string && size(jwt.sub) > 0 &&
            has(jwt.typ) && jwt.typ == "Bearer" &&
            has(jwt.azp) && (jwt.azp == "agentgateway" ||
            (jwt.azp == {{ $.Values.authKeycloak.studioClientId | default "studio" | toJson }} && has(jwt.realm_access.roles) && "studio-user" in jwt.realm_access.roles){{ if not $proxy }} || {{ $approvedOidc }}{{ end }}) &&
            has(jwt.resource_access.agentgateway.roles) && type(jwt.resource_access.agentgateway.roles) == list &&
            "llm:invoke" in jwt.resource_access.agentgateway.roles) ||
            (!has(jwt.sub) && extauthz.contract_version == 1 && type(extauthz.principal_id) == string && size(extauthz.principal_id) > 0 &&
            type(extauthz.credential_id) == string && size(extauthz.credential_id) > 0 &&
            extauthz.credential_kind in ["personal", "managed"] &&
            type(extauthz.permissions) == list && size(extauthz.permissions) <= 256 &&
            extauthz.permissions.all(p, type(p) == string && size(p) > 0 && size(p) <= 256 && extauthz.permissions.filter(q, q == p).size() == 1) &&
            "llm:invoke" in extauthz.permissions)) && !("upgrade" in request.headers)
            {{- if $proxy }}
            && request.host in {{ list $listener.host (printf "%s:443" $listener.host) | toJson }}
            {{- end }}
    transformation:
      conditional:
        {{- range $entry := $listener.entries }}
        {{- $path := "true" }}
        {{- if not $proxy }}{{ $path = printf `%s.exists(p, request.path.startsWith(p))` ($entry.paths | toJson) }}{{ end }}
        {{- $discovery := `request.method == "GET" && (request.path.endsWith("/v1/models") || request.path.contains("/v1/models/"))` }}
        {{- range $variant := list "discovery" "provider" "strip" }}
        {{- if and (eq $variant "provider") (ne $entry.source "override") }}{{ continue }}{{ end }}
        {{- $preserve := "" }}
        {{- $condition := $path }}
        {{- if eq $variant "discovery" }}
        {{- if $proxy }}{{ continue }}{{ end }}
        {{- $condition = printf "%s && (%s)" $path $discovery }}
        {{- else }}
        {{- if not $proxy }}{{ $condition = printf "%s && !(%s)" $path $discovery }}{{ end }}
        {{- $valid := "false" }}
        {{- if eq $entry.source "override" }}{{ $valid = include "infra-agentgateway.validProvider" $entry.credentialHeader }}{{ end }}
        {{- $condition = printf "%s && %s(%s)" $condition (ternary "" "!" (eq $variant "provider")) $valid }}
        {{- if eq $variant "provider" }}{{ $preserve = $entry.credentialHeader }}{{ end }}
        {{- end }}
        - condition: {{ $condition | squote }}
          policy:
            request:
              metadata:
                neurwerk_identity: >-
                  {{- include "infra-agentgateway.sharedIdentity" (dict "mode" $listener.mode "revision" $revision "source" $entry.source "identityHeader" $entry.identityHeader "preserve" $preserve) | nindent 18 }}
              set:
                - name: x-request-id
                  value: 'metadata.neurwerk_identity.request_id'
                {{- if eq $variant "discovery" }}
                - name: authorization
                  value: {{ printf `"Bearer " + request.headers[%q].substring(7)` $entry.identityHeader | squote }}
                {{- end }}
              remove:
                {{- range $header := list "authorization" "authorization-neurwerk" "x-neurwerk-authorization" "x-neurwerk-credential-mode" "proxy-authorization" "cookie" "x-api-key" "x-goog-api-key" "api-key" "x-user-id" "x-auth-user" "x-auth-app" "x-auth-permissions" "x-agentgateway-permissions" "x-agentgateway-auth-context" "x-contextforge-account-email" }}
                {{- if and (ne $header $preserve) (not (and (eq $variant "discovery") (eq $header "authorization"))) }}
                - {{ $header }}
                {{- end }}
                {{- end }}
            response:
              set:
                - name: x-request-id
                  value: 'metadata.neurwerk_identity.request_id'
              remove: [authorization, authorization-neurwerk, proxy-authorization, x-neurwerk-authorization, x-api-key, x-goog-api-key, api-key, set-cookie, x-agentgateway-auth-context, x-neurwerk-credential-mode]
        {{- end }}
        {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-route-default-deny-{{ $listener.name }}
  namespace: infra-agentgateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: infra-agentgateway-gateway, sectionName: {{ $listener.name }}}
  traffic:
    phase: PostRouting
    headerModifiers:
      request:
        remove: [x-user-id, x-auth-user, x-auth-app, x-auth-permissions, x-agentgateway-permissions, x-agentgateway-auth-context, x-contextforge-account-email, x-remote-allowed, x-route-class]
    authorization:
      action: Allow
      policy:
        matchExpressions: ['false']
{{- end }}
{{- end }}
