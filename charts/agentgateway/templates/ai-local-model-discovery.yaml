{{- $discovery := .Values.aiGateway.localModelDiscovery | default dict }}
{{- if $discovery.enabled }}
{{- $_ := include "infra-agentgateway.aiBindings" . }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ai-local-model-discovery-backend
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" . | nindent 4 }}
spec:
  static:
    host: frontend-studio-api-service.frontend-studio.svc.cluster.local
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-local-model-discovery
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" . | nindent 4 }}
spec:
  parentRefs:
    - {name: infra-agentgateway-gateway, sectionName: api-bindings}
  rules:
    - matches:
        - method: GET
          path: {type: Exact, value: /local/api/v1/models}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /gateway/model-discovery
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: ai-local-model-discovery-backend}
    - matches:
        - method: GET
          path: {type: PathPrefix, value: /local/api/v1/models/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /gateway/model-discovery
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: ai-local-model-discovery-backend}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-local-model-discovery-processing
  namespace: infra-agentgateway
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: ai-local-model-discovery}
  traffic:
    phase: PostRouting
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - >-
            {{- include "infra-agentgateway.routeIdentityAuthorization" (dict "root" . "binding" (dict "id" $discovery.bindingId "kind" "model_discovery") "entry" (dict "mode" "api")) | nindent 12 }} &&
            metadata.neurwerk_identity.method == "GET" &&
            (metadata.neurwerk_identity.path == "/local/api/v1/models" ||
            (metadata.neurwerk_identity.path.startsWith("/local/api/v1/models/") && metadata.neurwerk_identity.path != "/local/api/v1/models/")) &&
            size(metadata.neurwerk_identity.provider_headers) == 0
    transformation:
      request:
        metadata:
          neurwerk_admission: >-
            {"request_id": metadata.neurwerk_identity.request_id,
            "principal_id": metadata.neurwerk_identity.principal_id,
            "credential_id": metadata.neurwerk_identity.credential_id,
            "credential_kind": metadata.neurwerk_identity.credential_kind,
            "permissions": metadata.neurwerk_identity.permissions,
            "entry_mode": "api", "destination_kind": "model_discovery",
            "binding_id": {{ $discovery.bindingId | toJson }},
            "policy_revision": metadata.neurwerk_identity.policy_revision}
{{- end }}
