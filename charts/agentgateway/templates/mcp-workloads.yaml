{{- if .Values.mcp.enabled }}
{{- $upstreams := include "infra-agentgateway.mcpUpstreamWorkloads" . | fromYamlArray }}
{{- $upstreamIds := dict }}
{{- range $upstreams }}{{- $_ := set $upstreamIds .name true }}{{- end }}
{{- range concat (include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray) $upstreams }}
{{- if .workload }}
{{- $serverName := .name }}
{{- $deploymentName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "deploy") }}
{{- $serviceName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "svc") }}
{{- $networkPolicyName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "netpol") }}
{{- $secretName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "secret") }}
{{- $server := . }}
{{- $managed := and $.Values.mcp.studioSetup.enabled .credential }}
{{- $record := dict }}
{{- if $managed }}
{{- $record = include "infra-agentgateway.mcpCredentialVersion" (dict "root" $ "id" $serverName) | fromYaml }}
{{- $secretName = include "infra-agentgateway.mcpCredentialName" (dict "id" $serverName "version" $record.version) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deploymentName }}
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  replicas: {{ if and $managed .credential.required (not $record.configured) }}0{{ else }}{{ .workload.replicas | default 1 }}{{ end }}
  {{- if $managed }}
  strategy:
    type: Recreate
    # Clear API-defaulted settings when switching an existing Deployment.
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-{{ $serverName }}
      app.kubernetes.io/instance: infra-agentgateway
  template:
    metadata:
      {{- if $managed }}
      annotations:
        mcp.neurwerk.com/key-version: {{ $record.version | quote }}
      {{- end }}
      labels:
        app.kubernetes.io/name: mcp-{{ $serverName }}
        app.kubernetes.io/instance: infra-agentgateway
        app.kubernetes.io/part-of: infra-agentgateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-{{ $serverName }}
          image: {{ required (printf "mcp server %q workload.image is required" .name) .workload.image | quote }}
          imagePullPolicy: {{ .workload.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .port | default 8080 }}
          env:
            {{- range $name, $value := .workload.env | default dict }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .workload.secretEnv | default list }}
            - name: {{ required (printf "mcp server %q secretEnv.name is required" $server.name) .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ required (printf "mcp server %q secretEnv.key is required" $server.name) .key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .workload.healthPath | default "/ping" | quote }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .workload.healthPath | default "/ping" | quote }}
              port: http
          resources:
            {{- .workload.resources | default dict | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
  ports:
    - name: http
      port: {{ .port | default 8080 }}
      targetPort: http
      appProtocol: agentgateway.dev/mcp
---
{{- if hasKey $upstreamIds $serverName }}
# Workloads remain private; a migrated upstream accepts only native ContextForge.
{{- else }}
# Workload-backed MCP servers are reachable only through the AgentGateway data
# plane. The ClusterIP Service is not a sufficient boundary on its own.
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $networkPolicyName }}
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-{{ $serverName }}
      app.kubernetes.io/instance: infra-agentgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if hasKey $upstreamIds $serverName }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: contextforge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: contextforge
              app.kubernetes.io/instance: contextforge
              app.kubernetes.io/component: application
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: infra-agentgateway-gateway
        {{- end }}
      ports:
        - port: {{ .port | default 8080 }}
          protocol: TCP
{{- if hasKey $upstreamIds $serverName }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $networkPolicyName }}-contextforge
  namespace: contextforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: contextforge
      app.kubernetes.io/instance: contextforge
      app.kubernetes.io/component: application
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: infra-agentgateway}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-{{ $serverName }}
              app.kubernetes.io/instance: infra-agentgateway
      ports:
        - {protocol: TCP, port: {{ .port | default 8080 }}}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
