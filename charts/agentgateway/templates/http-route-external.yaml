{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.infraAgentgatewayWrapper.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
{{- $prefixes := list }}
{{- range $binding := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- if $binding.api }}
{{- $prefixes = append $prefixes (ternary $binding.prefix "/bindings" (hasKey $binding "apiPath")) }}
{{- end }}
{{- end }}
{{- if .Values.mcp.enabled }}
{{- range $server := include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if or (not $server.contextforge) (has $server.name $.Values.mcp.contextforgeRoutesEnabled) }}
{{- $prefixes = append $prefixes "/bindings" }}
{{- end }}
{{- end }}
{{- end }}
{{- if $prefixes }}
# =============================================================================
# AgentGateway External HTTPRoute (on Traefik Gateway)
#
# Routes configured API and MCP prefixes for the client hostname from the external
# Traefik Gateway to the internal AgentGateway Envoy proxy.
# The envoy proxy (class: agentgateway) handles JWT/API key auth and
# LLM provider routing.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infra-agentgateway-external-httproute
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: external-httproute
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  parentRefs:
    - name: infra-agentgateway-external-gateway
      namespace: infra-agentgateway
      sectionName: websecure
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        {{- range $prefix := $prefixes | uniq | sortAlpha }}
        - path: {type: PathPrefix, value: {{ $prefix | quote }}}
        {{- end }}
      backendRefs:
        - name: infra-agentgateway-gateway
          namespace: infra-agentgateway
          port: {{ .Values.aiGateway.apiPort }}
{{- end }}
{{- end }}
