{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.infraAgentgatewayWrapper.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
{{- $prefixes := list }}
{{- range $binding := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- if $binding.api }}
{{- $prefixes = append $prefixes (ternary $binding.prefix "/bindings" (hasKey $binding "apiPath")) }}
{{- end }}
{{- end }}
{{- if (index .Values "mcp-servers").enabled }}
{{- range $server := include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if or (not $server.contextforge) (has $server.name (index $.Values "mcp-servers").contextforgeRoutesEnabled) }}
{{- $prefixes = append $prefixes "/mcp" }}
{{- end }}
{{- end }}
{{- end }}
{{- if $prefixes }}
{{- $studio := index .Values "frontendStudio" | default dict }}
{{- $studioConfig := index $studio "studio" | default dict }}
{{- $studioHostname := index $studioConfig "hostname" | default "" }}
{{- $studioCors := and $studioHostname (ne $studioHostname "place.holder") }}
{{- if $studioCors }}
{{- if not (regexMatch `^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$` $studioHostname) }}{{ fail "frontendStudio.studio.hostname must be an exact DNS name for gateway CORS" }}{{ end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: infra-agentgateway-studio-cors
  namespace: infra-agentgateway
spec:
  headers:
    accessControlAllowOriginList: [{{ printf "https://%s" $studioHostname | quote }}]
    accessControlAllowMethods: [GET, POST, DELETE, OPTIONS]
    accessControlAllowHeaders:
      - X-Neurwerk-Authorization
      - X-Neurwerk-Credential-Mode
      - Content-Type
      - Authorization
      - X-Api-Key
      - Anthropic-Version
      - Mcp-Protocol-Version
      - Mcp-Session-Id
      - Last-Event-Id
    accessControlAllowCredentials: false
    accessControlMaxAge: 600
    addVaryHeader: true
---
{{- end }}
# =============================================================================
# AgentGateway External HTTPRoute (on Traefik Gateway)
#
# Routes configured API and MCP prefixes for the client hostname from the external
# Traefik Gateway to the internal AgentGateway Envoy proxy.
# The envoy proxy (class: agentgateway) handles JWT/API key auth and
# LLM provider routing.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infra-agentgateway-external-httproute
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: external-httproute
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  parentRefs:
    - name: infra-agentgateway-external-gateway
      namespace: infra-agentgateway
      sectionName: websecure
  hostnames:
    - {{ $hostname }}
  rules:
    {{- range $chunk := chunk 64 ($prefixes | uniq | sortAlpha) }}
    - matches:
        {{- range $prefix := $chunk }}
        - path: {type: PathPrefix, value: {{ $prefix | quote }}}
        {{- end }}
      {{- if $studioCors }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: infra-agentgateway-studio-cors
      {{- end }}
      backendRefs:
        - name: infra-agentgateway-gateway
          namespace: infra-agentgateway
          port: {{ $.Values.aiGateway.apiPort }}
    {{- end }}
{{- end }}
{{- end }}
