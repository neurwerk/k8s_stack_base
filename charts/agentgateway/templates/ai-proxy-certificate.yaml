{{- if and .Values.aiGateway.enabled .Values.aiGateway.proxy.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentgateway-proxy-certificate
  namespace: infra-agentgateway
  labels:
    {{- include "infra-agentgateway.aiLabels" . | nindent 4 }}
spec:
  secretName: {{ .Values.aiGateway.proxy.tlsSecretName }}
  duration: 2160h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  dnsNames:
    - {{ .Values.aiGateway.proxy.hostname | quote }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ ternary "letsencrypt-production-cluster-issuer" "letsencrypt-staging-cluster-issuer" .Values.publicCertificates.useProduction }}
  usages:
    - digital signature
    - key encipherment
{{- end }}
