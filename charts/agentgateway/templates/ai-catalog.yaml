{{- if .Values.aiGateway.enabled }}
{{- $bindings := include "infra-agentgateway.aiBindings" . | fromJsonArray }}
{{- $revision := include "infra-agentgateway.aiRevision" . }}
{{- $profileMap := .Files.Get "catalog/ai-profiles.yaml" | fromYaml }}
{{- $profiles := list }}
{{- range $id := keys $profileMap | sortAlpha }}
{{- $profile := deepCopy (get $profileMap $id) }}
{{- $_ := unset $profile "path" }}{{- $_ := set $profile "id" $id }}
{{- $_ := unset $profile "providers" }}{{- $_ := unset $profile "credentialHeader" }}
{{- $profiles = append $profiles $profile }}
{{- end }}
{{- $profiles = append $profiles (dict "id" "legacy-model-api" "revision" "1" "operations" (list (dict "id" "create" "support" "unknown" "restoration_scope" "request" "limitations" (list "Existing company API compatibility; no new company-use grant is inferred."))) "limitations" (list "Existing JWT/API-key semantics remain on /v1.")) }}
{{- $profiles = append $profiles (dict "id" "legacy-mcp" "revision" "1" "operations" (list (dict "id" "tools" "support" "unknown" "restoration_scope" "request" "limitations" (list "Each configured MCP integration requires its own qualification."))) "limitations" (list "Existing stateless MCP contract.")) }}
{{- $endpoints := list }}{{- $destinations := list }}{{- $modelDestinations := dict }}
{{- $origin := printf "https://%s" .Values.infraAgentgatewayWrapper.hostname }}
{{- range $binding := $bindings }}
{{- $endpointIds := list }}
{{- if $binding.api }}
{{- $_ := required "API catalog endpoints require infraAgentgatewayWrapper.hostname" $.Values.infraAgentgatewayWrapper.hostname }}
{{- $id := printf "api-%s" $binding.id }}
{{- $endpointIds = append $endpointIds $id }}
{{- $endpoints = append $endpoints (dict "id" $id "url" (printf "%s%s/v1" $origin $binding.prefix) "entry_mode" "api" "caller_auth_modes" (list "neurwerk_bearer")) }}
{{- end }}
{{- if $binding.inspect }}{{ $endpointIds = append $endpointIds "forward-proxy" }}{{ end }}
{{- $modes := list }}
{{- range $source := $binding.credentialSources }}
{{- $modePermissions := list }}
{{- if eq $source "company" }}{{ $modePermissions = list (printf "provider:%s:company-use" $binding.providerId) }}{{ end }}
{{- $modes = append $modes (dict "source" $source "required_permissions" $modePermissions) }}
{{- end }}
{{- range $model := $binding.models }}
{{/* Canonical destination IDs match the resolved context and accounting. */}}
{{- $destination := dict "id" $model.name "kind" "model" "display_name" $model.displayName "endpoint_ids" $endpointIds "profile_ids" $binding.profiles "required_permissions" (get $binding.modelBindings $model.name).required_permissions "credential_modes" $modes }}
{{- if $binding.providerId }}{{ $_ := set $destination "provider_id" $binding.providerId }}{{ end }}
{{- $_ := set $modelDestinations $model.name $destination }}
{{- end }}
{{- end }}
{{- range $id := keys $modelDestinations | sortAlpha }}
{{- $destinations = append $destinations (get $modelDestinations $id) }}
{{- end }}
{{- if .Values.aiGateway.proxy.enabled }}
{{- $endpoints = append $endpoints (dict "id" "forward-proxy" "url" (printf "https://%s:%d" .Values.aiGateway.proxy.hostname (int .Values.aiGateway.proxy.publicPort)) "entry_mode" "forward_proxy" "caller_auth_modes" (list "proxy_basic")) }}
{{- end }}
{{- $legacyModels := list }}
{{- range $model := include "infra-agentgateway.effectiveModels" . | fromYamlArray }}
{{/* New bindings own the canonical catalog row. Legacy compatibility continues
on /v1, but never duplicates the canonical model or weakens its new mode grant. */}}
{{- if not (hasKey $modelDestinations $model.name) }}{{ $legacyModels = append $legacyModels $model }}{{ end }}
{{- end }}
{{- if and $legacyModels .Values.externalGateway.enabled }}
{{- $endpoints = append $endpoints (dict "id" "legacy-api" "url" (printf "%s/v1" $origin) "entry_mode" "api" "caller_auth_modes" (list "legacy")) }}
{{- range $model := $legacyModels }}
{{- $source := ternary "none" "company" (eq (toJson $model.local) "true") }}
{{- $destinations = append $destinations (dict "id" $model.name "kind" "model" "display_name" $model.name "endpoint_ids" (list "legacy-api") "profile_ids" (list "legacy-model-api") "required_permissions" (list "llm:invoke" (printf "model:%s:invoke" $model.name)) "credential_modes" (list (dict "source" $source "required_permissions" (list)))) }}
{{- end }}
{{- end }}
{{- if and .Values.mcp.enabled .Values.externalGateway.enabled }}
{{- range $server := include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if or (not $server.contextforge) (has $server.name $.Values.mcp.contextforgeRoutesEnabled) }}
{{- $id := printf "mcp-%s" $server.name }}
{{- $endpoints = append $endpoints (dict "id" $id "url" (printf "%s/mcp/%s" $origin $server.name) "entry_mode" "api" "caller_auth_modes" (list "legacy")) }}
{{- $destinations = append $destinations (dict "id" $server.name "kind" "mcp" "display_name" ($server.displayName | default $server.name) "endpoint_ids" (list $id) "profile_ids" (list "legacy-mcp") "required_permissions" (list "llm:invoke" (printf "mcp:%s:invoke" $server.name)) "credential_modes" (list (dict "source" "none" "required_permissions" (list)))) }}
{{- end }}
{{- end }}
{{- end }}
{{- if or (gt (len $endpoints) 32) (gt (len $destinations) 500) (gt (len $profiles) 128) }}{{ fail "effective AI gateway catalog exceeds Studio's bounded configuration contract" }}{{ end }}
{{- $catalog := dict "schema_version" 1 "policy_revision" $revision "endpoints" $endpoints "destinations" $destinations "profiles" $profiles }}
{{- $_ := set $catalog "catalog_revision" (sha256sum (toJson $catalog)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-catalog-config-map
  namespace: frontend-studio
  labels:
    app.kubernetes.io/name: gateway-catalog
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
data:
  catalog.json: {{ $catalog | toJson | quote }}
{{- end }}
