{{- if .Values.externalGateway.enabled }}
{{- $hostname := required "external Gateway hostname is required" .Values.infraAgentgatewayWrapper.hostname }}
{{- if eq $hostname "place.holder" }}{{ fail "place.holder cannot be used for an external Gateway" }}{{ end }}
{{- $issuer := ternary "letsencrypt-production-cluster-issuer" "letsencrypt-staging-cluster-issuer" .Values.publicCertificates.useProduction }}
# =============================================================================
# AgentGateway External Gateway (Traefik class)
#
# Terminates TLS from the internet via cert-manager Let's Encrypt,
# then forwards plain HTTP to the internal AgentGateway envoy proxy
# (infra-agentgateway-gateway, class: agentgateway) for JWT/API key auth
# and LLM provider routing.
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra-agentgateway-external-gateway
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: external-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer | quote }}
    cert-manager.io/duration: "2160h"
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      port: {{ .Values.infraAgentgatewayWrapper.ports.gateway.tls }}
      protocol: HTTPS
      hostname: {{ $hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: infra-agentgateway-tls
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
