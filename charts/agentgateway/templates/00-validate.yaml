{{- $engine := .Values.guardrails.llmPolicyEngine -}}
{{- if ne $engine.credentialContextEnabled true -}}
  {{- fail "guardrails.llmPolicyEngine.credentialContextEnabled is required for this Base release" -}}
{{- end -}}
{{- $_ := include "infra-agentgateway.attachmentPolicy" . -}}
{{- if not (kindIs "bool" .Values.docling.enabled) -}}
  {{- fail "docling.enabled must be boolean" -}}
{{- end -}}
{{- if .Values.docling.enabled -}}
{{- $wait := .Values.docling.syncWaitSeconds -}}
{{- if or (not (regexMatch `^[1-9][0-9]*$` (toJson $wait))) (gt (float64 $wait) 3660.0) -}}
  {{- fail "docling.syncWaitSeconds must be positive integer seconds at most 3660" -}}
{{- end -}}
{{- end -}}
{{- $models := include "infra-agentgateway.effectiveModels" . | fromYamlArray -}}
{{- if gt (len $models) 256 -}}
{{-   fail "effective model catalog supports at most 256 destinations" -}}
{{- end -}}
{{- if and (gt (len $models) 0) (not $engine.enabled) -}}
{{-   fail "guardrails.llmPolicyEngine.enabled must be true when model destinations are configured" -}}
{{- end -}}
{{- $modelIds := dict -}}
{{- $modelResourceNames := dict -}}
{{- range $model := $models -}}
{{-   $modelName := required "guardrails.llmPolicyEngine.models[].name is required" $model.name -}}
{{-   if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$" $modelName) -}}
{{-     fail (printf "model name %q must be safe for model:<name>:invoke permissions" $modelName) -}}
{{-   end -}}
{{-   if hasKey $modelIds $modelName -}}
{{-     fail (printf "model name %q is duplicated" $modelName) -}}
{{-   end -}}
{{-   $_ := set $modelIds $modelName true -}}
{{-   range $field := list "piiEnabled" "contentTracingEnabled" -}}
{{-     if and (hasKey $model $field) (not (kindIs "bool" (get $model $field))) -}}
{{-       fail (printf "model %q %s must be a boolean" $modelName $field) -}}
{{-     end -}}
{{-   end -}}
{{-   $piiEnabled := true -}}
{{-   if hasKey $model "piiEnabled" -}}
{{-     $piiEnabled = $model.piiEnabled -}}
{{-   end -}}
{{-   if hasKey $model "attachmentMode" -}}
{{-     if not (kindIs "string" $model.attachmentMode) -}}
{{-       fail (printf "model %q attachmentMode must be a string: block, extract, or passthrough" $modelName) -}}
{{-     end -}}
{{-     if not (has $model.attachmentMode (list "block" "extract" "process" "passthrough")) -}}
{{-       fail (printf "model %q attachmentMode must be block, extract, process, or passthrough" $modelName) -}}
{{-     end -}}
{{-     if and (eq $model.attachmentMode "passthrough") $piiEnabled -}}
{{-       fail (printf "model %q attachmentMode passthrough requires piiEnabled:false" $modelName) -}}
{{-     end -}}
{{-   end -}}
{{-   if and $model.piiReroute (not $piiEnabled) -}}
{{-     fail (printf "model %q sets piiReroute:true but piiEnabled:false" $modelName) -}}
{{-   end -}}
{{-   $resourceName := include "infra-agentgateway.modelResourceName" $modelName -}}
{{-   $generatedNames := list $resourceName -}}
{{-   if $model.piiReroute -}}
{{-     $generatedNames = append $generatedNames (printf "%s-remote" $resourceName) -}}
{{-     $generatedNames = append $generatedNames (printf "%s-local" $resourceName) -}}
{{-   end -}}
{{-   range $generatedName := $generatedNames -}}
{{-     if or (gt (len $generatedName) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $generatedName)) -}}
{{-       fail (printf "model %q generates invalid AgentgatewayModel name %q" $modelName $generatedName) -}}
{{-     end -}}
{{-     range $segment := splitList "." $generatedName -}}
{{-       if gt (len $segment) 63 -}}
{{-         fail (printf "model %q generates AgentgatewayModel name %q with a DNS segment longer than 63 characters" $modelName $generatedName) -}}
{{-       end -}}
{{-     end -}}
{{-     $labelValue := printf "model-%s" $generatedName -}}
{{-     if or (gt (len $labelValue) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9_.]*[a-z0-9])?$" $labelValue)) -}}
{{-       fail (printf "model %q generates invalid app.kubernetes.io/name label %q" $modelName $labelValue) -}}
{{-     end -}}
{{-     if hasKey $modelResourceNames $generatedName -}}
{{-       fail (printf "models %q and %q generate the same AgentgatewayModel name %q" (get $modelResourceNames $generatedName) $modelName $generatedName) -}}
{{-     end -}}
{{-     $_ := set $modelResourceNames $generatedName $modelName -}}
{{-   end -}}
{{- end -}}

{{- $piiCatalog := dict -}}
{{- $attachmentModes := dict -}}
{{- range $model := $models -}}
{{-   $piiEnabled := true -}}
{{-   if hasKey $model "piiEnabled" -}}{{- $piiEnabled = $model.piiEnabled -}}{{- end -}}
{{-   $_ := set $piiCatalog $model.name $piiEnabled -}}
{{-   if hasKey $model "attachmentMode" -}}
{{-     $_ := set $attachmentModes $model.name $model.attachmentMode -}}
{{-   end -}}
{{- end -}}
{{- if gt (len ($piiCatalog | toJson)) 16384 -}}
{{-   fail "compact PII destination metadata JSON exceeds the 16384-byte AgentGateway limit" -}}
{{- end -}}
{{- if gt (len ($attachmentModes | toJson)) 16384 -}}
{{-   fail "attachment mode destination metadata JSON exceeds the 16384-byte AgentGateway limit" -}}
{{- end -}}

{{- range $index, $source := .Values.infraAgentgatewayWrapper.modelCatalog.sources | default list -}}
{{-   if not (kindIs "map" $source) -}}
{{-     fail (printf "infraAgentgatewayWrapper.modelCatalog.sources[%d] must be a map" $index) -}}
{{-   end -}}
{{-   $configMap := get $source "configMap" -}}
{{-   if not (kindIs "map" $configMap) -}}
{{-     fail (printf "infraAgentgatewayWrapper.modelCatalog.sources[%d].configMap is required" $index) -}}
{{-   end -}}
{{-   $name := required (printf "infraAgentgatewayWrapper.modelCatalog.sources[%d].configMap.name is required" $index) (get $configMap "name") -}}
{{-   if or (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $name)) -}}
{{-     fail (printf "infraAgentgatewayWrapper.modelCatalog.sources[%d].configMap.name %q must be a valid DNS subdomain" $index $name) -}}
{{-   end -}}
{{-   $key := required (printf "infraAgentgatewayWrapper.modelCatalog.sources[%d].configMap.key is required" $index) (get $configMap "key") -}}
{{-   if or (gt (len $key) 253) (not (regexMatch "^[-._a-zA-Z0-9]+$" $key)) -}}
{{-     fail (printf "infraAgentgatewayWrapper.modelCatalog.sources[%d].configMap.key %q is invalid" $index $key) -}}
{{-   end -}}
{{- end -}}

{{- $mcpProtocolVersion := .Values.mcp.protocolVersion | default "" -}}
{{- if not (has $mcpProtocolVersion (list "2025-11-25" "2026-07-28")) -}}
{{-   fail "mcp.protocolVersion must be 2025-11-25 or 2026-07-28" -}}
{{- end -}}
{{- $mcpServers := include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray -}}
{{- if not (kindIs "slice" .Values.mcp.contextforgeRoutesEnabled) -}}{{ fail "mcp.contextforgeRoutesEnabled must be a list" }}{{- end -}}
{{- $selectedNative := list -}}
{{- range $mcpServers -}}{{- if .contextforge -}}{{- $selectedNative = append $selectedNative .name -}}{{- end -}}{{- end -}}
{{- range .Values.mcp.contextforgeRoutesEnabled -}}
{{- if not (has . $selectedNative) -}}{{ fail "Enabled native routes must reference selected native catalog entries" }}{{- end -}}
{{- end -}}
{{- if and .Values.mcp.enabled (gt (len $mcpServers) 0) (not $engine.enabled) -}}
{{-   fail "guardrails.llmPolicyEngine.enabled must be true when MCP destinations are configured" -}}
{{- end -}}
{{- $mcpIds := dict -}}
{{- $nativeServerIds := dict -}}
{{- $nativeGatewayIds := dict -}}
{{- $legacyMcp := not (empty .Values.mcp.servers) -}}
{{- $upstreamIds := dict -}}
{{- range include "infra-agentgateway.mcpUpstreamWorkloads" . | fromYamlArray -}}{{- $_ := set $upstreamIds .name true -}}{{- end -}}
{{- range $server := $mcpServers -}}
{{-   $serverId := required "mcp server requires name" $server.name -}}
{{-   if or (gt (len $serverId) 48) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$" $serverId)) -}}
{{-     fail (printf "mcp server %q name must be a 1-48 character lowercase ASCII DNS subdomain" $serverId) -}}
{{-   end -}}
{{-   if $server.workload -}}
{{-     $containerName := printf "mcp-%s" $serverId -}}
{{-     $serviceName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverId "component" "svc") -}}
{{-     if or (gt (len $containerName) 63) (gt (len $serviceName) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $containerName)) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $serviceName)) -}}
{{-       fail (printf "mcp workload server %q must render directly to valid DNS-label Service and container names" $serverId) -}}
{{-     end -}}
{{-   end -}}
{{-   if hasKey $mcpIds $serverId -}}
{{-     fail (printf "mcp server name %q is duplicated" $serverId) -}}
{{-   end -}}
{{-   $_ := set $mcpIds $serverId true -}}
{{-   if hasKey $server "contextforge" -}}
{{-     $native := $server.contextforge -}}
{{-     if not (kindIs "map" $native) -}}
{{-       fail (printf "mcp server %q contextforge must be a map" $serverId) -}}
{{-     end -}}
{{-     range $field, $_ := $native -}}
{{-       if or (not (has $field (list "serverId" "provider" "authenticationModel" "gatewayId"))) (and $legacyMcp (eq $field "gatewayId")) -}}
{{-         fail (printf "mcp server %q contextforge field %q is unsupported; gateway IDs and credentials are catalog-management only" $serverId $field) -}}
{{-       end -}}
{{-     end -}}
{{-     range $field := list "host" "workload" "path" "port" "protocol" "tls" "upstreamAuth" -}}
{{-       if hasKey $server $field -}}
{{-         fail (printf "mcp server %q contextforge cannot set %s" $serverId $field) -}}
{{-       end -}}
{{-     end -}}
{{-     if and (get ($.Values.infraAgentgatewayWrapperSecrets.mcp | default dict) $serverId) (not (hasKey $upstreamIds $serverId)) -}}
{{-       fail (printf "mcp server %q contextforge cannot receive gateway credential secrets; shared credentials stay in the upstream service" $serverId) -}}
{{-     end -}}
{{-     if or (not (kindIs "string" $native.serverId)) (not (regexMatch "^[0-9a-f]{32}$" (toString $native.serverId))) -}}
{{-       fail (printf "mcp server %q contextforge.serverId must be exactly 32 lowercase hex characters" $serverId) -}}
{{-     end -}}
{{-     if hasKey $nativeServerIds $native.serverId -}}
{{-       fail "ContextForge native server IDs must be unique across platform MCP destinations" -}}
{{-     end -}}
{{-     $_ := set $nativeServerIds $native.serverId true -}}
{{-     if and $legacyMcp (eq $native.authenticationModel "individual-authentication") -}}
{{-       fail "legacy mcp.servers does not support individual-authentication; migrate explicitly to mcp.catalog; this does not fix Base #424" -}}
{{-     end -}}
{{-     if and $native.gatewayId (or (not (kindIs "string" $native.gatewayId)) (not (regexMatch "^[0-9a-f]{32}$" (toString $native.gatewayId)))) -}}
{{-       fail "ContextForge gatewayId must be an exact 32 lowercase hex native UUID" -}}
{{-     end -}}
{{-     if $native.gatewayId -}}
{{-       if hasKey $nativeGatewayIds $native.gatewayId -}}{{- fail "ContextForge native gateway IDs must be unique across catalog entries" -}}{{- end -}}
{{-       $_ := set $nativeGatewayIds $native.gatewayId true -}}
{{-     end -}}
{{-     if or (not (kindIs "string" $native.provider)) (not (regexMatch "^[a-z0-9][a-z0-9-]{0,47}$" (toString $native.provider))) -}}
{{-       fail "ContextForge provider must be a generic lowercase identifier" -}}
{{-     end -}}
{{-     if not (has $native.authenticationModel (list "no-authentication" "shared-authentication" "individual-authentication")) -}}
{{-       fail "ContextForge authenticationModel must be no-authentication, shared-authentication or individual-authentication" -}}
{{-     end -}}
{{-   end -}}
{{-   range $field := list "piiEnabled" "contentTracingEnabled" -}}
{{-     if and (hasKey $server $field) (not (kindIs "bool" (get $server $field))) -}}
{{-       fail (printf "mcp server %q %s must be a boolean" $serverId $field) -}}
{{-     end -}}
{{-   end -}}
{{- end -}}
