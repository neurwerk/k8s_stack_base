{{- if (index .Values "mcp-servers").enabled }}
{{- range include "infra-agentgateway.effectiveMcpServers" . | fromYamlArray }}
{{- if or (not .contextforge) (has .name (index $.Values "mcp-servers").contextforgeRoutesEnabled) }}
{{- $serverName := .name }}
{{- $routeName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "route") }}
{{- $backendName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "be") }}
{{- $policyName := include "infra-agentgateway.mcpResourceName" (dict "id" $serverName "component" "policy") }}
{{- $permission := printf "mcp:%s:invoke" .name }}
{{- $binding := dict "id" (printf "mcp-%s" .name) "prefix" "/mcp" "kind" "mcp" "providerId" nil "local" true "credentialSources" (list "none") "requiredPermission" $permission "operations" (list (dict "profile" "mcp-streamable-http-v1" "id" "exchange" "paths" (list (printf "/%s" .name)))) }}
{{- $entry := dict "mode" "api" }}
{{- $context := dict "binding" $binding "entry" $entry "operation" (first $binding.operations) }}
{{- $authorization := include "infra-agentgateway.routeAuthorization" (dict "root" $ "binding" $binding "entry" $entry) }}
{{- $piiEnabled := true }}
{{- if hasKey . "piiEnabled" }}{{- $piiEnabled = .piiEnabled }}{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  parentRefs:
    - name: infra-agentgateway-gateway
      sectionName: api-bindings
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ printf "/mcp/%s" .name | quote }}
      backendRefs:
        - name: {{ $backendName }}
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# Gateway authentication freezes identity; this route owns destination admission.
# AgentGateway's MCP parser and the
# fail-closed route extProc own protocol validation; piiEnabled controls analysis.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $policyName }}
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: mcp-{{ $serverName }}
    app.kubernetes.io/instance: infra-agentgateway
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $routeName }}
  traffic:
    phase: PostRouting
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - {{ $authorization | quote }}
    extProc:
      backendRef:
        group: ""
        kind: Service
        name: monitor-agentgateway-extproc-service
        namespace: monitor-agentgateway-extproc
        port: {{ $.Values.guardrails.llmPolicyEngine.extProcPort | default 9000 }}
      failureMode: FailClosed
      metadataContext:
        agentgateway.dev.grpc_initial_metadata:
          x-request-id: 'metadata.neurwerk_identity.request_id'
        neurwerk.destination_policy:
          contract_version: '5'
          request_context: >-
            {{- include "infra-agentgateway.routeAdmissionContext" $context | nindent 12 }}
          model_bindings: '{}'
          destination_policy: >-
            {"contract_version": 1, "destination_kind": "mcp",
            "principal_id": metadata.neurwerk_identity.principal_id,
            "destination_id": {{ .name | toJson }}, "pii_enabled": {{ $piiEnabled }},
            "content_tracing_enabled": {{ .contentTracingEnabled | default false }}
            {{- if .contextforge }}, "contextforge": true,
            "account_email": metadata.neurwerk_identity.account_email
            {{- end }}}
      processingOptions:
        requestBodyMode: Buffered
        responseBodyMode: FullDuplexStreamed
        allowModeOverride: true
    transformation:
      request:
        metadata:
          neurwerk_admission: >-
            {{- include "infra-agentgateway.routeAdmissionContext" $context | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
