{{- $models := include "infra-agentgateway.effectiveModels" . | fromYamlArray }}
{{- if and .Values.guardrails.llmPolicyEngine.enabled $models }}
{{- $piiCatalog := dict }}
{{- $attachmentModes := dict }}
{{- $attachmentPolicy := include "infra-agentgateway.attachmentPolicy" . | fromJson }}
{{- range $model := $models }}
{{-   $piiEnabled := true }}
{{-   if hasKey $model "piiEnabled" }}{{- $piiEnabled = $model.piiEnabled }}{{- end }}
{{-   $_ := set $piiCatalog $model.name $piiEnabled }}
{{-   if hasKey $model "attachmentMode" }}
{{-     $_ := set $attachmentModes $model.name $model.attachmentMode }}
{{-   end }}
{{- end }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: infra-agentgateway-policy-extproc
  namespace: infra-agentgateway
  labels:
    app.kubernetes.io/name: extproc-policy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-agentgateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra-agentgateway-gateway
      sectionName: websecure
  traffic:
    phase: PreRouting
    # This Gateway policy owns model requests. Exact MCP routes have separate
    # PostRouting policies and destination metadata.
    extProc:
      conditional:
        - condition: 'request.method == "POST" && request.path.startsWith("/v1/")'
          policy:
            backendRef:
              group: ""
              kind: Service
              name: monitor-agentgateway-extproc-service
              namespace: monitor-agentgateway-extproc
              port: {{ .Values.guardrails.llmPolicyEngine.extProcPort | default 9000 }}
            failureMode: FailClosed
            metadataContext:
              neurwerk.destination_policy:
                contract_version: {{ .Values.guardrails.llmPolicyEngine.attachmentPolicyVersion | toString | quote }}
                destination_kind: '"model"'
                principal_id: 'has(jwt.sub) ? jwt.sub : extauthz.principal_id'
                models: {{ $piiCatalog | toJson | quote }}
                {{- if $attachmentModes }}
                attachment_modes: {{ $attachmentModes | toJson | quote }}
                {{- end }}
                {{- if ge (int .Values.guardrails.llmPolicyEngine.attachmentPolicyVersion) 2 }}
                image_forwarding: {{ $attachmentPolicy.image_forwarding | toJson | quote }}
                face_protection: {{ $attachmentPolicy.face_protection | toJson | quote }}
                local_models: {{ $attachmentPolicy.local_models | toJson | quote }}
                {{- end }}
                {{- if eq (int .Values.guardrails.llmPolicyEngine.attachmentPolicyVersion) 3 }}
                image_models: {{ $attachmentPolicy.image_models | toJson | quote }}
                image_reroutes: {{ $attachmentPolicy.image_reroutes | toJson | quote }}
                {{- end }}
            processingOptions:
              requestBodyMode: Buffered
              responseBodyMode: FullDuplexStreamed
              # Mixed catalogs share one stream configuration. PII-disabled
              # model response phases remain valid no-ops when AgentGateway has
              # already scheduled them; only an all-disabled catalog can skip
              # response callbacks from the request-header phase.
              allowModeOverride: true
{{- end }}
