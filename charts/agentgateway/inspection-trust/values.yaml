# IMAGE SOURCE: first-party
agentgateway:
  inspection:
    enabled: false
    rootIds: [r1]
    trust:
      enabled: false
      # Verified Tooling 0.12.0 publisher; update its validation guard and the shared
      # Helm validation fixture together when adopting another verified release.
      image: ghcr.io/neurwerk/k8s-stack-tooling:0.12.0@sha256:b70f0f93ca2c3e5cef9290af2db6480bec72cedc0289ecd232747996eb01091a
      # initialize creates the first complete publication before Studio advertises
      # it. Thereafter stage, roll Studio to required_version, then promote.
      operation: stage
      # Ordered reviewed inventory. Each item: {id, fingerprintSha256, state}.
      # state is active or transitional. Only public root exports are selected.
      roots: []
      # Exact API service/backend CIDRs and ports, e.g. {cidr: 192.0.2.1/32, port: 6443}.
      kubernetesApiEgress: []
      studio:
        deployment: frontend-studio-api-deployment
        service: frontend-studio-api-service
        podPort: 4010
        podSelector:
          app.kubernetes.io/name: studio-api
          app.kubernetes.io/instance: frontend-studio-api
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 250m, memory: 256Mi}
