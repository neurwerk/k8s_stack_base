{{- if and .Values.agentgateway.inspection.enabled .Values.agentgateway.inspection.trust.enabled }}
{{- $trust := .Values.agentgateway.inspection.trust }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-inspection-trust-network-policy
  namespace: infra-agentgateway
  labels:
    {{- include "agentgateway-inspection-trust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-inspection-trust
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- range $trust.kubernetesApiEgress }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports: [{protocol: TCP, port: {{ .port }}}]
    {{- end }}
    {{- if eq $trust.operation "promote" }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: frontend-studio}
          podSelector:
            matchLabels:
              {{- toYaml $trust.studio.podSelector | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $trust.studio.podPort }}}]
    {{- end }}
{{- end }}
