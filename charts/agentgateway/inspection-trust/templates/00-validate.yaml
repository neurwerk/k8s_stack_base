{{- $inspection := .Values.agentgateway.inspection -}}
{{- $trust := $inspection.trust -}}
{{- if or (not (kindIs "bool" $inspection.enabled)) (not (kindIs "bool" $trust.enabled)) }}{{ fail "inspection and trust enabled flags must be boolean" }}{{- end }}
{{- if and $trust.enabled (not $inspection.enabled) }}{{ fail "trust publication requires agentgateway.inspection.enabled" }}{{- end }}
{{- if and $inspection.enabled $trust.enabled -}}
{{- if ne $trust.image "ghcr.io/neurwerk/k8s-stack-tooling:0.15.6@sha256:2cfe62109c8067e08a81f422733e6673ef3eb0ee11066f72e7316878a76013db" }}{{ fail "trust publication requires the verified Tooling 0.15.6 publisher image" }}{{- end }}
{{- if not (has $trust.operation (list "initialize" "stage" "promote")) }}{{ fail "trust operation must be initialize, stage or promote" }}{{- end }}
{{- if or (lt (len $trust.roots) 1) (gt (len $trust.roots) 16) }}{{ fail "trust inventory must contain 1 to 16 roots" }}{{- end }}
{{- $seen := dict -}}
{{- $fingerprints := dict -}}
{{- range $root := $trust.roots -}}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,14}[a-z0-9])?$" $root.id)) (not (has $root.id $inspection.rootIds)) }}{{ fail "trust root ID must select a declared inspection root generation" }}{{- end }}
{{- if or (hasKey $seen $root.id) (hasKey $fingerprints $root.fingerprintSha256) }}{{ fail "trust root IDs and fingerprints must be unique" }}{{- end }}
{{- $_ := set $seen $root.id true -}}
{{- $_ := set $fingerprints $root.fingerprintSha256 true -}}
{{- if not (regexMatch "^[0-9a-f]{64}$" $root.fingerprintSha256) }}{{ fail "trust fingerprint must be 64 lowercase hex digits" }}{{- end }}
{{- if not (has $root.state (list "active" "transitional")) }}{{ fail "trust root state must be active or transitional" }}{{- end }}
{{- end -}}
{{- if empty $trust.kubernetesApiEgress }}{{ fail "trust publication requires exact Kubernetes API egress destinations" }}{{- end }}
{{- range $peer := $trust.kubernetesApiEgress -}}
{{- if or (empty $peer.cidr) (has $peer.cidr (list "0.0.0.0/0" "::/0")) (lt (int $peer.port) 1) (gt (int $peer.port) 65535) }}{{ fail "trust Kubernetes API egress requires bounded CIDRs and ports" }}{{- end }}
{{- end -}}
{{- if or (empty $trust.studio.podSelector) (empty $trust.studio.deployment) (empty $trust.studio.service) (lt (int $trust.studio.podPort) 1) (gt (int $trust.studio.podPort) 65535) }}{{ fail "trust publication requires an exact Studio replica target" }}{{- end }}
{{- end -}}
