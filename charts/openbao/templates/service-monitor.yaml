apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infra-openbao-service-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infra-openbao
    release: monitor-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      monitoring.neurwerk.com/openbao: "true"
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: https
      scheme: https
      path: /v1/sys/metrics
      params:
        format: [prometheus]
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        serverName: infra-openbao.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ .Values.infraOpenbaoWrapper.tls.secretName }}
            key: ca.crt
