{{- if .Values.mcp.studioSetup.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-mcp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: infra-openbao
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: frontend-studio}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio-api
              app.kubernetes.io/instance: frontend-studio-api
      ports: [{protocol: TCP, port: 8200}]
{{- end }}
