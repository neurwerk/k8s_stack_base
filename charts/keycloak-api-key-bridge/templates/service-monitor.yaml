apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-keycloak-api-key-bridge-service-monitor
  namespace: auth-keycloak-api-key-bridge
  labels:
    {{- include "auth-keycloak-api-key-bridge.labels" . | nindent 4 }}
    release: monitor-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "auth-keycloak-api-key-bridge.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
