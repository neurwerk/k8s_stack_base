{{- if ne .Values.authKeycloakApiKeyBridge.bridgeImage "ghcr.io/neurwerk/k8s-stack-keycloak-api-key-bridge:0.8.0@sha256:02db93c4b824391de00929d33b2adc6b459b20d4cb4163ef8924ac112f288d5a" }}
{{- fail "bridge requires the verified PostgreSQL-compatible 0.8.0 image pin" }}
{{- end }}
{{- if or (hasKey .Values.authKeycloakApiKeyBridge.postgres "enabled") (hasKey .Values.authKeycloakApiKeyBridge "persistence") (hasKey .Values.authKeycloakApiKeyBridge.config "database_url") }}
{{- fail "bridge is PostgreSQL-only; remove legacy postgres.enabled, persistence and config.database_url values" }}
{{- end }}
# =============================================================================
# keycloak-api-key-bridge Deployment
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-keycloak-api-key-bridge-service-account
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth-keycloak-api-key-bridge.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-keycloak-api-key-bridge-deployment
  namespace: auth-keycloak-api-key-bridge
  annotations:
    ignore-check.kube-linter.io/non-existent-service-account: "Rendered by this chart."
    secret.reloader.stakater.com/reload: "auth-keycloak-api-key-bridge-openbao-secret,auth-keycloak-api-key-bridge-postgres-secret"
  labels:
    {{- include "auth-keycloak-api-key-bridge.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "auth-keycloak-api-key-bridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth-keycloak-api-key-bridge.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: auth-keycloak-api-key-bridge-service-account
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ .Values.authKeycloakApiKeyBridge.securityContext.runAsUser }}
        runAsGroup: {{ .Values.authKeycloakApiKeyBridge.securityContext.runAsGroup }}
        runAsNonRoot: {{ .Values.authKeycloakApiKeyBridge.securityContext.runAsNonRoot }}
        fsGroup: {{ .Values.authKeycloakApiKeyBridge.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: keycloak-api-key-bridge-init-db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: {{ .Values.authKeycloakApiKeyBridge.bridgeImage | quote }}
          imagePullPolicy: Always
          command: ["keycloak-api-key-bridge-init-db"]
          env:
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_HOST
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.host | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_PORT
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.port | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_DATABASE
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.database | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_USER
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.user | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-api-key-bridge-postgres-secret
                  key: password
      containers:
        - name: keycloak-api-key-bridge
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          image: {{ .Values.authKeycloakApiKeyBridge.bridgeImage | quote }}
          imagePullPolicy: Always
          env:
            - name: KEYCLOAK_API_KEY_BRIDGE_KEYCLOAK_URL
              value: "http://auth-keycloak-keycloak-service.auth-keycloak.svc.cluster.local"
            - name: KEYCLOAK_API_KEY_BRIDGE_KEYCLOAK_ISSUER
              value: {{ printf "https://%s/realms/%s" .Values.authKeycloak.hostname .Values.authKeycloak.realm | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_KEYCLOAK_REALM
              value: {{ .Values.authKeycloak.realm | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_KEYCLOAK_CLIENT_ID
              value: "keycloak-api-key-bridge"
            - name: KEYCLOAK_API_KEY_BRIDGE_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-api-key-bridge-openbao-secret
                  key: KEYCLOAK_API_KEY_BRIDGE_KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_HOST
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.host | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_PORT
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.port | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_DATABASE
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.database | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_USER
              value: {{ .Values.authKeycloakApiKeyBridge.postgres.user | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-api-key-bridge-postgres-secret
                  key: password
            - name: KEYCLOAK_API_KEY_BRIDGE_MAX_KEYS_PER_USER
              value: {{ .Values.authKeycloakApiKeyBridge.config.max_keys_per_user | quote }}
            - name: KEYCLOAK_API_KEY_BRIDGE_LOG_LEVEL
              value: {{ .Values.authKeycloakApiKeyBridge.config.log_level | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.authKeycloakApiKeyBridge.ports.container.http }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            {{- toYaml .Values.authKeycloakApiKeyBridge.resources | nindent 12 }}
