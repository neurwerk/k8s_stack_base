# ── Keycloak OIDC (used by the secret template) ──────────────────────────────
authKeycloak:
  hostname: ""
  realm: ""

# ── Chart own values ────────────────────────────────────────────────────────
authKeycloakApiKeyBridge:
  bridgeImage: ghcr.io/neurwerk/k8s-stack-keycloak-api-key-bridge:0.8.1@sha256:6ffd0e45adfefefca7761aa6568dd0215899cbaf0792d93f958fadc7efa674a9
  hostname: ""

  # Add-on-owned, namespace-local files; no managed keys are configured by Base.
  # Each entry has grantConfigMap, grantKey, verifierSecret and verifierKey.
  # The ConfigMap holds a non-secret v2 grant; the Secret holds its SHA-256 verifier.
  # Requires the verified bridge image supporting MANAGED_REGISTRATIONS.
  managedRegistrations: []

  ports:
    container:
      http: 8000
    service:
      http: 3010

  config:
    log_level: "warning"
    max_keys_per_user: 20

  # Required operations PostgreSQL database; password comes only from the
  # namespace-local auth-keycloak-api-key-bridge-postgres-secret.
  postgres:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    port: 5432
    database: api_key_bridge
    user: api_key_bridge

  # Resource requests/limits (overridden by base-shared-resources-config-map)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
