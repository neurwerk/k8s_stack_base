# ── Keycloak OIDC (used by the secret template) ──────────────────────────────
authKeycloak:
  hostname: ""
  realm: ""
  agentgatewayClientRoles: []

# Shared client values also supply the Gateway's opt-in discovery approvals.
aiGateway:
  approvedOidcClients: []
self-hosted-api-providers: []
external-api-providers: []

# Platform-owned OpenRouter entries derive the complete role catalog.
openrouterCatalog:
  enabled: true
  excludedModels: []
  grantToAccessGroups: false
  models: []

# ── Chart own values ────────────────────────────────────────────────────────
authKeycloakApiKeyBridge:
  bridgeImage: ghcr.io/neurwerk/k8s-stack-keycloak-api-key-bridge:0.10.3@sha256:65e87317b362a0256f6bccbab5dc9514dbbf81ccafbee52b5a4e81369a6ee6c8
  # Add-ons can register managed keys separately; Base requires none by default.
  managedRegistrations: []
  hostname: ""

  ports:
    container:
      http: 8000
    service:
      http: 3010

  config:
    log_level: "warning"
    max_keys_per_user: 20

  # Required operations PostgreSQL database; password comes only from the
  # namespace-local auth-keycloak-api-key-bridge-postgres-secret.
  postgres:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    port: 5432
    database: api_key_bridge
    user: api_key_bridge

  # Resource requests/limits (overridden by base-shared-resources-config-map)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
