# ── Keycloak OIDC (used by the secret template) ──────────────────────────────
authKeycloak:
  hostname: ""
  realm: ""
  agentgatewayClientRoles: []
  difyAgentgatewayClientId: dify-agentgateway
  difyAgentgatewayClientRoles: []

# Platform-owned OpenRouter entries derive the complete role set used for Dify
# managed-key subset validation. Client roles remain explicit for other models.
openrouterCatalog:
  enabled: true
  excludedModels: []
  grantToAccessGroups: false
  models: []

# ── Chart own values ────────────────────────────────────────────────────────
authKeycloakApiKeyBridge:
  bridgeImage: ghcr.io/neurwerk/k8s-stack-keycloak-api-key-bridge:0.8.0@sha256:02db93c4b824391de00929d33b2adc6b459b20d4cb4163ef8924ac112f288d5a
  hostname: ""

  ports:
    container:
      http: 8000
    service:
      http: 3010

  config:
    log_level: "info"
    max_keys_per_user: 20

  # Required operations PostgreSQL database; password comes only from the
  # namespace-local auth-keycloak-api-key-bridge-postgres-secret.
  postgres:
    host: postgres-operations.infra-postgres-operations.svc.cluster.local
    port: 5432
    database: api_key_bridge
    user: api_key_bridge

  # Resource requests/limits (overridden by base-shared-resources-config-map)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
