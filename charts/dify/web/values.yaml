# IMAGE SOURCE: ce-builder
# Base: langgenius/dify-web + dify_ce_builder Keycloak OIDC overlay
# Pinned here (chart defaults)
frontendDify:
  webImage: ghcr.io/neurwerk/addon-dify-ce-builder-web:1.15.0-kc-v2
  pullPolicy: IfNotPresent
  api:
    ports:
      container: { http: 5001 }
      service:   { http: 80 }
  webGui:
    ports:
      container: { http: 3000 }
      service:   { http: 80 }
      gateway:   { tls: 443 }
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  hostname: ""

externalGateway:
  enabled: false

publicCertificates:
  useProduction: false
